// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// [PHI-APP] An SDK without the build-tools the Android Gradle plugin asks for (35.0.0 for AGP 8.13)
// can build with the ones it has, in every module, the Capacitor plugins included:
//   ./gradlew assembleDebug -PandroidBuildTools=36.0.0
// Without the flag nothing changes. (The owner's PC has Visual Studio's read-only SDK, with 36.0.0.)
if (project.hasProperty('androidBuildTools')) {
    def tools = project.property('androidBuildTools')
    subprojects {
        plugins.withId('com.android.application') { android { buildToolsVersion = tools } }
        plugins.withId('com.android.library') { android { buildToolsVersion = tools } }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
