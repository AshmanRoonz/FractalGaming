<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Ship Sailing ; Offline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0520">
<!-- Served by sw.js when a page navigation cannot reach the network (the installed app launched
     offline, or the connection dropped between pages). It is cached by the worker, so it must be
     fully self-contained: no fonts, images or scripts from anywhere else. -->
<style>
  :root { --bg: #050510; --text: #d8d8e0; --text-dim: #888899; --accent: #ffaa00; --accent-dim: rgba(255,170,0,0.35); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, rgba(255,170,0,0.06), transparent 60%), var(--bg);
  }
  .ring {
    width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 50%;
    border: 2px solid var(--accent-dim); position: relative;
    box-shadow: 0 0 32px rgba(255,170,0,0.18);
  }
  .ring::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent);
  }
  h1 {
    font-weight: 900; font-size: 20px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px; text-shadow: 0 0 24px var(--accent-dim);
  }
  p { color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 34em; margin: 0 auto 28px; }
  button {
    background: var(--accent); color: #050510; border: none; border-radius: 3px;
    padding: 14px 44px; font: 700 15px/1 inherit; letter-spacing: 4px; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 0 24px rgba(255,170,0,0.4);
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>No Signal</h1>
    <p>Last Ship Sailing needs a connection to load the game and to find other pilots.
       Reconnect and it will pick up from here.</p>
    <button type="button" id="retry">Retry</button>
  </main>
<script>
  // Reload the address that failed (the worker answered it with this page, so location is still
  // the page the player asked for), and do it by itself the moment the connection comes back.
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
