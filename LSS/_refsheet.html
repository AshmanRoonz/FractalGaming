<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>ref sheet</title>
<style>
  html,body{margin:0;background:#0a0d14;color:#cfe;font:12px/1.3 system-ui,sans-serif;}
  #grid{display:grid;gap:6px;padding:6px;}
  .cell{position:relative;background:#000;}
  .cell .tiles{display:grid;grid-template-columns:repeat(2,1fr);line-height:0;}
  .cell img{width:100%;image-rendering:auto;display:block;}
  .cap{position:absolute;left:0;top:0;background:rgba(0,0,0,.72);color:#ffd27a;
       padding:3px 7px;font-weight:700;letter-spacing:.04em;font-size:13px;z-index:2;}
  .note{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.72);color:#9fd;
        padding:3px 7px;font-size:11px;z-index:2;}
  #hdr{padding:4px 8px;background:#111827;color:#ffaa00;font-weight:700;letter-spacing:.08em;}
</style></head><body>
<div id="hdr"></div>
<div id="grid"></div>
<script>
const SITES = {
 // ── CITY MORPHOLOGY ──────────────────────────────────────────────────────

 ],

 ],

  ['Rio de Janeiro',   -22.9700, -43.1850,  'granite domes + beach arcs + favela'],
  ['Stockholm',         59.3280,  18.0680,  'archipelago fragments'],
  ['Cairo / Nile',      30.0450,  31.2350,  'hard desert/irrigation boundary'],
  ['Dubai Marina',      25.0800,  55.1400,  'linear coastal strip + fake islands'],
 ],
 sprawl: [

  ['Mexico City',       19.4300,  -99.1350, 'basin-filling grid to the mountains'],
  ['Sao Paulo',        -23.5600,  -46.6500, 'towers everywhere, no single core'],
  ['Shenzhen',          22.5400, 114.0600,  'new-town superblocks + green wedges'],
  ['Brasilia',         -15.7940,  -47.8880, 'modernist plan: a diagram, not a city'],
  ['Toronto',           43.6480,  -79.3850, 'grid + ravines + lakefront wall'],
 ],
 detail: [
  ['Manhattan Midtown',40.7540, -73.9840, 'z18: tower footprints, setbacks, roof clutter'],
  ['Paris Opera',       48.8710,   2.3320, 'z18: courtyard blocks, zinc roofs, boulevards'],
  ['Tokyo Ginza',       35.6720, 139.7660, 'z18: tiny parcels, no setback, alleys'],
  ['Dubai Downtown',    25.1960,  55.2740, 'z18: isolated towers + podium + parking'],
  ['London City',       51.5150,  -0.0900, 'z18: medieval plan, modern towers inserted'],
  ['Singapore CBD',      1.2830, 103.8510, 'z18: towers + green roofs + water edge'],
 ],
 net: [
  ['Los Angeles',       34.0700, -118.3300, 'freeway + arterial hierarchy'],
  ['Paris',             48.8650,   2.3400,  'radial hierarchy'],
  ['Houston',           29.7600,  -95.3700, 'loop + radial freeways'],
  ['Berlin',            52.5150,  13.3900,  'ring + river + rail'],
  ['Atlanta',           33.7700,  -84.3900, 'perimeter ring + wedge'],
  ['Bangkok',           13.7500, 100.5100,  'canal-derived organic + expressway'],
 ],
 rural: [
  ['Tuscany',           43.3300,  11.4000,  'contour-following fields, hilltop towns'],
  ['Kansas Circles',    37.8000,-100.8000,  'centre-pivot circles in a section grid'],
  ['Dutch Polder',      52.5500,   5.5500,  'reclaimed: ruler-straight ditch lattice'],
  ['Bali Terraces',     -8.4300, 115.3100,  'contour paddies, radial subak'],
  ['French Bocage',     48.8000,  -1.1000,  'hedgerow cells, irregular, village nodes'],
  ['Alpine Valley',     46.5100,  11.3500,  'linear valley-floor village strings'],
 ],
 coast: [
  ['Outer Banks NC',    35.2500,  -75.5300, 'barrier island + lagoon + inlets'],
  ['Cape Cod',          41.7000,  -70.0500, 'glacial spit, hooked recurved end'],
  ['Croatia Dalmatia',  43.5000,  16.2000,  'parallel karst islands (concordant)'],
  ['Wadden Sea',        53.5000,   8.2000,  'tidal flats, braided channels'],
  ['Ha Long Bay',       20.9000, 107.1000,  'drowned karst towers in the sea'],
  ['Lofoten',           68.2000,  14.0000,  'steep island chain, no shelf'],
 ],
 infra: [
  ['Rotterdam Port',    51.9500,   4.1200,  'quays, basins, container yards, cranes'],
  ['Chicago Rail',      41.8300,  -87.6800, 'yard bundles, viaducts, industrial spine'],
  ['Hong Kong Airport', 22.3100, 113.9200,  'reclaimed rectangle, apron geometry'],
  ['Hoover Dam',        36.0150, -114.7380, 'dam, reservoir, transmission fan'],
  ['Panama Canal Locks', 9.0800,  -79.6800, 'cut, locks, spoil banks'],
  ['Chuquicamata Mine', -22.3000, -68.9000, 'open pit spiral + tailings'],
 ],
 infra2: [
  ['Venice Causeway',   45.4550,  12.2600,  'rail+road causeway across lagoon'],
  ['Istanbul Bridges',  41.0800,  29.0500,  'suspension spans, approach ramps'],
  ['Almeria Greenhouse',36.7800,  -2.6800,  'plastic sea — a whole landscape of roof'],
  ['Ruhr Industry',     51.4800,   7.2000,  'works, slag heaps, canal, dense towns'],
  ['Dhaka Informal',    23.7700,  90.4000,  'tin-roof density, no plan, water edge'],
  ['Las Vegas Strip',   36.1100, -115.1720, 'megastructures + parking oceans'],
 ],
 land3: [
  ['Mt Fuji',           35.3600, 138.7300,  'stratovolcano cone + radial gullies'],
  ['Badlands SD',       43.8500, -102.3500, 'fine dendritic rill, no soil'],
  ['Uluru',            -25.3450, 131.0300,  'inselberg on a plain'],
  ['Finland Drumlins',  62.5000,  27.0000,  'glacial lakes + eskers, no drainage'],
  ['Alluvial Fan Iran', 33.0000,  56.5000,  'fan apex at a range front'],
  ['Maldives Atolls',    3.2000,  73.0000,  'coral rings, lagoons, reef flats'],
 ],
 land4: [
  ['Mangrove Sundarbans',21.9000, 89.1000,  'tidal creek fractal in forest'],
  ['Loess Plateau',     36.5000, 109.5000,  'knife-edge gullies in soft ground'],
  ['Siberian Polygons', 72.0000, 126.0000,  'permafrost polygon ground'],
  ['Danakil Salt',      14.2000,  40.3000,  'salt pan + volcanic + evaporite'],
  ['Patagonia Glacier', -49.3000,-73.0000,  'icefield, calving front, moraine'],
  ['Deccan Traps',      18.5000,  73.5000,  'stepped basalt plateaux'],
 ],
 // ── TERRAIN ──────────────────────────────────────────────────────────────
 terrain1: [
  ['Nile Delta',        31.0000,  31.0000,  'distributary fan, razor desert edge'],
  ['Grand Canyon',      36.1000, -112.1000, 'dendritic incision into a plateau'],
  ['Norwegian Fjords',  62.1000,   7.0000,  'glacial U-valleys drowned'],
  ['Zagros Folds',      30.5000,  52.0000,  'parallel anticline ridges'],
  ['Namib Dunes',      -24.7000,  15.3000,  'linear/star dunes, wind-ruled'],
  ['Mississippi Meander',33.0000, -91.1000, 'oxbows + scroll bars on a floodplain'],
 ],
 terrain2: [
  ['Guilin Karst',      24.9000, 110.4000,  'tower karst, isolated cones'],
  ['Iceland Highlands', 64.6000, -19.0000,  'braided glacial outwash + volcanics'],
  ['Appalachian R&V',   40.5000,  -77.8000, 'ridge-and-valley zigzag'],
  ['Amazon Meanders',   -4.0000,  -70.0000, 'anastomosing river, oxbow lakes'],
  ['Alps Mont Blanc',   45.8500,   6.8600,  'aretes, cirques, valley towns'],
  ['Atacama',          -23.5000,  -68.5000, 'salars + volcanic cones, no water'],
 ],
};
// ZOOM LADDER targets: one point, seen at many scales, to test self-similarity.
const LADDER = {
  river:   [ -3.9000,  -70.2000, 'Amazon tributary network'],
  canyon:  [ 36.2000, -112.2000, 'Grand Canyon dendritic incision'],
  coastNW: [ 60.1600,    5.2600, 'Norway Bergen skerry coast'],
  alps:    [ 46.0200,    7.6200, 'Alpine ridge network'],
  dunes:   [-24.8000,   15.2000, 'Namib dune field'],
  tokyo:   [ 35.6820,  139.7600, 'Tokyo urban fabric'],
  la:      [ 34.0800, -118.3000, 'LA grid + hills'],
  paris:   [ 48.8660,    2.3330, 'Paris fabric'],
  delta:   [ 30.9000,   31.1000, 'Nile delta canal mesh'],
  karst:   [ 24.8500,  110.3500, 'Guilin karst'],
  braid:   [ 64.1000,  -19.5000, 'Iceland braided river'],
  reef:    [-16.8000,  146.0000, 'Great Barrier Reef'],
  fjord:   [ 61.9000,    6.9000, 'Norwegian fjord'],
  sahara:  [ 26.0000,   12.0000, 'Sahara erg + hamada'],
  mekong:  [ 10.1000,  105.8000, 'Mekong delta canal fractal'],
  volcano: [-16.7000,  -71.0000, 'Andean volcanic cones'],
};
const P = new URLSearchParams(location.search);
const key = P.get('p') || 'grid';
const Z = +(P.get('z') || 14);
const LAYER = P.get('layer') || 'World_Imagery';
const COLS = +(P.get('cols') || 3);
const TS = +(P.get('ts') || 256);
let list;
const AT = P.get('at');           // ?at=lat,lng  — one place, full resolution
const LAD = P.get('lad');
if (AT) {
  const [la, ln] = AT.split(',').map(Number);
  const zs = (P.get('zs') || String(Z)).split(',').map(Number);
  list = zs.map(z => [(P.get('lbl') || AT) + '  z' + z + '  (' +
    Math.round(156543.03 * Math.cos(la*Math.PI/180) / (1<<z) * 512) + ' m across)', la, ln, '', z]);
}
if (!AT)
if (LAD) {
  const t = LADDER[LAD]; const zs = (P.get('zs') || '8,10,12,14,16,18').split(',').map(Number);
  list = zs.map(z => [LAD.toUpperCase() + '  z' + z + '  (' +
    fmtSpan(156543.03 * Math.cos(t[0]*Math.PI/180) / (1<<z) * 512) + ')', t[0], t[1], t[2], z]);
} else if (!AT) list = SITES[key] || SITES.grid;
function fmtSpan(m) { return m > 2000 ? (m/1000).toFixed(m>20000?0:1) + ' km' : Math.round(m) + ' m'; }
document.getElementById('hdr').textContent =
  key.toUpperCase() + '  ·  z' + Z + '  ·  ' + LAYER + '  ·  ' +
  (156543.03 * Math.cos(list[0][1]*Math.PI/180) / (1<<Z)).toFixed(1) + ' m/px';
const g = document.getElementById('grid');
g.style.gridTemplateColumns = 'repeat(' + COLS + ',1fr)';
const D = Math.PI/180;
for (const [name, lat, lng, note, zOver] of list) {
  const Z2 = zOver || Z;
  const n = 1 << Z2;
  const xt = Math.floor((lng + 180) / 360 * n);
  const s = Math.sin(lat * D);
  const yt = Math.floor((0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI)) * n);
  let h = '<div class="cell"><div class="cap">' + name + '</div><div class="tiles">';
  for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
    const u = 'https://server.arcgisonline.com/ArcGIS/rest/services/' + LAYER +
              '/MapServer/tile/' + Z2 + '/' + (yt+dy) + '/' + (xt+dx);
    h += '<img src="' + u + '" width="' + TS + '" height="' + TS + '" loading="eager">';
  }
  h += '</div><div class="note">' + note + '</div></div>';
  g.insertAdjacentHTML('beforeend', h);
}
window.__loaded = () => [...document.images].filter(i=>i.complete && i.naturalWidth).length;
</script></body></html>
