# Deploys the LSS TTS Worker to Cloudflare whenever you push changes to
# fractalgaming/LSS/tts-backend/**. The Worker source lives on GitHub; the
# actual service runs on Cloudflare's edge once this Action completes.
#
# IMPORTANT: GitHub only picks up workflows from `.github/workflows/` at the
# REPOSITORY ROOT. Move this file to <repo-root>/.github/workflows/ before
# pushing, or copy its contents into a new file there.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - https://dash.cloudflare.com/profile/api-tokens
#                            Use the "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  - shown on the right side of any Cloudflare page
#                            (https://dash.cloudflare.com/<account-id>/)
#
# Optional:
#   ELEVENLABS_API_KEY     - sets the secret on the deployed worker
#                            (only needed if you want ElevenLabs voices)

name: Deploy TTS backend

on:
  push:
    branches: [main, master]
    paths:
      - "fractalgaming/LSS/tts-backend/**"
      - ".github/workflows/deploy-tts-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fractalgaming/LSS/tts-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: fractalgaming/LSS/tts-backend/package-lock.json

      - name: Install deps
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: fractalgaming/LSS/tts-backend
          # Push optional ElevenLabs secret BEFORE deploy so the worker can
          # read it on first request. Skipped when the secret is unset.
          preCommands: |
            if [ -n "${{ secrets.ELEVENLABS_API_KEY }}" ]; then
              echo "${{ secrets.ELEVENLABS_API_KEY }}" | npx wrangler secret put ELEVENLABS_API_KEY
            fi
          command: deploy
