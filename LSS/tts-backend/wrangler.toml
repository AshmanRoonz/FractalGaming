# Cloudflare Worker config for the LSS TTS backend.
#
# After you make a Cloudflare account, only one value below typically needs
# to change: `name` (the subdomain your worker will get). Everything else
# works out of the box.
#
# Your live URL will be: https://<name>.<your-cf-subdomain>.workers.dev

name = "lss-tts"
main = "src/worker.ts"
compatibility_date = "2025-05-01"

# Workers AI binding: gives the worker access to env.AI.run(...).
# This is what powers MeloTTS without any external API key.
[ai]
binding = "AI"

# Optional: comma-separated list of origins allowed to call /tts.
# Set to "*" while developing, then lock down to your itch.io / GitHub
# Pages / SideQuest URL once you ship. Read inside the worker as
# env.ALLOWED_ORIGINS.
[vars]
ALLOWED_ORIGINS = "*"

# Secrets (do NOT put values here; set with `wrangler secret put NAME`):
#   ELEVENLABS_API_KEY     - enables the ElevenLabs path in worker.ts
#   ELEVENLABS_VOICE_ID    - default voice id (e.g. "21m00Tcm4TlvDq8ikWAM")

# Observability: keep logs around for a week so you can spot Quest 5xxs.
[observability]
enabled = true
