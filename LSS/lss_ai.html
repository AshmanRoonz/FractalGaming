<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LSS AI Player ; v0.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #050510;
    --bg-card: #0c0c1c;
    --text: #d8d8e0;
    --text-dim: #8888a0;
    --text-faint: #555570;
    --accent: #44ddff;
    --accent-dim: rgba(68,221,255,0.35);
    --good: #66dd88;
    --warn: #ffaa44;
    --bad:  #ff5566;
    --rule: rgba(80,80,120,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh; font-size: 13px;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--rule);
    background: linear-gradient(to bottom, rgba(68,221,255,0.04), transparent);
  }
  header h1 {
    margin: 0; font-size: 18px; letter-spacing: 4px; color: var(--accent);
    text-transform: uppercase; text-shadow: 0 0 14px var(--accent-dim);
  }
  header .sub {
    margin-top: 4px; color: var(--text-dim); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
  }
  main {
    max-width: 980px; margin: 0 auto; padding: 22px 24px 56px;
    display: grid; grid-template-columns: 320px 1fr; gap: 22px;
  }
  .panel {
    background: var(--bg-card); border: 1px solid var(--rule);
    padding: 16px 18px; border-radius: 4px;
  }
  .panel h2 {
    margin: 0 0 12px; font-size: 11px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
    border-bottom: 1px solid var(--rule); padding-bottom: 8px;
  }
  label {
    display: block; margin-top: 12px; font-size: 10px;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
  }
  input[type=text], select {
    width: 100%; margin-top: 4px; padding: 7px 10px;
    background: #050513; color: var(--text); border: 1px solid var(--rule);
    border-radius: 2px; font-family: inherit; font-size: 13px;
    letter-spacing: 1px; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent-dim); }
  button {
    margin-top: 16px; padding: 9px 18px; width: 100%;
    background: var(--accent); color: #050513;
    border: none; border-radius: 2px; font-family: inherit;
    font-size: 12px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer; transition: filter 120ms;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { background: var(--bad); color: #150505; margin-top: 8px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px dashed rgba(80,80,120,0.18); font-size: 12px;
  }
  .stat-row .k { color: var(--text-dim); letter-spacing: 1.5px; }
  .stat-row .v { color: var(--text); font-weight: 700; }
  .stat-row .v.good { color: var(--good); }
  .stat-row .v.warn { color: var(--warn); }
  .stat-row .v.bad  { color: var(--bad);  }
  #log {
    background: #030310; border: 1px solid var(--rule); padding: 10px 12px;
    border-radius: 2px; max-height: 520px; overflow-y: auto;
    font-size: 11px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word; color: var(--text-faint);
  }
  #log .line { padding: 1px 0; }
  #log .info { color: var(--text); }
  #log .ok   { color: var(--good); }
  #log .warn { color: var(--warn); }
  #log .err  { color: var(--bad);  }
  #log .ts   { color: var(--text-faint); margin-right: 8px; }
  .nodot { color: var(--text-faint); font-style: italic; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>LSS Mesh AI ; v0.1</h1>
  <div class="sub">Standalone Last Ship Sailing peer ; speaks the protocol, no rendering</div>
</header>

<main>

  <section class="panel" id="ctrl-panel">
    <h2>Control</h2>

    <label for="room-code">Room code</label>
    <input id="room-code" type="text" maxlength="16" placeholder="ABCD" autocomplete="off">

    <label for="ship-select">Ship</label>
    <select id="ship-select">
      <option value="">Random</option>
      <option value="VORTEX">VORTEX</option>
      <option value="PYRO">PYRO</option>
      <option value="PUNCTURE">PUNCTURE</option>
      <option value="SLAYER">SLAYER</option>
      <option value="TRACKER">TRACKER</option>
      <option value="BLASTER">BLASTER</option>
      <option value="SYPHON">SYPHON</option>
    </select>

    <label for="team-select">Team</label>
    <select id="team-select">
      <option value="2">Fleet A (red)</option>
      <option value="3">Fleet B (green)</option>
    </select>

    <label for="bot-name">Display name (optional)</label>
    <input id="bot-name" type="text" maxlength="24" placeholder="AI-1" autocomplete="off">

    <button id="btn-join">Join Room</button>
    <button id="btn-leave" class="danger" disabled>Leave</button>
  </section>

  <section style="display: flex; flex-direction: column; gap: 22px;">
    <div class="panel">
      <h2>Status</h2>
      <div class="stat-row"><span class="k">Connection</span><span class="v" id="s-conn"><span class="nodot">disconnected</span></span></div>
      <div class="stat-row"><span class="k">Self peer ID</span><span class="v" id="s-self"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">Room</span><span class="v" id="s-room"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">Peers connected</span><span class="v" id="s-peers">0</span></div>
      <div class="stat-row"><span class="k">Ship / Team</span><span class="v" id="s-ship"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">State broadcasts</span><span class="v" id="s-sent">0</span></div>
      <div class="stat-row"><span class="k">State received</span><span class="v" id="s-recv">0</span></div>
      <div class="stat-row"><span class="k">Match state</span><span class="v" id="s-match"><span class="nodot">lobby</span></span></div>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </section>

</main>

<script type="module">

// ============================================================
// LSS AI Mesh Client v0.1
// ------------------------------------------------------------
// Standalone Last Ship Sailing peer. Joins any room code via
// the same Trystero appId the game uses, announces a loadout,
// fires the ready event, and broadcasts a synthetic state at
// 20 Hz so other peers see this client as a real player.
//
// MVP behavior : orbit a slow circle around the origin, send
// state, log everything. Combat / abilities / cores are
// stubbed out ; next iteration adds them on top of this base.
// ============================================================

const TRYSTERO_URL = 'https://esm.sh/@trystero-p2p/torrent';
const APP_ID = 'last-ship-sailing-v1';
const BROADCAST_HZ = 20;
const SHIPS = ['VORTEX', 'PYRO', 'PUNCTURE', 'SLAYER', 'TRACKER', 'BLASTER', 'SYPHON'];

// Per-ship base stats. Copied from the game's CHASSIS table so the
// AI's broadcast HP / shield look right in the scoreboard ; if you
// change CHASSIS in the game, mirror it here. (Future cleanup :
// extract to a shared JSON module that both consume.)
const CHASSIS_BY_LOADOUT = {
  VORTEX:   { maxHealth: 10000, maxShield: 3500 },
  PYRO:     { maxHealth: 12500, maxShield: 5000 },
  PUNCTURE: { maxHealth: 7500,  maxShield: 2500 },
  SLAYER:   { maxHealth: 7500,  maxShield: 2500 },
  TRACKER:  { maxHealth: 10000, maxShield: 3500 },
  BLASTER:  { maxHealth: 12500, maxShield: 5000 },
  SYPHON:   { maxHealth: 10000, maxShield: 3500 },
};

// ============================================================
// Tiny log helper
// ============================================================
const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('div');
  line.className = 'line';
  const ts = document.createElement('span');
  ts.className = 'ts';
  const d = new Date();
  ts.textContent = d.toTimeString().slice(0, 8);
  const text = document.createElement('span');
  text.className = cls || 'info';
  text.textContent = msg;
  line.appendChild(ts);
  line.appendChild(text);
  logEl.appendChild(line);
  while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStat(id, value, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  const span = document.createElement('span');
  if (cls) span.className = 'v ' + cls;
  span.textContent = value;
  el.appendChild(span);
}

// ============================================================
// AI peer state
// ============================================================
const ai = {
  room: null,
  selfId: null,
  loadoutKey: null,
  team: 2,
  peers: new Set(),   // peer ids we've seen
  position: { x: 0, y: 0, z: 0 },
  velocity: { x: 0, y: 0, z: 0 },
  quat: { x: 0, y: 0, z: 0, w: 1 },
  health: 0, shield: 0, maxHealth: 0, maxShield: 0,
  kills: 0, damageDealt: 0,
  doomed: false, dead: false,
  spawnProt: 3.0,
  broadcastTimer: 0,
  matchState: 'lobby',
  sendState: null, sendEvent: null, sendLoadout: null,
  sentCount: 0, recvCount: 0,
  ready: false,
  brainStart: 0,
  intervalId: null,
};

// ============================================================
// Spawn-position helper. Picks a starting point in a wide
// arena-sized box ; tactically the AI doesn't know the map
// yet so it just chooses a coordinate and orbits from there.
// ============================================================
function pickSpawn() {
  const teamBias = ai.team === 2 ? -1 : 1;
  ai.position.x = (Math.random() - 0.5) * 2000;
  ai.position.y = (Math.random() - 0.5) * 600;
  ai.position.z = teamBias * (1200 + Math.random() * 600);
  ai.brainStart = performance.now() / 1000;
}

// ============================================================
// MVP behavior : slow orbit around the spawn point. This is
// what the next-iteration brain replaces ; for now it just
// proves the peer is alive and moving.
// ============================================================
function tickBrain(dt) {
  const t = performance.now() / 1000 - ai.brainStart;
  const radius = 400;
  const speed = 0.4; // radians per second
  const cx = ai.position.x - Math.cos((t - dt) * speed) * radius;
  const cz = ai.position.z - Math.sin((t - dt) * speed) * radius;
  // Orbit around the spawn-relative center.
  const nx = cx + Math.cos(t * speed) * radius;
  const nz = cz + Math.sin(t * speed) * radius;
  // Velocity = derivative
  ai.velocity.x = (nx - ai.position.x) / dt;
  ai.velocity.y = 0;
  ai.velocity.z = (nz - ai.position.z) / dt;
  ai.position.x = nx;
  ai.position.z = nz;
  // Quaternion : face the orbit-tangent (the direction we're moving).
  const vlen = Math.sqrt(ai.velocity.x * ai.velocity.x + ai.velocity.z * ai.velocity.z) || 1;
  const yaw = Math.atan2(ai.velocity.x / vlen, ai.velocity.z / vlen);
  const halfYaw = yaw * 0.5;
  ai.quat.x = 0;
  ai.quat.y = Math.sin(halfYaw);
  ai.quat.z = 0;
  ai.quat.w = Math.cos(halfYaw);
  // Decay spawn protection
  if (ai.spawnProt > 0) ai.spawnProt = Math.max(0, ai.spawnProt - dt);
}

// ============================================================
// Build a state packet shaped like the game's broadcastPlayerState.
// Short keys so receivers can parse with the same code path.
// ============================================================
function buildStatePacket() {
  return {
    px: Math.round(ai.position.x * 10) / 10,
    py: Math.round(ai.position.y * 10) / 10,
    pz: Math.round(ai.position.z * 10) / 10,
    vx: Math.round(ai.velocity.x * 10) / 10,
    vy: Math.round(ai.velocity.y * 10) / 10,
    vz: Math.round(ai.velocity.z * 10) / 10,
    qx: Math.round(ai.quat.x * 1000) / 1000,
    qy: Math.round(ai.quat.y * 1000) / 1000,
    qz: Math.round(ai.quat.z * 1000) / 1000,
    qw: Math.round(ai.quat.w * 1000) / 1000,
    hp: ai.health,
    shield: ai.shield,
    doomed: ai.doomed,
    dead: ai.dead,
    kills: ai.kills | 0,
    damageDealt: ai.damageDealt | 0,
    abilityShield: false,
    spawnProt: Math.max(0, Math.round((ai.spawnProt || 0) * 10) / 10),
    cloak: false,
  };
}

// ============================================================
// 50 Hz tick loop : runs both the brain (synthetic physics)
// and the broadcast cadence gate. Broadcasts go out at
// BROADCAST_HZ = 20 ; brain ticks at the full loop rate.
// ============================================================
function startTickLoop() {
  let last = performance.now();
  const TICK_HZ = 50;
  ai.intervalId = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!ai.room) return;
    tickBrain(dt);
    ai.broadcastTimer += dt;
    if (ai.broadcastTimer >= 1 / BROADCAST_HZ) {
      ai.broadcastTimer = 0;
      try {
        ai.sendState(buildStatePacket());
        ai.sentCount++;
        setStat('s-sent', ai.sentCount);
      } catch (e) { /* swallow send errors ; tick keeps running */ }
    }
  }, 1000 / TICK_HZ);
}

// ============================================================
// Network channel handlers
// ============================================================
function bindChannels(room) {
  const [sendState, onState]       = room.makeAction('state');
  const [sendHitClaim, onHitClaim] = room.makeAction('hit');
  const [sendHitVote, onHitVote]   = room.makeAction('vote');
  const [sendEvent, onEvent]       = room.makeAction('event');
  const [sendLoadout, onLoadout]   = room.makeAction('loadout');
  const [sendProj, onProj]         = room.makeAction('proj');

  ai.sendState   = sendState;
  ai.sendEvent   = sendEvent;
  ai.sendLoadout = sendLoadout;

  onState((data, peerId) => {
    ai.recvCount++;
    setStat('s-recv', ai.recvCount);
  });
  onHitClaim((claim, peerId) => {
    // (v0.1) Hit claims arriving at the AI will need vote + damage
    // handling in v0.2. For now we just log them.
    log('hit claim from ' + shortId(peerId) + ' : tgt=' + (claim.targetPeerId || '?') + ' dmg=' + (claim.amount || 0), 'warn');
  });
  onHitVote((vote, peerId) => {
    // Don't log vote spam.
  });
  onEvent((evt, peerId) => {
    if (!evt || !evt.type) return;
    // Surface a few interesting event types to the log.
    if (evt.type === 'match_start' || evt.type === 'launch_at' || evt.type === 'round_end' || evt.type === 'kill' || evt.type === 'ready') {
      log('event ' + evt.type + ' from ' + shortId(peerId), 'info');
    }
    if (evt.type === 'match_start') {
      ai.matchState = 'starting';
      setStat('s-match', 'starting', 'warn');
    } else if (evt.type === 'launch_at') {
      ai.matchState = 'launching';
      setStat('s-match', 'launching', 'warn');
      setTimeout(() => {
        ai.matchState = 'playing';
        setStat('s-match', 'playing', 'good');
        ai.spawnProt = 3.0;
      }, 1800);
    } else if (evt.type === 'round_end') {
      ai.matchState = 'roundEnd';
      setStat('s-match', 'roundEnd', 'warn');
    }
  });
  onLoadout((data, peerId) => {
    // Other peers announcing their loadout.
    log('loadout : ' + shortId(peerId) + ' is ' + (data.loadoutKey || '?') + ' team=' + (data.team || '?'));
  });
  onProj((data, peerId) => {
    // (v0.1) Just ignore for now ; v0.2 will use these to dodge.
  });
}

function shortId(id) {
  if (!id) return '?';
  return String(id).slice(0, 6);
}

// ============================================================
// Connect / disconnect
// ============================================================
async function joinRoom() {
  const code = document.getElementById('room-code').value.trim().toUpperCase();
  if (!code) {
    log('Room code required', 'err');
    return;
  }
  const shipSel = document.getElementById('ship-select').value;
  ai.loadoutKey = shipSel || SHIPS[Math.floor(Math.random() * SHIPS.length)];
  ai.team = parseInt(document.getElementById('team-select').value, 10) || 2;
  const stats = CHASSIS_BY_LOADOUT[ai.loadoutKey] || { maxHealth: 10000, maxShield: 3500 };
  ai.maxHealth = stats.maxHealth;
  ai.maxShield = stats.maxShield;
  ai.health = stats.maxHealth;
  ai.shield = stats.maxShield;

  pickSpawn();

  document.getElementById('btn-join').disabled = true;
  document.getElementById('btn-leave').disabled = false;
  setStat('s-conn', 'connecting', 'warn');

  try {
    const trystero = await import(TRYSTERO_URL);
    const { joinRoom: trysteroJoin, selfId } = trystero;
    ai.selfId = selfId;
    ai.room = trysteroJoin({ appId: APP_ID }, code);

    setStat('s-conn', 'connected', 'good');
    setStat('s-self', shortId(selfId));
    setStat('s-room', code);
    setStat('s-ship', ai.loadoutKey + ' / Team ' + (ai.team === 2 ? 'A' : 'B'));
    log('Joined room ' + code + ' as ' + shortId(selfId), 'ok');

    bindChannels(ai.room);

    ai.room.onPeerJoin((peerId) => {
      ai.peers.add(peerId);
      setStat('s-peers', ai.peers.size);
      log('peer joined : ' + shortId(peerId), 'ok');
      // Re-announce loadout so the new peer sees us. Same payload shape
      // the game uses ; discord_* fields omitted because the AI has no
      // Discord identity (game already supports nameless peers).
      sendLoadoutAnnounce();
      // Re-send ready so the joiner knows we're ready to launch.
      if (ai.ready && ai.sendEvent) {
        try { ai.sendEvent({ type: 'ready', ready: true }); } catch (_) {}
      }
    });
    ai.room.onPeerLeave((peerId) => {
      ai.peers.delete(peerId);
      setStat('s-peers', ai.peers.size);
      log('peer left : ' + shortId(peerId), 'warn');
    });

    // Initial announces ; we're in the room and committed to a loadout.
    sendLoadoutAnnounce();
    // Flip the AI to "ready" immediately so the lobby's all-ready check
    // doesn't gate on us. Real players hit the ready button manually ;
    // the AI never sits in not-ready limbo.
    ai.ready = true;
    setTimeout(() => {
      try { ai.sendEvent({ type: 'ready', ready: true }); log('ready broadcast', 'ok'); } catch (_) {}
    }, 400);

    startTickLoop();
  } catch (e) {
    log('Join failed : ' + (e && e.message ? e.message : e), 'err');
    setStat('s-conn', 'failed', 'bad');
    document.getElementById('btn-join').disabled = false;
    document.getElementById('btn-leave').disabled = true;
  }
}

function sendLoadoutAnnounce() {
  if (!ai.sendLoadout) return;
  const name = (document.getElementById('bot-name').value || '').trim() || ('AI-' + shortId(ai.selfId));
  try {
    ai.sendLoadout({
      loadoutKey: ai.loadoutKey,
      team: ai.team,
      peerId: ai.selfId,
      // Reuse the discord_* fields the game already supports so this AI
      // shows up with a custom display name in the lobby chips.
      discord_name: name,
    });
  } catch (e) { log('Loadout announce failed : ' + e.message, 'err'); }
}

function leaveRoom() {
  if (ai.intervalId) clearInterval(ai.intervalId);
  ai.intervalId = null;
  if (ai.room && typeof ai.room.leave === 'function') {
    try { ai.room.leave(); } catch (_) {}
  }
  ai.room = null;
  ai.peers.clear();
  ai.sentCount = 0;
  ai.recvCount = 0;
  setStat('s-conn', 'disconnected', 'bad');
  setStat('s-self', '-');
  setStat('s-room', '-');
  setStat('s-peers', 0);
  setStat('s-sent', 0);
  setStat('s-recv', 0);
  setStat('s-ship', '-');
  setStat('s-match', 'lobby');
  log('Left room', 'warn');
  document.getElementById('btn-join').disabled = false;
  document.getElementById('btn-leave').disabled = true;
}

document.getElementById('btn-join').addEventListener('click', joinRoom);
document.getElementById('btn-leave').addEventListener('click', leaveRoom);

// Auto-populate room code from ?room= query param if present.
const _qsRoom = new URLSearchParams(window.location.search).get('room');
if (_qsRoom) document.getElementById('room-code').value = _qsRoom.toUpperCase();

// Init the status panel default text.
setStat('s-conn', 'disconnected', 'bad');
log('Ready. Enter a room code and click Join.', 'info');

</script>

</body>
</html>
