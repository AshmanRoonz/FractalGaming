<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LSS AI Player ; v0.2 (Python bridge)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #050510;
    --bg-card: #0c0c1c;
    --text: #d8d8e0;
    --text-dim: #8888a0;
    --text-faint: #555570;
    --accent: #44ddff;
    --accent-dim: rgba(68,221,255,0.35);
    --good: #66dd88;
    --warn: #ffaa44;
    --bad:  #ff5566;
    --rule: rgba(80,80,120,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh; font-size: 13px;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--rule);
    background: linear-gradient(to bottom, rgba(68,221,255,0.04), transparent);
  }
  header h1 {
    margin: 0; font-size: 18px; letter-spacing: 4px; color: var(--accent);
    text-transform: uppercase; text-shadow: 0 0 14px var(--accent-dim);
  }
  header .sub {
    margin-top: 4px; color: var(--text-dim); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
  }
  main {
    max-width: 980px; margin: 0 auto; padding: 22px 24px 56px;
    display: grid; grid-template-columns: 320px 1fr; gap: 22px;
  }
  .panel {
    background: var(--bg-card); border: 1px solid var(--rule);
    padding: 16px 18px; border-radius: 4px;
  }
  .panel h2 {
    margin: 0 0 12px; font-size: 11px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
    border-bottom: 1px solid var(--rule); padding-bottom: 8px;
  }
  label {
    display: block; margin-top: 12px; font-size: 10px;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
  }
  input[type=text], select {
    width: 100%; margin-top: 4px; padding: 7px 10px;
    background: #050513; color: var(--text); border: 1px solid var(--rule);
    border-radius: 2px; font-family: inherit; font-size: 13px;
    letter-spacing: 1px; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent-dim); }
  button {
    margin-top: 16px; padding: 9px 18px; width: 100%;
    background: var(--accent); color: #050513;
    border: none; border-radius: 2px; font-family: inherit;
    font-size: 12px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer; transition: filter 120ms;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { background: var(--bad); color: #150505; margin-top: 8px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px dashed rgba(80,80,120,0.18); font-size: 12px;
  }
  .stat-row .k { color: var(--text-dim); letter-spacing: 1.5px; }
  .stat-row .v { color: var(--text); font-weight: 700; }
  .stat-row .v.good { color: var(--good); }
  .stat-row .v.warn { color: var(--warn); }
  .stat-row .v.bad  { color: var(--bad);  }
  #log {
    background: #030310; border: 1px solid var(--rule); padding: 10px 12px;
    border-radius: 2px; max-height: 520px; overflow-y: auto;
    font-size: 11px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word; color: var(--text-faint);
  }
  #log .line { padding: 1px 0; }
  #log .info { color: var(--text); }
  #log .ok   { color: var(--good); }
  #log .warn { color: var(--warn); }
  #log .err  { color: var(--bad);  }
  #log .ts   { color: var(--text-faint); margin-right: 8px; }
  .nodot { color: var(--text-faint); font-style: italic; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>LSS Mesh AI ; v0.2</h1>
  <div class="sub">Bridge to a Python brain ; protocol-level peer with WebSocket I/O</div>
</header>

<main>

  <section class="panel" id="ctrl-panel">
    <h2>Control</h2>

    <label for="room-code">Room code</label>
    <input id="room-code" type="text" maxlength="16" placeholder="ABCD" autocomplete="off">

    <label for="ship-select">Ship</label>
    <select id="ship-select">
      <option value="">Random</option>
      <option value="VORTEX">VORTEX</option>
      <option value="PYRO">PYRO</option>
      <option value="PUNCTURE">PUNCTURE</option>
      <option value="SLAYER">SLAYER</option>
      <option value="TRACKER">TRACKER</option>
      <option value="BLASTER">BLASTER</option>
      <option value="SYPHON">SYPHON</option>
    </select>

    <label for="team-select">Team</label>
    <select id="team-select">
      <option value="2">Fleet A (red)</option>
      <option value="3">Fleet B (green)</option>
    </select>

    <label for="bot-name">Display name (optional)</label>
    <input id="bot-name" type="text" maxlength="24" placeholder="AI-1" autocomplete="off">

    <label for="brain-url">Python brain (WebSocket URL)</label>
    <input id="brain-url" type="text" value="ws://localhost:8765" autocomplete="off">

    <button id="btn-join">Join Room</button>
    <button id="btn-leave" class="danger" disabled>Leave</button>
  </section>

  <section style="display: flex; flex-direction: column; gap: 22px;">
    <div class="panel">
      <h2>Status</h2>
      <div class="stat-row"><span class="k">Connection</span><span class="v" id="s-conn"><span class="nodot">disconnected</span></span></div>
      <div class="stat-row"><span class="k">Self peer ID</span><span class="v" id="s-self"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">Room</span><span class="v" id="s-room"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">Peers connected</span><span class="v" id="s-peers">0</span></div>
      <div class="stat-row"><span class="k">Ship / Team</span><span class="v" id="s-ship"><span class="nodot">-</span></span></div>
      <div class="stat-row"><span class="k">State broadcasts</span><span class="v" id="s-sent">0</span></div>
      <div class="stat-row"><span class="k">State received</span><span class="v" id="s-recv">0</span></div>
      <div class="stat-row"><span class="k">Match state</span><span class="v" id="s-match"><span class="nodot">lobby</span></span></div>
      <div class="stat-row"><span class="k">Python brain</span><span class="v" id="s-brain"><span class="nodot">offline (fallback orbit)</span></span></div>
      <div class="stat-row"><span class="k">Actions received</span><span class="v" id="s-actions">0</span></div>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </section>

</main>

<script type="module">

// ============================================================
// LSS AI Mesh Client v0.1
// ------------------------------------------------------------
// Standalone Last Ship Sailing peer. Joins any room code via
// the same Trystero appId the game uses, announces a loadout,
// fires the ready event, and broadcasts a synthetic state at
// 20 Hz so other peers see this client as a real player.
//
// MVP behavior : orbit a slow circle around the origin, send
// state, log everything. Combat / abilities / cores are
// stubbed out ; next iteration adds them on top of this base.
// ============================================================

// Pinned to match last_ship_sailing_v27.html exactly. The unpinned
// @trystero-p2p/torrent URL resolves to v0.25.x, which has a different
// wire protocol than v27's pinned 0.22.0 and trips a "not iterable"
// error during the offer handshake. See trystero_0.25_upgrade_plan.md.
const TRYSTERO_URL = 'https://esm.sh/trystero@0.22.0/torrent';
const APP_ID = 'last-ship-sailing-v1';
const BROADCAST_HZ = 20;
const SHIPS = ['VORTEX', 'PYRO', 'PUNCTURE', 'SLAYER', 'TRACKER', 'BLASTER', 'SYPHON'];

// Per-ship base stats. Copied from the game's CHASSIS table so the
// AI's broadcast HP / shield look right in the scoreboard ; if you
// change CHASSIS in the game, mirror it here. (Future cleanup :
// extract to a shared JSON module that both consume.)
const CHASSIS_BY_LOADOUT = {
  VORTEX:   { maxHealth: 10000, maxShield: 3500 },
  PYRO:     { maxHealth: 12500, maxShield: 5000 },
  PUNCTURE: { maxHealth: 7500,  maxShield: 2500 },
  SLAYER:   { maxHealth: 7500,  maxShield: 2500 },
  TRACKER:  { maxHealth: 10000, maxShield: 3500 },
  BLASTER:  { maxHealth: 12500, maxShield: 5000 },
  SYPHON:   { maxHealth: 10000, maxShield: 3500 },
};

// ============================================================
// Tiny log helper
// ============================================================
const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('div');
  line.className = 'line';
  const ts = document.createElement('span');
  ts.className = 'ts';
  const d = new Date();
  ts.textContent = d.toTimeString().slice(0, 8);
  const text = document.createElement('span');
  text.className = cls || 'info';
  text.textContent = msg;
  line.appendChild(ts);
  line.appendChild(text);
  logEl.appendChild(line);
  while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStat(id, value, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  const span = document.createElement('span');
  if (cls) span.className = 'v ' + cls;
  span.textContent = value;
  el.appendChild(span);
}

// ============================================================
// AI peer state
// ============================================================
const ai = {
  room: null,
  selfId: null,
  loadoutKey: null,
  team: 2,
  peers: new Set(),   // peer ids we've seen
  peerStates: new Map(), // peerId -> latest state broadcast
  peerLoadouts: new Map(), // peerId -> { loadoutKey, team, name }
  peerReady: new Map(),    // peerId -> boolean (ready event received)
  // Match handshake state. The lobby protocol elects the LOWEST peerId
  // as proposer ; when that's us, the bridge has to actually SEND the
  // match_start and launch_at events or the lobby stalls forever. These
  // flags ensure we propose at most once per phase per match.
  matchStartSent: false,
  launchAtSent: false,
  // Map data loaded on match_start. Rooms + tunnels make up the playable
  // volume ; the AI is contained inside any room sphere OR any tunnel
  // cylinder. The AI is initially placed at its team's spawn room (from
  // the map JSON), not peer-anchored to the human's position.
  mapRooms: null,
  mapTunnels: null,
  mapSpawnedFor: null, // map key whose spawn we've used ; prevents double-spawn
  recentProjectiles: [], // ring buffer of recent broadcasted projectiles for the brain to see
  position: { x: 0, y: 0, z: 0 },
  velocity: { x: 0, y: 0, z: 0 },
  quat: { x: 0, y: 0, z: 0, w: 1 },
  health: 0, shield: 0, maxHealth: 0, maxShield: 0,
  kills: 0, damageDealt: 0,
  doomed: false, dead: false,
  spawnProt: 3.0,
  broadcastTimer: 0,
  matchState: 'lobby',
  sendState: null, sendEvent: null, sendLoadout: null, sendProjectile: null,
  sentCount: 0, recvCount: 0,
  ready: false,
  brainStart: 0,
  intervalId: null,
  tickCount: 0,
  // ----------------------------------------------------------------------
  // Python brain state (WebSocket bridge).
  // brainWs : the active WebSocket connection (or null if not connected).
  // brainAction : last action message received from Python ; the bridge
  //   applies it each tick. Falls back to the orbit policy if no action
  //   has arrived recently (so the bot does SOMETHING even if Python is
  //   slow or disconnected).
  // brainActionAge : seconds since the last brain action ; used to gate
  //   the fallback policy.
  // brainReconnectAt : timestamp at which to retry connection after a
  //   disconnect / failed connection. Set to keep the brain auto-reconnecting
  //   without spamming the connect attempt.
  // ----------------------------------------------------------------------
  brainWs: null,
  brainAction: null,
  brainActionAge: 999,
  brainConnected: false,
  brainReconnectAt: 0,
  brainActionCount: 0,
  // Per-ability fire-rate gates (so the brain can spam "fire: true" without
  // exceeding the loadout's actual fire rate / ability cooldowns).
  fireGate: 0,        // weapon fire timer
  abilityGate: [0, 0, 0], // per-slot cooldown
  coreGate: 0,
  coreMeter: 0,
  hitIdCounter: 0, // monotonic id for hit claims we send
};

// Simplified per-loadout weapon metadata for the bridge to use when
// translating "fire: true" actions into actual proj broadcasts. Mirrors
// the game's LOADOUTS[*].weapon ; if you tune the game, mirror here too.
const WEAPON_BY_LOADOUT = {
  VORTEX:   { mode: 'hitscan',    fireRate: 0.25, damage: 380,  range: 3000, projSpeed: 0,    color: 0xaa55ff, splash: 0 },
  PYRO:     { mode: 'projectile', fireRate: 1.2,  damage: 900,  range: 2500, projSpeed: 600,  color: 0xff3322, splash: 300, isFireSource: true },
  PUNCTURE: { mode: 'hitscan',    fireRate: 1.5,  damage: 1000, range: 4500, projSpeed: 0,    color: 0xffee44, splash: 50 },
  SLAYER:   { mode: 'spread',     fireRate: 0.85, damage: 200,  range: 900,  projSpeed: 350,  color: 0x44ff66, splash: 0, pellets: 8 },
  TRACKER:  { mode: 'projectile', fireRate: 0.85, damage: 660,  range: 3500, projSpeed: 900,  color: 0xff8800, splash: 0 },
  BLASTER:  { mode: 'hitscan',    fireRate: 0.05, damage: 85,   range: 1500, projSpeed: 0,    color: 0x44eeff, splash: 0 },
  SYPHON:   { mode: 'hitscan',    fireRate: 0.09, damage: 240,  range: 3000, projSpeed: 0,    color: 0x4488ff, splash: 0 },
};

// Per-loadout ability cooldown table (slots 0/1/2 ; same order the game uses).
// Used by the bridge to gate "ability: N" actions.
const ABILITY_CDS_BY_LOADOUT = {
  VORTEX:   [5,  0, 12],
  PYRO:     [10, 0, 15],
  PUNCTURE: [8,  10, 12],
  SLAYER:   [8,  0, 6],
  TRACKER:  [0.25, 14, 12],
  BLASTER:  [8,  0, 2],
  SYPHON:   [6,  8, 12],
};

// ============================================================
// Spawn-position helper. v0.1 fix : start at the origin with
// only a small per-team Z bias and tiny random jitter, so the
// AI is almost certainly inside the playable volume of any
// map (every shipped map has its center around (0,0,0)).
// Without map data the AI can't ask getValidSpawnPoint() like
// the game does, so this is a safe-by-default placeholder.
// v0.2 plan : listen for the first real peer state broadcast
// and snap to within a few hundred units of that peer, which
// guarantees we spawn inside the level wherever the map is.
// ============================================================
function pickSpawn() {
  const teamBias = ai.team === 2 ? -1 : 1;
  ai.position.x = (Math.random() - 0.5) * 120;
  ai.position.y = (Math.random() - 0.5) * 60;
  ai.position.z = teamBias * (80 + Math.random() * 60);
  ai.brainStart = performance.now() / 1000;
  ai._spawnSnapped = false; // peer-anchor takes over once we hear from a real peer
}

// ============================================================
// MVP behavior : slow orbit around the spawn point. This is
// what the next-iteration brain replaces ; for now it just
// proves the peer is alive and moving.
// ============================================================
function tickBrain(dt) {
  const t = performance.now() / 1000 - ai.brainStart;
  // (v0.1 fix) Tight orbit radius so the AI stays inside whatever
  // volume it spawned in. v0.1 originally used 400 which routinely
  // clipped through walls on cramped maps.
  const radius = 140;
  const speed = 0.5; // radians per second
  // Orbit center : current position minus the offset we added last tick.
  const cx = ai.position.x - Math.cos((t - dt) * speed) * radius;
  const cz = ai.position.z - Math.sin((t - dt) * speed) * radius;
  const nx = cx + Math.cos(t * speed) * radius;
  const nz = cz + Math.sin(t * speed) * radius;
  // Velocity = derivative
  ai.velocity.x = (nx - ai.position.x) / dt;
  ai.velocity.y = 0;
  ai.velocity.z = (nz - ai.position.z) / dt;
  ai.position.x = nx;
  ai.position.z = nz;
  // Quaternion : face the orbit-tangent (the direction we're moving).
  const vlen = Math.sqrt(ai.velocity.x * ai.velocity.x + ai.velocity.z * ai.velocity.z) || 1;
  const yaw = Math.atan2(ai.velocity.x / vlen, ai.velocity.z / vlen);
  const halfYaw = yaw * 0.5;
  ai.quat.x = 0;
  ai.quat.y = Math.sin(halfYaw);
  ai.quat.z = 0;
  ai.quat.w = Math.cos(halfYaw);
  // Decay spawn protection
  if (ai.spawnProt > 0) ai.spawnProt = Math.max(0, ai.spawnProt - dt);
}

// ============================================================
// Build a state packet shaped like the game's broadcastPlayerState.
// Short keys so receivers can parse with the same code path.
// ============================================================
function buildStatePacket() {
  // (v0.4) Broadcast dead=true whenever we're not actually playing, so
  // other clients hide our ship during lobby / starting / launching /
  // roundEnd. Without this the AI is visible in the spawn room during
  // ship-select / warmup, which looks like "the AI spawned before me."
  // The lobby ready / loadout checks operate on separate channels so
  // hiding the ship doesn't affect handshake.
  // Also broadcast dead=true when the map hasn't loaded yet ; without
  // map data we can't be at a sensible position and we'd render in a wall.
  const mapReadyForBroadcast = !!(ai.mapRooms && ai.mapRooms.length > 0);
  const broadcastDead = ai.dead || ai.matchState !== 'playing' || !mapReadyForBroadcast;
  return {
    px: Math.round(ai.position.x * 10) / 10,
    py: Math.round(ai.position.y * 10) / 10,
    pz: Math.round(ai.position.z * 10) / 10,
    vx: Math.round(ai.velocity.x * 10) / 10,
    vy: Math.round(ai.velocity.y * 10) / 10,
    vz: Math.round(ai.velocity.z * 10) / 10,
    qx: Math.round(ai.quat.x * 1000) / 1000,
    qy: Math.round(ai.quat.y * 1000) / 1000,
    qz: Math.round(ai.quat.z * 1000) / 1000,
    qw: Math.round(ai.quat.w * 1000) / 1000,
    hp: ai.health,
    shield: ai.shield,
    doomed: ai.doomed,
    dead: broadcastDead,
    kills: ai.kills | 0,
    damageDealt: ai.damageDealt | 0,
    abilityShield: false,
    spawnProt: Math.max(0, Math.round((ai.spawnProt || 0) * 10) / 10),
    cloak: false,
  };
}

// ============================================================
// 50 Hz tick loop : runs both the brain (synthetic physics)
// and the broadcast cadence gate. Broadcasts go out at
// BROADCAST_HZ = 20 ; brain ticks at the full loop rate.
// ============================================================
function startTickLoop() {
  let last = performance.now();
  const TICK_HZ = 50;
  ai.intervalId = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (!ai.room) return;
    ai.tickCount++;
    // Auto-reconnect to the Python brain if disconnected and the
    // reconnect timer has elapsed.
    if (!ai.brainConnected && now >= ai.brainReconnectAt) {
      connectBrain();
    }
    // Decay fire / ability / core gates.
    ai.fireGate = Math.max(0, ai.fireGate - dt);
    for (let i = 0; i < 3; i++) ai.abilityGate[i] = Math.max(0, ai.abilityGate[i] - dt);
    ai.coreGate = Math.max(0, ai.coreGate - dt);
    ai.coreMeter = Math.min(100, ai.coreMeter + dt * 1.5);
    ai.brainActionAge += dt;
    // Gate all game-active behavior on match_state. Before the match
    // is actually playing (lobby / starting / launching / roundEnd) the
    // AI sits still ; it broadcasts position so the lobby sees us as a
    // peer, but it does NOT move, fire weapons, use abilities, or pop
    // its core. Without this gate the AI was flying around during the
    // lobby + warmup phases and peer-snapping to the human's spawn
    // point before the match even started.
    const isPlaying = (ai.matchState === 'playing');
    // If the map JSON hasn't loaded we can't safely navigate ; freeze
    // and broadcast dead=true so peers don't see us floating in a wall.
    const mapReady = !!(ai.mapRooms && ai.mapRooms.length > 0);

    // Orphan detection : suppressed for the first 7 seconds after
    // entering playing (so a slow-spawning human isn't misread as gone),
    // and requires _lastPeerStateAt to be a real timestamp (not null).
    // Without this guard the first playing tick fires the check, the
    // bot bounces back to lobby with dead=true, the human's v27 sees
    // 'all of team A dead' and ends the round abruptly.
    if (isPlaying && ai._playingSince) {
      const settleMs = 7000;
      const beyondSettle = (now - ai._playingSince) > settleMs;
      const noStates = beyondSettle
        && ai._lastPeerStateAt
        && (now - ai._lastPeerStateAt) > 5000;
      if (ai.peers.size === 0) {
        ai._noPeersSince = ai._noPeersSince || now;
      } else {
        ai._noPeersSince = 0;
      }
      const orphanedByPeers = beyondSettle
        && ai._noPeersSince
        && (now - ai._noPeersSince) > 5000;
      if (noStates || orphanedByPeers) {
        log('orphan detected ; returning to lobby', 'warn');
        ai.matchState = 'lobby';
        setStat('s-match', 'lobby', 'warn');
        ai.dead = true;
        ai.matchStartSent = false;
        ai.launchAtSent = false;
        ai._warmupReadySent = false;
        ai._spawnSnapped = false;
        ai._noPeersSince = 0;
        ai._playingSince = 0;
        ai.velocity.x = 0; ai.velocity.y = 0; ai.velocity.z = 0;
      }
    } else if (!isPlaying) {
      ai._noPeersSince = 0;
      ai._playingSince = 0;
    }

    if (isPlaying && !ai.dead && mapReady) {
      if (ai.brainConnected && ai.brainAction && ai.brainActionAge < ACTION_STALE_S) {
        applyAction(ai.brainAction);
        // Substepped integration : split each tick into substeps no
        // larger than 15 units of travel and clamp at each substep. A
        // single high-velocity request can no longer punch through a
        // wall in one frame ; the clamp catches it at sub-substep
        // boundaries.
        const moveLen = Math.sqrt(
          ai.velocity.x * ai.velocity.x +
          ai.velocity.y * ai.velocity.y +
          ai.velocity.z * ai.velocity.z) * dt;
        const subs = Math.max(1, Math.ceil(moveLen / 15));
        const subDt = dt / subs;
        for (let i = 0; i < subs; i++) {
          ai.position.x += ai.velocity.x * subDt;
          ai.position.y += ai.velocity.y * subDt;
          ai.position.z += ai.velocity.z * subDt;
          clampToRooms();
        }
      } else {
        tickBrain(dt);
        clampToRooms();
      }
      if (ai.spawnProt > 0) ai.spawnProt = Math.max(0, ai.spawnProt - dt);
    } else if (isPlaying && !ai.dead && !mapReady) {
      // Map not ready : sit still, keep asking the brain for it. The
      // broadcast loop is gated to send dead=true (see buildStatePacket)
      // so peers don't render us mid-air outside the playable volume.
      ai.velocity.x = 0; ai.velocity.y = 0; ai.velocity.z = 0;
      ai._mapAskTimer = (ai._mapAskTimer || 0) + dt;
      if (ai._mapAskTimer >= 1.0 && ai.brainConnected && ai.brainWs && ai.brainWs.readyState === 1) {
        ai._mapAskTimer = 0;
        const mk = ai.mapKey || ai.mapPending || 'hourglass';
        try {
          ai.brainWs.send(JSON.stringify({ kind: 'map_request', mapKey: mk }));
        } catch (_) {}
      }
    } else {
      // Pre-game / post-round : freeze velocity so we don't drift. Keep
      // broadcasting position so peers still see us in the lobby.
      ai.velocity.x = 0;
      ai.velocity.y = 0;
      ai.velocity.z = 0;
    }
    // Drop old peer states and projectiles so the observation packet
    // stays bounded.
    const cutoffMs = now - 2500;
    for (const [pid, st] of ai.peerStates) {
      if (st._seenAt && st._seenAt < cutoffMs) ai.peerStates.delete(pid);
    }
    while (ai.recentProjectiles.length > 0 && ai.recentProjectiles[0]._seenAt < now - 1500) {
      ai.recentProjectiles.shift();
    }
    // Lobby heartbeat : every ~2 s while in lobby/start/launch phases
    // we re-announce loadout + ready. This covers two failure modes :
    //   (a) initial 400 ms ready broadcast fires before WebRTC peer
    //       channels are fully established, so the message is lost.
    //   (b) trystero's onPeerJoin handler races our ai.ready=true flag
    //       and fires before we've flipped it.
    // Either way, a periodic resend guarantees the human eventually sees
    // the AI as a ready peer and the lobby clears.
    ai._lobbyHeartbeat = (ai._lobbyHeartbeat || 0) + dt;
    if (ai._lobbyHeartbeat >= 2.0 && ai.matchState !== 'playing') {
      ai._lobbyHeartbeat = 0;
      try { sendLoadoutAnnounce(); } catch (_) {}
      if (ai.ready) {
        try { ai.sendEvent({ type: 'ready', ready: true }); } catch (_) {}
      }
    }

    ai.broadcastTimer += dt;
    if (ai.broadcastTimer >= 1 / BROADCAST_HZ) {
      ai.broadcastTimer = 0;
      try {
        ai.sendState(buildStatePacket());
        ai.sentCount++;
        setStat('s-sent', ai.sentCount);
      } catch (e) { /* swallow send errors ; tick keeps running */ }
      // Also push an observation to Python at the same cadence.
      if (ai.brainConnected && ai.brainWs && ai.brainWs.readyState === 1) {
        try { ai.brainWs.send(JSON.stringify(buildObservation(dt))); } catch (_) {}
      }
    }
  }, 1000 / TICK_HZ);
}

// ============================================================
// Network channel handlers
// ============================================================
function bindChannels(room) {
  const [sendState, onState]       = room.makeAction('state');
  const [sendHitClaim, onHitClaim] = room.makeAction('hit');
  const [sendHitVote, onHitVote]   = room.makeAction('vote');
  const [sendEvent, onEvent]       = room.makeAction('event');
  const [sendLoadout, onLoadout]   = room.makeAction('loadout');
  const [sendProj, onProj]         = room.makeAction('proj');

  ai.sendState      = sendState;
  ai.sendEvent      = sendEvent;
  ai.sendLoadout    = sendLoadout;
  ai.sendProjectile = sendProj;
  ai.sendHitClaim   = sendHitClaim;
  ai.sendHitVote    = sendHitVote;

  onState((data, peerId) => {
    ai.recvCount++;
    setStat('s-recv', ai.recvCount);
    // Stash the latest state per peer so the brain can see everyone's
    // position / hp / shield in its observation packet.
    if (data && typeof data.px === 'number' && data.px === data.px) {
      ai.peerStates.set(peerId, { ...data, _seenAt: performance.now() });
      ai._lastPeerStateAt = performance.now();
    }
    // (v0.3 fix) State-driven round resume. If we're in 'roundEnd' state
    // and we see a peer broadcast with fresh spawn protection AND alive,
    // that's the signal that the next round has actually started for
    // them. Flip our matchState back to 'playing' and respawn at the
    // map's team spawn room. The 6-second timer fallback in the
    // round_end handler will catch us if no peer signal arrives.
    if (ai.matchState === 'roundEnd' && data && !data.dead
        && typeof data.spawnProt === 'number' && data.spawnProt > 0
        && typeof data.px === 'number' && data.px === data.px) {
      ai.matchState = 'playing';
      setStat('s-match', 'playing', 'good');
      respawnAtMapSpawn();
      // Critical : reset the orphan timers for the new round. Without
      // this, _playingSince still holds round-1's launch_at time, so
      // beyondSettle is true on the first tick, and noStates fires the
      // moment any state-broadcast hiccup happens. Bot bounces to lobby
      // and never appears for round 2.
      ai._playingSince = performance.now();
      ai._lastPeerStateAt = performance.now();
      ai._noPeersSince = 0;
      log('round resume (peer spawn signal from ' + shortId(peerId) + ')', 'ok');
    }
    // Peer-anchor snap : jump to within ~250 u of a real peer so we
    // land inside the playable volume. Gated on match_state ===
    // 'playing' so we don't snap to the human's LOBBY position before
    // the match begins. Also requires the peer to have a real (non-
    // lobby) loadout commitment so we know they've actually entered
    // the world.
    const peerHasLoadout = ai.peerLoadouts.has(peerId);
    const peerFarFromOrigin = data && typeof data.px === 'number'
      && (Math.abs(data.px) + Math.abs(data.py) + Math.abs(data.pz) > 60);
    if (!ai._spawnSnapped && ai.matchState === 'playing'
        && data && typeof data.px === 'number'
        && !data.dead && data.px === data.px /* NaN guard */
        && peerHasLoadout && peerFarFromOrigin) {
      const jitter = 220;
      ai.position.x = data.px + (Math.random() - 0.5) * jitter;
      ai.position.y = data.py + (Math.random() - 0.5) * (jitter * 0.4);
      ai.position.z = data.pz + (Math.random() - 0.5) * jitter;
      ai.brainStart = performance.now() / 1000;
      ai._spawnSnapped = true;
      ai.dead = false; // wake back up if we were dead from previous round
      ai.spawnProt = 3.0;
      ai.health = ai.maxHealth;
      ai.shield = ai.maxShield;
      log('spawn snapped near ' + shortId(peerId) + ' : ('
          + Math.round(ai.position.x) + ',' + Math.round(ai.position.y) + ',' + Math.round(ai.position.z) + ')', 'ok');
    }
  });
  onHitClaim((claim, peerId) => {
    if (!claim) return;
    // Always vote on incoming claims so the consensus pipeline works.
    // For claims targeting us, the AI has perfect ground truth about its
    // own position ; for claims about other peers, we don't really know,
    // so vote yes if the geometry is plausible (matches the game's own
    // generous 4000-unit tolerance).
    let valid = true;
    if (claim.targetId === ai.selfId) {
      const dx = ai.position.x - (claim.sx || 0);
      const dy = ai.position.y - (claim.sy || 0);
      const dz = ai.position.z - (claim.sz || 0);
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      valid = d < 4500; // a little more lenient than the game's 4000 ;
                       // the AI's position log may drift slightly from
                       // shooter-side projection.
    } else if (claim.shooterId && claim.targetId) {
      const sh = ai.peerStates.get(claim.shooterId);
      const tg = ai.peerStates.get(claim.targetId);
      if (sh && tg) {
        const dx = sh.px - tg.px, dy = sh.py - tg.py, dz = sh.pz - tg.pz;
        valid = Math.sqrt(dx * dx + dy * dy + dz * dz) < 4500;
      }
    }
    if (ai.sendHitVote) {
      try { ai.sendHitVote({ hitId: claim.hitId, valid, voterId: ai.selfId }); } catch (_) {}
    }
    // If WE are the target, apply the damage to our local pool. Other
    // peers compute consensus independently ; this just keeps our
    // broadcast HP / shield honest so the scoreboard and shield ripple
    // visuals are correct on every screen.
    // Debug : log EVERY hit-claim that targets us, including the ones we
    // reject. Lets the user see in the bridge log whether their shots are
    // landing as expected or being silently dropped by some gate.
    if (claim.targetId === ai.selfId) {
      const rawDmg = Math.max(0, claim.damage || 0);
      if (!valid) {
        log('[hit] rejected (invalid geometry) dmg=' + Math.round(rawDmg), 'warn');
      } else if (ai.dead) {
        log('[hit] ignored (already dead) dmg=' + Math.round(rawDmg), 'warn');
      } else if (ai.spawnProt > 0) {
        log('[hit] ignored (spawn prot ' + ai.spawnProt.toFixed(1) + 's) dmg=' + Math.round(rawDmg), 'warn');
      }
    }
    if (claim.targetId === ai.selfId && valid && !ai.dead && ai.spawnProt <= 0) {
      const dmg = Math.max(0, claim.damage || 0);
      if (dmg > 0) {
        const shieldBefore = ai.shield;
        const healthBefore = ai.health;
        if (ai.shield > 0) {
          if (dmg <= ai.shield) {
            ai.shield -= dmg;
          } else {
            const overflow = dmg - ai.shield;
            ai.shield = 0;
            ai.health -= overflow;
          }
        } else {
          ai.health -= dmg;
        }
        log('[hit] -' + Math.round(dmg)
          + ' dmg ; shield ' + Math.round(shieldBefore) + '->' + Math.round(ai.shield)
          + ', hp ' + Math.round(healthBefore) + '->' + Math.round(ai.health), 'info');
        if (ai.health <= 0 && !ai.dead) {
          ai.health = 0;
          ai.dead = true;
          log('AI died (killed by ' + shortId(claim.shooterId) + ')', 'bad');
          if (ai.sendEvent) {
            try {
              ai.sendEvent({
                type: 'kill',
                killerPeerId: claim.shooterId,
                killerName: 'AI',
                victimName: 'AI',
              });
            } catch (_) {}
          }
          // v27's per-tick round-end check only runs on the resolution
          // authority (lowest peerId). If THAT'S the bot, no peer will
          // fire round_end after we die, and the human is stuck in
          // playing forever. Fire it ourselves 250 ms later as a backup ;
          // v27's handler is idempotent if a real authority already fired.
          setTimeout(() => {
            if (!ai.sendEvent || ai.matchState !== 'playing') return;
            // Winner = the team that isn't us. If our team was 2 (A) the
            // human (or human team) is 3 (B).
            const ourTeam = ai.team;
            const winnerTeam = (ourTeam === 2) ? 3 : 2;
            const winnerLabel = winnerTeam === 2
              ? 'FLEET A WIPED FLEET B'
              : 'FLEET B WIPED FLEET A';
            try {
              ai.sendEvent({
                type: 'round_end',
                winnerTeam: winnerTeam,
                winnerLabel: winnerLabel,
                // Don't second-guess score deltas ; let v27 figure it out.
              });
              log('round_end broadcast (winner: team ' + (winnerTeam === 2 ? 'A' : 'B') + ')', 'ok');
            } catch (_) {}
          }, 250);
        }
      }
    }
  });
  onHitVote((vote, peerId) => {
    // Don't log vote spam.
  });
  onEvent((evt, peerId) => {
    if (!evt || !evt.type) return;
    // Surface a few interesting event types to the log.
    if (evt.type === 'match_start' || evt.type === 'launch_at' || evt.type === 'round_end' || evt.type === 'kill' || evt.type === 'ready') {
      log('event ' + evt.type + ' from ' + shortId(peerId), 'info');
    }
    if (evt.type === 'ready') {
      // Track per-peer ready state. We're always ready ourselves.
      ai.peerReady.set(peerId, !!evt.ready);
      checkProposer();
    } else if (evt.type === 'match_start') {
      ai.matchState = 'starting';
      ai.matchStartSent = true; // we've seen one ; don't propose another
      setStat('s-match', 'starting', 'warn');
      // (v0.4) Recompute team via the game's own peer-order rule so we
      // end up on the opposite side from the human. The game runs
      // assignTeamFromPeerOrder() on each peer at match_start ; index 0
      // (lowest sorted peerId) gets team A, index 1 gets team B. The
      // dropdown setting is just the initial fallback ; if we don't
      // override here, AI + human end up on the same team and share a
      // spawn room. Re-announce loadout if team changed so the human
      // sees the corrected team on their lobby chip.
      const allIds = [ai.selfId, ...ai.peers].sort();
      const myIndex = allIds.indexOf(ai.selfId);
      const newTeam = (myIndex % 2 === 0) ? 2 : 3;
      if (newTeam !== ai.team) {
        log('team recomputed : was ' + ai.team + ', now ' + newTeam + ' (peer-order index ' + myIndex + ')', 'ok');
        ai.team = newTeam;
        setStat('s-ship', ai.loadoutKey + ' / Team ' + (ai.team === 2 ? 'A' : 'B'));
        sendLoadoutAnnounce();
      }
      // Load the map JSON so we have room sphere data for wall containment.
      // Also drives the team-spawn placement when the map loads.
      // mapSpawnedFor reset so the spawn logic re-fires for this match.
      ai.mapSpawnedFor = null;
      if (evt.mapKey) {
        ai.mapPending = evt.mapKey;  // for the map_request retry loop
        loadMapRooms(evt.mapKey);
      }
      // Tell the human's launch gate we're done warming up. The bridge
      // has no shaders / assets to compile so warmup_ready is immediate.
      // Without this the human's loading screen waits forever on
      // 'WAITING FOR PEERS' while we self-transition to playing alone.
      if (ai.sendEvent) {
        try { ai.sendEvent({ type: 'warmup_ready' }); log('warmup_ready broadcast', 'ok'); }
        catch (_) {}
      }
      // Track that we've sent it so the lobby-heartbeat path can also
      // resend if a peer joined late and missed the original.
      ai._warmupReadySent = true;
      // Once match_start fires we move to the loadout/launch handshake.
      // Re-check in case all peers already have loadouts announced.
      checkProposer();
    } else if (evt.type === 'launch_at') {
      ai.matchState = 'launching';
      ai.launchAtSent = true;
      setStat('s-match', 'launching', 'warn');
      // v27 rebroadcasts launch_at every 150 ms for ~1.5 s ; only the
      // FIRST one (per match) should schedule the playing transition.
      // Stacking setTimeouts means each fire re-sets spawnProt = 3.0,
      // which kept the bot invulnerable for many seconds past the
      // intended 3-second window. Debounce by the launchAt wall-clock :
      // duplicate broadcasts of the same launchAt are no-ops.
      const SHORT_COUNTDOWN_MS = 3000;
      const launchAtKey = (typeof evt.launchAt === 'number') ? evt.launchAt : 0;
      if (ai._launchTimer && ai._launchTimerForKey === launchAtKey) {
        // Same launchAt as a pending timer ; ignore the duplicate.
      } else {
        if (ai._launchTimer) { clearTimeout(ai._launchTimer); ai._launchTimer = null; }
        ai._launchTimerForKey = launchAtKey;
        ai._launchTimer = setTimeout(() => {
          ai._launchTimer = null;
          ai.matchState = 'playing';
          setStat('s-match', 'playing', 'good');
          ai.spawnProt = 3.0;
          ai._playingSince = performance.now();
          ai._lastPeerStateAt = performance.now();
        }, SHORT_COUNTDOWN_MS);
      }
    } else if (evt.type === 'round_end') {
      ai.matchState = 'roundEnd';
      setStat('s-match', 'roundEnd', 'warn');
      // Reset handshake flags. Note : the game does NOT re-run the
      // match_start / launch_at handshake between rounds within the same
      // match ; only at the start of a fresh match. So the AI has to
      // detect the next round itself (via the timer below + the state
      // listener that watches for a peer's fresh spawnProt).
      ai.matchStartSent = false;
      ai.launchAtSent = false;
      ai._warmupReadySent = false;
      if (ai._launchTimer) { clearTimeout(ai._launchTimer); ai._launchTimer = null; }
      ai._launchTimerForKey = 0;
      // Re-anchor on the next round's spawns instead of inheriting the
      // previous round's position.
      ai._spawnSnapped = false;
      // Heal up for the next round. Keep dead=true and hide off-map so
      // the AI corpse / zombie isn't visible at the kill spot during
      // the round-end gap. The peer-anchor snap below will set dead=false
      // and teleport us to a real spawn when the next round actually
      // begins (signaled by either the round-end timer or a peer state
      // with fresh spawn protection).
      ai.dead = true;
      ai.doomed = false;
      ai.health = ai.maxHealth;
      ai.shield = ai.maxShield;
      ai.spawnProt = 3.0;
      // Park the AI's body far off-map during the gap so a stale state
      // broadcast doesn't render the corpse at the kill site.
      ai.position.x = 1e6;
      ai.position.y = 1e6;
      ai.position.z = 1e6;
      ai.velocity.x = 0; ai.velocity.y = 0; ai.velocity.z = 0;
      // Schedule a fallback transition back to 'playing' in 6 seconds
      // (the game's round-end timer is 5 s ; we add a 1 s buffer). If a
      // peer's spawnProt-tagged state broadcast arrives first, the state
      // handler below will fire the snap earlier.
      if (ai._roundResumeTimer) clearTimeout(ai._roundResumeTimer);
      ai._roundResumeTimer = setTimeout(() => {
        if (ai.matchState === 'roundEnd') {
          ai.matchState = 'playing';
          setStat('s-match', 'playing', 'good');
          respawnAtMapSpawn();
          ai._playingSince = performance.now();
          ai._lastPeerStateAt = performance.now();
          ai._noPeersSince = 0;
          log('round resume (timer fallback)', 'ok');
        }
      }, 6000);
    }
  });
  onLoadout((data, peerId) => {
    // Other peers announcing their loadout.
    log('loadout : ' + shortId(peerId) + ' is ' + (data.loadoutKey || '?') + ' team=' + (data.team || '?'));
    if (data && data.loadoutKey) {
      ai.peerLoadouts.set(peerId, {
        loadoutKey: data.loadoutKey,
        team: data.team,
        name: data.discord_name || null,
      });
    }
    // Loadout commits drive the launch_at proposer trigger.
    checkProposer();
  });
  onProj((data, peerId) => {
    // Track recent projectiles so the brain can see threats. Capped at 60
    // entries to bound observation size ; older entries are dropped.
    if (data && typeof data.ox === 'number') {
      ai.recentProjectiles.push({
        ox: data.ox, oy: data.oy, oz: data.oz,
        vx: data.vx, vy: data.vy, vz: data.vz,
        color: data.color, isFireSource: !!data.isFireSource,
        isArcWave: !!data.isArcWave, isCluster: !!data.isCluster,
        owner: peerId, _seenAt: performance.now(),
      });
      if (ai.recentProjectiles.length > 60) {
        ai.recentProjectiles.splice(0, ai.recentProjectiles.length - 60);
      }
    }
  });
}

// ============================================================
// Match handshake proposer logic.
// ------------------------------------------------------------
// Game protocol : the LOWEST peerId in the mesh proposes both
// match_start (lobby -> warmup) and launch_at (warmup -> playing).
// Other peers passively receive and schedule. If WE are the lowest
// peerId and we don't propose, the lobby stalls forever ; the human
// peer sits at "2/2 READY (1 PEER IN MESH)" with no progression.
//
// This function is called after every ready event, every loadout
// event, and every match_start receive. It checks both phases :
//   Phase 1 (lobby) : all peers ready ?  -> propose match_start
//   Phase 2 (warmup) : all peers committed loadouts ? -> propose launch_at
// ============================================================
function checkProposer() {
  if (!ai.room || !ai.selfId) return;
  if (ai.peers.size === 0) return; // no humans in the room ; nothing to start
  // Sort all peer IDs (self + remotes) ; lowest is the proposer.
  const allIds = [ai.selfId, ...ai.peers].sort();
  if (allIds[0] !== ai.selfId) return; // not our job
  if (!ai.matchStartSent) {
    // Phase 1 : every remote peer has flipped ready ? We're always ready
    // ourselves (we send ready immediately on join).
    let allReady = true;
    for (const pid of ai.peers) {
      if (!ai.peerReady.get(pid)) { allReady = false; break; }
    }
    if (allReady) sendMatchStartProposal();
  } else if (!ai.launchAtSent) {
    // Phase 2 : every remote peer has announced a loadout ? We announced
    // ours on join (sendLoadoutAnnounce), so just check the remotes.
    let allLoadout = true;
    for (const pid of ai.peers) {
      if (!ai.peerLoadouts.has(pid)) { allLoadout = false; break; }
    }
    if (allLoadout) sendLaunchAtProposal();
  }
}

// ============================================================
// Map JSON loader. Fetches ./maps/map_<key>.json and stores the
// room spheres for wall-containment use in the tick loop. Best
// effort ; if the file 404s or parsing fails, mapRooms stays
// null and the AI simply has no wall containment (matches v0.1
// behavior). Same path the game uses, so any custom map dropped
// into the maps folder works automatically.
// ============================================================
async function loadMapRooms(mapKey) {
  if (!mapKey) return;
  const url = './maps/map_' + mapKey + '.json';
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data || !Array.isArray(data.rooms)) throw new Error('no rooms in map');
    const rooms = data.rooms.map(r => ({
      id: r.id || '',
      team: r.team || null,
      champion: !!r.champion,
      x: +r.x || 0, y: +r.y || 0, z: +r.z || 0, r: +r.r || 200,
    }));
    const tunnels = (Array.isArray(data.tunnels) ? data.tunnels : []).map(t => ({
      r: +t.r || 100,
      path: (t.path || []).map(p => ({
        x: +p.x || 0, y: +p.y || 0, z: +p.z || 0,
      })),
    })).filter(t => t.path.length >= 2);
    ai.mapRooms = rooms;
    ai.mapTunnels = tunnels;
    ai.mapKey = mapKey;
    // Derive game mode from the map key (matches what the game does internally).
    // Race maps are named race_* ; everything else is treated as champion / regular.
    ai.mapMode = mapKey.startsWith('race_') ? 'race' : 'champion';
    // Build the race graph : rooms with neighbor links across tunnels.
    // Mirrors the v27 game's BFS structure so Python can do identical
    // pathfinding. Tunnel ends are matched to the room sphere they fall
    // inside, and each edge carries the corridor midpoint as a steering hint.
    const graph = { nodes: {}, finishId: null };
    for (const rm of rooms) {
      graph.nodes[rm.id] = {
        id: rm.id, x: rm.x, y: rm.y, z: rm.z, r: rm.r,
        team: rm.team, champion: !!rm.champion, neighbors: [],
      };
    }
    function _roomContaining(pt) {
      let best = null, bestD = Infinity;
      for (const rm of rooms) {
        const dx = pt.x - rm.x, dy = pt.y - rm.y, dz = pt.z - rm.z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 <= rm.r * rm.r && d2 < bestD) { best = rm; bestD = d2; }
      }
      return best;
    }
    for (const tun of tunnels) {
      const path = tun.path;
      if (!path || path.length < 2) continue;
      const a = _roomContaining(path[0]);
      const b = _roomContaining(path[path.length - 1]);
      if (!a || !b || a.id === b.id) continue;
      const midIdx = Math.floor(path.length / 2);
      const mid = path[midIdx];
      const na = graph.nodes[a.id], nb = graph.nodes[b.id];
      if (!na.neighbors.find(n => n.id === b.id)) {
        na.neighbors.push({ id: b.id, mid: { x: mid.x, y: mid.y, z: mid.z } });
      }
      if (!nb.neighbors.find(n => n.id === a.id)) {
        nb.neighbors.push({ id: a.id, mid: { x: mid.x, y: mid.y, z: mid.z } });
      }
    }
    for (const id in graph.nodes) {
      if (graph.nodes[id].champion) { graph.finishId = id; break; }
    }
    ai.raceGraph = graph;
    ai.championRoomId = graph.finishId;
    log('Loaded map ' + mapKey + ' (' + rooms.length + ' rooms, ' + tunnels.length + ' tunnels, mode=' + ai.mapMode + ', finish=' + (graph.finishId || 'n/a') + ')', 'ok');
    // Push the map to the Python brain so it has full geometry awareness.
    // The brain caches this and does its own BFS / containment checks ; we
    // don't repeat the static data in every tick observation.
    sendMapStaticToBrain();
    // (v0.4) Spawn the AI at its team's spawn room from the map JSON.
    // Map team field is 'A' / 'B' ; our internal team field is 2 / 3.
    // Once mapped, place the AI inside the matching spawn room (with
    // small random jitter so multiple AIs don't stack). Setting
    // _spawnSnapped suppresses the peer-anchor snap so the AI doesn't
    // jump into the human's spawn position later.
    if (ai.mapSpawnedFor !== mapKey) {
      const teamLetter = (ai.team === 2) ? 'A' : 'B';
      const spawnRoom = rooms.find(r => r.team === teamLetter);
      if (spawnRoom) {
        const jr = Math.max(0, spawnRoom.r - 60); // stay inside the spawn sphere
        ai.position.x = spawnRoom.x + (Math.random() - 0.5) * jr * 0.6;
        ai.position.y = spawnRoom.y + (Math.random() - 0.5) * jr * 0.3;
        ai.position.z = spawnRoom.z + (Math.random() - 0.5) * jr * 0.6;
        ai._spawnSnapped = true;
        ai.mapSpawnedFor = mapKey;
        ai.spawnProt = 3.0; // 3s invulnerability so we don't get instakilled at spawn
        ai.dead = false; // wake up if we were holding dead from previous round
        log('AI spawned at map spawn_' + teamLetter + ' : (' + Math.round(ai.position.x) + ',' + Math.round(ai.position.y) + ',' + Math.round(ai.position.z) + ')', 'ok');
      } else {
        log('No spawn room found for team ' + teamLetter + ' ; falling back to peer-anchor', 'warn');
      }
    }
  } catch (e) {
    ai.mapRooms = null;
    ai.mapTunnels = null;
    log('Map load failed (' + mapKey + ') : ' + (e && e.message ? e.message : e), 'warn');
    // Fallback : ask the Python brain to ship us the map. The brain has
    // disk access to the maps/ folder regardless of where the bridge is
    // hosted. The brain answers with a 'map_data' packet that we re-feed
    // into loadMapRooms via the raw JSON path (so the rest of this
    // function still runs, just with brain-supplied bytes).
    if (ai.brainConnected && ai.brainWs && ai.brainWs.readyState === 1) {
      try {
        ai.brainWs.send(JSON.stringify({ kind: 'map_request', mapKey: mapKey }));
        log('Requested map ' + mapKey + ' from Python brain (fetch unavailable)', 'warn');
      } catch (_) {}
    }
  }
}

// Apply a map_data packet from the Python brain. Same shape as the JSON
// the bridge would normally fetch (data.rooms, data.tunnels) ; we route
// it through a tiny shim that re-uses the rest of loadMapRooms's logic.
function applyMapDataFromBrain(mapKey, data) {
  if (!data || !Array.isArray(data.rooms)) {
    log('applyMapDataFromBrain : malformed payload', 'warn');
    return;
  }
  // Reuse loadMapRooms's body by stashing the fetched data into a closure
  // variable. Simplest path : duplicate the parse + raceGraph build here.
  const rooms = data.rooms.map(r => ({
    id: r.id || '', team: r.team || null, champion: !!r.champion,
    x: +r.x || 0, y: +r.y || 0, z: +r.z || 0, r: +r.r || 200,
  }));
  const tunnels = (Array.isArray(data.tunnels) ? data.tunnels : []).map(t => ({
    r: +t.r || 100,
    path: (t.path || []).map(p => ({ x: +p.x || 0, y: +p.y || 0, z: +p.z || 0 })),
  })).filter(t => t.path.length >= 2);
  ai.mapRooms = rooms;
  ai.mapTunnels = tunnels;
  ai.mapKey = mapKey;
  ai.mapMode = mapKey.startsWith('race_') ? 'race' : 'champion';
  const graph = { nodes: {}, finishId: null };
  for (const rm of rooms) {
    graph.nodes[rm.id] = {
      id: rm.id, x: rm.x, y: rm.y, z: rm.z, r: rm.r,
      team: rm.team, champion: !!rm.champion, neighbors: [],
    };
  }
  function _rc(pt) {
    let best = null, bestD = Infinity;
    for (const rm of rooms) {
      const dx = pt.x - rm.x, dy = pt.y - rm.y, dz = pt.z - rm.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 <= rm.r * rm.r && d2 < bestD) { best = rm; bestD = d2; }
    }
    return best;
  }
  for (const tun of tunnels) {
    const path = tun.path;
    if (!path || path.length < 2) continue;
    const a = _rc(path[0]);
    const b = _rc(path[path.length - 1]);
    if (!a || !b || a.id === b.id) continue;
    const mid = path[Math.floor(path.length / 2)];
    const na = graph.nodes[a.id], nb = graph.nodes[b.id];
    if (!na.neighbors.find(n => n.id === b.id)) {
      na.neighbors.push({ id: b.id, mid: { x: mid.x, y: mid.y, z: mid.z } });
    }
    if (!nb.neighbors.find(n => n.id === a.id)) {
      nb.neighbors.push({ id: a.id, mid: { x: mid.x, y: mid.y, z: mid.z } });
    }
  }
  for (const id in graph.nodes) {
    if (graph.nodes[id].champion) { graph.finishId = id; break; }
  }
  ai.raceGraph = graph;
  ai.championRoomId = graph.finishId;
  log('Loaded map ' + mapKey + ' from brain (' + rooms.length + ' rooms, mode=' + ai.mapMode + ')', 'ok');
  // Spawn at team room.
  if (ai.mapSpawnedFor !== mapKey) {
    const teamLetter = (ai.team === 2) ? 'A' : 'B';
    const spawnRoom = rooms.find(r => r.team === teamLetter);
    if (spawnRoom) {
      const jr = Math.max(0, spawnRoom.r - 60);
      ai.position.x = spawnRoom.x + (Math.random() - 0.5) * jr * 0.6;
      ai.position.y = spawnRoom.y + (Math.random() - 0.5) * jr * 0.3;
      ai.position.z = spawnRoom.z + (Math.random() - 0.5) * jr * 0.6;
      ai._spawnSnapped = true;
      ai.mapSpawnedFor = mapKey;
      ai.spawnProt = 3.0;
      ai.dead = false;
    }
  }
  // Re-push map_static so the brain's cached map matches what we built.
  sendMapStaticToBrain();
}

// Respawn the AI at its team's spawn room from the loaded map. Used by
// round-resume paths (both the timer fallback and the peer-spawn-signal
// path) so we don't end up sitting at the previous round's death spot
// AND don't peer-anchor onto the human's spawn point at round start.
// If no map is loaded we fall back to allowing the peer-anchor snap to
// pick a position from the next state broadcast.
function respawnAtMapSpawn() {
  if (!ai.mapRooms || ai.mapRooms.length === 0) {
    // No map data ; let the peer-anchor snap handle it.
    ai._spawnSnapped = false;
    ai.dead = false;
    return;
  }
  const teamLetter = (ai.team === 2) ? 'A' : 'B';
  const room = ai.mapRooms.find(r => r.team === teamLetter);
  if (!room) {
    ai._spawnSnapped = false;
    ai.dead = false;
    return;
  }
  const jr = Math.max(0, room.r - 60);
  ai.position.x = room.x + (Math.random() - 0.5) * jr * 0.6;
  ai.position.y = room.y + (Math.random() - 0.5) * jr * 0.3;
  ai.position.z = room.z + (Math.random() - 0.5) * jr * 0.6;
  ai._spawnSnapped = true;
  ai.dead = false;
  ai.health = ai.maxHealth;
  ai.shield = ai.maxShield;
  ai.spawnProt = 3.0;
  ai.velocity.x = 0; ai.velocity.y = 0; ai.velocity.z = 0;
}

// Test whether a point is inside ANY room sphere or ANY tunnel cylinder
// (cylinders are defined as paths of segments with a shared radius).
// Returns the SURFACE distance to the nearest containing element if
// inside (negative or zero), or the OUTWARD distance to the nearest
// such element (positive) plus a reference point for projection.
function _nearestPlayableElement() {
  let bestInside = false;
  let bestOutDist = Infinity;
  let bestProjX = 0, bestProjY = 0, bestProjZ = 0;
  // Rooms : sphere containment.
  if (ai.mapRooms) {
    for (const room of ai.mapRooms) {
      const dx = ai.position.x - room.x;
      const dy = ai.position.y - room.y;
      const dz = ai.position.z - room.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const surface = dist - room.r;
      // Inside requires hull-radius (~50u) of slack so ships don't half-poke through.
      if (surface <= -50) return { inside: true };
      if (surface < bestOutDist) {
        bestOutDist = surface;
        const t = Math.max(0, room.r - 70) / Math.max(0.001, dist);  // 70 = max hull radius
        bestProjX = room.x + dx * t;
        bestProjY = room.y + dy * t;
        bestProjZ = room.z + dz * t;
      }
    }
  }
  // Tunnels : segment-cylinder containment. Each tunnel is a polyline
  // with one radius across all segments.
  if (ai.mapTunnels) {
    for (const tunnel of ai.mapTunnels) {
      for (let i = 0; i < tunnel.path.length - 1; i++) {
        const a = tunnel.path[i];
        const b = tunnel.path[i + 1];
        const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
        const abLen2 = abx * abx + aby * aby + abz * abz;
        if (abLen2 < 0.001) continue;
        const apx = ai.position.x - a.x;
        const apy = ai.position.y - a.y;
        const apz = ai.position.z - a.z;
        // Project onto segment, clamp to [0,1].
        let t = (apx * abx + apy * aby + apz * abz) / abLen2;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const cx = a.x + abx * t, cy = a.y + aby * t, cz = a.z + abz * t;
        const dx = ai.position.x - cx, dy = ai.position.y - cy, dz = ai.position.z - cz;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const surface = dist - tunnel.r;
        if (surface <= -50) return { inside: true };
        if (surface < bestOutDist) {
          bestOutDist = surface;
          const k = Math.max(0, tunnel.r - 70) / Math.max(0.001, dist);  // 70 = max hull radius
          bestProjX = cx + dx * k;
          bestProjY = cy + dy * k;
          bestProjZ = cz + dz * k;
        }
      }
    }
  }
  if (bestInside) return { inside: true };
  if (bestOutDist === Infinity) return { inside: true }; // no map ; allow movement
  return { inside: false, projX: bestProjX, projY: bestProjY, projZ: bestProjZ };
}

// Clamp position to inside the playable volume (rooms + tunnels).
// If outside, project to the nearest legal point. If no map JSON
// loaded yet (network slow / 404), use a generous fallback bounding
// box centered on origin so the AI can't drift indefinitely off-map.
const FALLBACK_BOX = 1600;
function clampToRooms() {
  if ((!ai.mapRooms || ai.mapRooms.length === 0)
      && (!ai.mapTunnels || ai.mapTunnels.length === 0)) {
    // Fallback : keep the AI inside a coarse box around origin until
    // the real map JSON loads. Most maps are smaller than 1600 u
    // half-extent so this stays comfortably outside any room sphere.
    if (Math.abs(ai.position.x) > FALLBACK_BOX) {
      ai.position.x = Math.sign(ai.position.x) * FALLBACK_BOX;
      ai.velocity.x = 0;
    }
    if (Math.abs(ai.position.y) > FALLBACK_BOX * 0.6) {
      ai.position.y = Math.sign(ai.position.y) * FALLBACK_BOX * 0.6;
      ai.velocity.y = 0;
    }
    if (Math.abs(ai.position.z) > FALLBACK_BOX) {
      ai.position.z = Math.sign(ai.position.z) * FALLBACK_BOX;
      ai.velocity.z = 0;
    }
    return false;
  }
  const r = _nearestPlayableElement();
  if (r.inside) return false;
  // Outward direction = position - projection (the side we came from).
  const ox = ai.position.x - r.projX;
  const oy = ai.position.y - r.projY;
  const oz = ai.position.z - r.projZ;
  const oLen = Math.sqrt(ox*ox + oy*oy + oz*oz) || 1;
  const onx = ox / oLen, ony = oy / oLen, onz = oz / oLen;
  ai.position.x = r.projX;
  ai.position.y = r.projY;
  ai.position.z = r.projZ;
  // Slide along the surface : remove the outward velocity component,
  // keep the tangent. The brain's lateral intent isn't erased ; the AI
  // grinds along the wall instead of stopping dead.
  const vDot = ai.velocity.x * onx + ai.velocity.y * ony + ai.velocity.z * onz;
  if (vDot > 0) {
    ai.velocity.x -= onx * vDot;
    ai.velocity.y -= ony * vDot;
    ai.velocity.z -= onz * vDot;
  }
  return true;
}

function sendMatchStartProposal() {
  if (!ai.sendEvent || ai.matchStartSent) return;
  ai.matchStartSent = true;
  const startAt = Date.now() + 3000;
  const mapKey = 'hourglass'; // safe default ; future versions can pick smarter
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  try {
    ai.sendEvent({ type: 'match_start', startAt, mapKey, seed });
    log('PROPOSED match_start (map=' + mapKey + ', startAt=+3s)', 'ok');
  } catch (e) { log('match_start send failed : ' + e.message, 'err'); }
  ai.matchState = 'starting';
  setStat('s-match', 'starting', 'warn');
}

function sendLaunchAtProposal() {
  if (!ai.sendEvent || ai.launchAtSent) return;
  ai.launchAtSent = true;
  const launchAt = Date.now() + 1500;
  try {
    ai.sendEvent({ type: 'launch_at', launchAt });
    log('PROPOSED launch_at (+1.5s)', 'ok');
  } catch (e) { log('launch_at send failed : ' + e.message, 'err'); }
  ai.matchState = 'launching';
  setStat('s-match', 'launching', 'warn');
  // Same timing as the receiver path : event-receipt + SHORT_COUNTDOWN.
  // For the proposer, that's launchAt + SHORT_COUNTDOWN (since we issue
  // launchAt = now + 1500 and treat 'now' as our receipt).
  const SHORT_COUNTDOWN_MS = 3000;
  setTimeout(() => {
    ai.matchState = 'playing';
    setStat('s-match', 'playing', 'good');
    ai.spawnProt = 3.0;
    ai._playingSince = performance.now();
    ai._lastPeerStateAt = performance.now();
  }, (launchAt - Date.now()) + SHORT_COUNTDOWN_MS);
}

// ============================================================
// Python brain bridge (WebSocket)
// ------------------------------------------------------------
// Connects to a Python AI process at brainUrl. Each tick the
// bridge sends an observation packet ; the brain replies with
// an action packet that drives the AI's velocity / aim / fire
// / ability / core. Auto-reconnects every 3 s if disconnected.
// If no action has arrived within ACTION_STALE_S the bridge
// falls back to the orbit policy so the bot keeps moving.
// ============================================================
const ACTION_STALE_S = 0.5; // brain considered stale if no action in 500 ms

function connectBrain() {
  const url = (document.getElementById('brain-url').value || '').trim();
  if (!url) return;
  if (ai.brainWs && ai.brainWs.readyState <= 1) return; // already connecting / open
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    setStat('s-brain', 'WS init failed', 'bad');
    ai.brainReconnectAt = performance.now() + 3000;
    return;
  }
  ai.brainWs = ws;
  setStat('s-brain', 'connecting', 'warn');
  ws.onopen = () => {
    ai.brainConnected = true;
    setStat('s-brain', 'connected', 'good');
    log('Python brain connected at ' + url, 'ok');
    // Send a tiny hello so Python knows who we are (loadout / team / selfId).
    try {
      ws.send(JSON.stringify({
        kind: 'hello',
        selfId: ai.selfId,
        loadout: ai.loadoutKey,
        team: ai.team,
      }));
    } catch (_) {}
    // If a map is already loaded, push it over now so a brain that
    // connects mid-match still gets full geometry awareness.
    sendMapStaticToBrain();
  };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg || typeof msg !== 'object') return;
    // The brain can push two kinds of message :
    //   { kind: 'map_data', mapKey, data: {...} } -> use as fallback map source
    //   anything else (no kind, or kind === 'action') -> treat as an action
    if (msg.kind === 'map_data' && msg.mapKey && msg.data) {
      try { applyMapDataFromBrain(msg.mapKey, msg.data); }
      catch (e) { log('applyMapDataFromBrain failed : ' + e.message, 'err'); }
      return;
    }
    ai.brainAction = msg;
    ai.brainActionAge = 0;
    ai.brainActionCount++;
    setStat('s-actions', ai.brainActionCount);
  };
  ws.onerror = () => {
    setStat('s-brain', 'error', 'bad');
  };
  ws.onclose = () => {
    ai.brainConnected = false;
    ai.brainWs = null;
    setStat('s-brain', 'offline (fallback orbit)', 'warn');
    ai.brainReconnectAt = performance.now() + 3000;
  };
}

// Push the loaded map structure (rooms + tunnels + race graph) to the
// Python brain as a one-shot 'map_static' packet. Triggered on map load
// AND on brain (re)connect, so however these events interleave, the
// brain ends up with the right data. No-op if brain is offline or no
// map is loaded yet.
function sendMapStaticToBrain() {
  if (!ai.brainConnected || !ai.brainWs || ai.brainWs.readyState !== 1) return;
  if (!ai.mapRooms || !ai.raceGraph) return;
  try {
    ai.brainWs.send(JSON.stringify({
      kind: 'map_static',
      mapKey: ai.mapKey || null,
      mode: ai.mapMode || 'champion',
      rooms: ai.mapRooms,
      tunnels: ai.mapTunnels || [],
      race_graph: ai.raceGraph,
      champion_room_id: ai.championRoomId || null,
      arena_size: 4000, // matches LSS.ARENA_SIZE * ~0.9 fallback
    }));
    log('Pushed map_static to brain (' + (ai.mapRooms.length) + ' rooms)', 'ok');
  } catch (e) {
    log('sendMapStaticToBrain failed : ' + (e && e.message ? e.message : e), 'warn');
  }
}

// Cheap "which room am I in?" containment check. Returns the room id
// of the sphere we're inside, or null if we're in a tunnel / outside.
// Used by buildObservation so the brain doesn't have to repeat this
// math every tick on the Python side.
function _currentRoomId() {
  if (!ai.mapRooms) return null;
  for (const rm of ai.mapRooms) {
    const dx = ai.position.x - rm.x;
    const dy = ai.position.y - rm.y;
    const dz = ai.position.z - rm.z;
    if (dx*dx + dy*dy + dz*dz <= rm.r * rm.r) return rm.id;
  }
  return null;
}

// Build the observation packet the brain receives each tick.
// Designed to be flat / fixed-ish ; arrays for peers and recent
// projectiles. Brain is responsible for handling variable list lengths.
function buildObservation(dt) {
  const peers = [];
  for (const [pid, st] of ai.peerStates) {
    const lo = ai.peerLoadouts.get(pid);
    peers.push({
      id: pid,
      px: st.px, py: st.py, pz: st.pz,
      vx: st.vx, vy: st.vy, vz: st.vz,
      qx: st.qx, qy: st.qy, qz: st.qz, qw: st.qw,
      hp: st.hp || 0, shield: st.shield || 0,
      dead: !!st.dead, doomed: !!st.doomed,
      team: (lo && lo.team) || st.team || null,
      loadout: (lo && lo.loadoutKey) || null,
    });
  }
  const projs = ai.recentProjectiles.slice(-40).map(p => ({
    ox: p.ox, oy: p.oy, oz: p.oz,
    vx: p.vx, vy: p.vy, vz: p.vz,
    color: p.color, owner: p.owner,
    isArcWave: !!p.isArcWave, isCluster: !!p.isCluster, isFireSource: !!p.isFireSource,
  }));
  return {
    kind: 'obs',
    tick: ai.tickCount,
    t: performance.now() / 1000,
    dt: dt,
    match_state: ai.matchState,
    mode: ai.mapMode || 'champion',
    self: {
      px: ai.position.x, py: ai.position.y, pz: ai.position.z,
      vx: ai.velocity.x, vy: ai.velocity.y, vz: ai.velocity.z,
      qx: ai.quat.x, qy: ai.quat.y, qz: ai.quat.z, qw: ai.quat.w,
      hp: ai.health, shield: ai.shield,
      max_hp: ai.maxHealth, max_shield: ai.maxShield,
      loadout: ai.loadoutKey, team: ai.team,
      dead: ai.dead, doomed: ai.doomed,
      core_meter: ai.coreMeter,
      ability_cd: ai.abilityGate.slice(),
      fire_ready: ai.fireGate <= 0,
      spawn_prot: ai.spawnProt,
    },
    // Cheap precomputed nav hints. Lets the brain skip per-tick
    // containment checks ; brain still has the full map_static cache
    // for its own BFS / steering decisions.
    nav: {
      current_room_id: _currentRoomId(),
      champion_room_id: ai.championRoomId || null,
      mode: ai.mapMode || 'champion',
    },
    peers: peers,
    projectiles: projs,
  };
}

// Apply an action packet to AI state. Action shape :
//   { vx, vy, vz }      : direct velocity vector (units/s)
//   { aim: [x,y,z] }    : world-space target to face ; bridge builds quat
//   { fire: bool }      : try to fire main weapon (gated by fireRate)
//   { ability: 0/1/2 }  : try to use ability slot (gated by cooldown)
//   { core: bool }      : try to activate core (gated by meter)
// Fields are independent ; any subset can be set.
function applyAction(act) {
  if (!act) return;
  if (typeof act.vx === 'number') ai.velocity.x = act.vx;
  if (typeof act.vy === 'number') ai.velocity.y = act.vy;
  if (typeof act.vz === 'number') ai.velocity.z = act.vz;
  if (Array.isArray(act.aim) && act.aim.length === 3) {
    const dx = act.aim[0] - ai.position.x;
    const dy = act.aim[1] - ai.position.y;
    const dz = act.aim[2] - ai.position.z;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    const nx = dx / len, ny = dy / len, nz = dz / len;
    // Build a yaw + pitch quaternion that faces (nx,ny,nz). Forward in
    // game is -Z, so we yaw around Y by atan2(nx, -nz) ; pitch around X
    // by asin(ny). Compose Y * X (yaw then pitch).
    const yaw   = Math.atan2(nx, -nz);
    const pitch = Math.asin(Math.max(-1, Math.min(1, ny)));
    const cy = Math.cos(yaw * 0.5),   sy = Math.sin(yaw * 0.5);
    const cp = Math.cos(pitch * 0.5), sp = Math.sin(pitch * 0.5);
    ai.quat.x = cy * sp;
    ai.quat.y = sy * cp;
    ai.quat.z = -sy * sp;
    ai.quat.w = cy * cp;
  }
  // Don't broadcast attacks into an empty mesh. If no peers are present
  // the only audience is the bridge itself, so firing is just noise.
  const haveAudience = ai.peers.size > 0;
  if (act.fire && ai.fireGate <= 0 && !ai.dead && haveAudience) {
    fireWeapon();
    const w = WEAPON_BY_LOADOUT[ai.loadoutKey];
    ai.fireGate = (w && w.fireRate) || 0.25;
  }
  if (typeof act.ability === 'number' && act.ability >= 0 && act.ability <= 2
      && ai.abilityGate[act.ability] <= 0 && !ai.dead && haveAudience) {
    fireAbility(act.ability);
    const cds = ABILITY_CDS_BY_LOADOUT[ai.loadoutKey] || [5, 0, 8];
    ai.abilityGate[act.ability] = cds[act.ability] || 5;
  }
  if (act.core && ai.coreMeter >= 100 && !ai.dead && haveAudience) {
    fireCore();
    ai.coreMeter = 0;
  }
}

// v0.3 fire path. Splits behavior by weapon mode so the AI fires its
// weapons the same way a human / in-game bot does :
//   hitscan  -> raycast against known peer positions, send a hit claim
//               for any enemy along the line of fire, send a fire_tracer
//               event so other clients see the streak.
//   projectile -> send a real proj broadcast (other clients render +
//               collision-check the projectile, hit-claim flows back).
//   spread   -> N raycasts in a tight cone (one hit claim per pellet
//               that lands), plus a pellet_burst event for visuals.
// This replaces the v0.2 behavior where every weapon fired a
// "fake projectile" that bounced off walls weirdly.
function fireWeapon() {
  const w = WEAPON_BY_LOADOUT[ai.loadoutKey];
  if (!w) return;
  const aim = quatForward(ai.quat);
  if (w.mode === 'hitscan') {
    fireHitscan(aim, w, w.damage);
    sendFireTracer(aim, w);
  } else if (w.mode === 'spread') {
    // Spread = shotgun. Fire `pellets` raycasts with a small cone.
    const pellets = w.pellets || 8;
    for (let i = 0; i < pellets; i++) {
      const spread = 0.10;
      const jx = (Math.random() - 0.5) * spread;
      const jy = (Math.random() - 0.5) * spread;
      const pa = { x: aim.x + jx, y: aim.y + jy, z: aim.z };
      const len = Math.sqrt(pa.x * pa.x + pa.y * pa.y + pa.z * pa.z) || 1;
      pa.x /= len; pa.y /= len; pa.z /= len;
      fireHitscan(pa, w, w.damage); // each pellet's damage
    }
    // pellet_burst event for the visual cloud of sparks.
    if (ai.sendEvent) {
      try {
        ai.sendEvent({
          type: 'pellet_burst',
          ox: ai.position.x, oy: ai.position.y, oz: ai.position.z,
          dx: aim.x, dy: aim.y, dz: aim.z,
          range: w.range || 900,
        });
      } catch (_) {}
    }
  } else {
    // Projectile mode (Pyro Thermite, Tracker Tracking Bolt).
    if (!ai.sendProjectile) return;
    const speed = (w.projSpeed && w.projSpeed > 0) ? w.projSpeed : 600;
    try {
      ai.sendProjectile({
        ox: ai.position.x, oy: ai.position.y, oz: ai.position.z,
        vx: aim.x * speed, vy: aim.y * speed, vz: aim.z * speed,
        color: w.color,
        isFireSource: !!w.isFireSource,
        isArcWave: false,
        isCluster: false,
        sizeMult: 1.0,
        splash: w.splash || 0,
        tracking: false,
        salvoGuided: false,
      });
    } catch (_) {}
  }
}

// Cast a ray from our position along `aim` ; find the closest non-team
// peer whose hull cylinder intersects within `w.range` ; send a hit
// claim for `damage` (with bot 0.6 scaling + distance falloff matching
// the game's fireAtPlayer behavior). Wall blockage isn't checked yet
// because we don't have the full collision mesh ; only room spheres are
// loaded. v0.3 trade-off : an AI can "shoot through walls" if the line
// passes through corridors the room spheres don't cover. Most player-
// vs-player engagements are inside or near room spheres so this is a
// small drift, not a god-mode.
function fireHitscan(aim, w, damage) {
  if (!ai.sendHitClaim) return;
  const range = w.range || 3000;
  let closestPid = null;
  let closestT = Infinity;
  for (const [pid, st] of ai.peerStates) {
    if (!st || st.dead) continue;
    const lo = ai.peerLoadouts.get(pid);
    if (lo && lo.team === ai.team) continue; // same team
    // Vector from AI to peer.
    const dx = st.px - ai.position.x;
    const dy = st.py - ai.position.y;
    const dz = st.pz - ai.position.z;
    // Project onto aim direction.
    const t = dx * aim.x + dy * aim.y + dz * aim.z;
    if (t < 0 || t > range) continue;
    // Perpendicular distance from peer center to the ray.
    const cx = ai.position.x + aim.x * t;
    const cy = ai.position.y + aim.y * t;
    const cz = ai.position.z + aim.z * t;
    const px = st.px - cx, py = st.py - cy, pz = st.pz - cz;
    const perp = Math.sqrt(px * px + py * py + pz * pz);
    // Ship hull radius : ~60 units (chassis hullLength ~80-140, ~50%
    // for hit detection is generous but matches the game's check).
    const hullR = 70;
    if (perp < hullR && t < closestT) {
      closestT = t;
      closestPid = pid;
    }
  }
  if (!closestPid) return;
  // Distance falloff + bot damage scaling, matching the in-game bot.
  const rangeRatio = Math.max(0, 1 - closestT / range);
  const falloff = 0.7 + rangeRatio * 0.3;
  const finalDmg = damage * 0.6 * falloff;
  try {
    ai.sendHitClaim({
      hitId: ++ai.hitIdCounter,
      shooterId: ai.selfId,
      targetId: closestPid,
      damage: finalDmg,
      sx: ai.position.x,
      sy: ai.position.y,
      sz: ai.position.z,
    });
    ai.damageDealt = (ai.damageDealt | 0) + Math.round(finalDmg);
  } catch (_) {}
}

// Broadcast a fire_tracer event so other clients render a beam streak
// in our class color. Range can be the weapon range or shorter ; we
// use the weapon range so the tracer extends out to weapon-max even
// when we missed (matches how the game's tracers are drawn).
function sendFireTracer(aim, w) {
  if (!ai.sendEvent) return;
  const range = w.range || 3000;
  try {
    ai.sendEvent({
      type: 'fire_tracer',
      ox: ai.position.x, oy: ai.position.y, oz: ai.position.z,
      ex: ai.position.x + aim.x * range,
      ey: ai.position.y + aim.y * range,
      ez: ai.position.z + aim.z * range,
      color: w.color || 0xffaa00,
      lo: ai.loadoutKey,
    });
  } catch (_) {}
}

// Fire an ability projectile. The shapes mirror what bots in the game
// emit ; receivers parse them through the same proj path so damage and
// flags work the same as real player ability fires.
function fireAbility(slot) {
  if (!ai.sendProjectile) return;
  const aim = quatForward(ai.quat);
  const color = (WEAPON_BY_LOADOUT[ai.loadoutKey] && WEAPON_BY_LOADOUT[ai.loadoutKey].color) || 0xffaa00;
  // Generic ability projectile : strong damage, decent speed. Real
  // ability semantics (Stun Bolt isArcWave, Cluster Missile isCluster,
  // Tracker Rockets tracking, etc.) plug in here per slot per loadout
  // in v0.3 ; v0.2 just sends a placeholder so the brain has SOMETHING
  // to fire on the ability channel.
  try {
    ai.sendProjectile({
      ox: ai.position.x, oy: ai.position.y, oz: ai.position.z,
      vx: aim.x * 900, vy: aim.y * 900, vz: aim.z * 900,
      color: color, sizeMult: 1.5, splash: 200,
      isArcWave: (ai.loadoutKey === 'SLAYER'),
      isCluster: (ai.loadoutKey === 'PUNCTURE'),
      tracking: false, salvoGuided: false, isFireSource: false,
    });
  } catch (_) {}
  if (ai.sendEvent) {
    try { ai.sendEvent({ type: 'ability', slot: slot, peerId: ai.selfId }); } catch (_) {}
  }
}

// Fire core : just an event broadcast for now. Real game core paths
// stay client-local on the caster, so a network event is the cleanest
// signal that "this peer just activated their core."
function fireCore() {
  if (!ai.sendEvent) return;
  try { ai.sendEvent({ type: 'core', peerId: ai.selfId, loadout: ai.loadoutKey }); } catch (_) {}
}

// Helper : forward vector (-Z) rotated by quaternion.
function quatForward(q) {
  // Apply q to (0, 0, -1). Standard formula.
  const x =  2 * (q.x * q.z - q.w * q.y);
  const y = -2 * (q.y * q.z + q.w * q.x);
  const z = -1 + 2 * (q.x * q.x + q.y * q.y);
  // Result is already unit if q is unit ; normalize defensively.
  const len = Math.sqrt(x * x + y * y + z * z) || 1;
  return { x: x / len, y: y / len, z: z / len };
}

function shortId(id) {
  if (!id) return '?';
  return String(id).slice(0, 6);
}

// ============================================================
// Connect / disconnect
// ============================================================
async function joinRoom() {
  const code = document.getElementById('room-code').value.trim().toUpperCase();
  if (!code) {
    log('Room code required', 'err');
    return;
  }
  const shipSel = document.getElementById('ship-select').value;
  ai.loadoutKey = shipSel || SHIPS[Math.floor(Math.random() * SHIPS.length)];
  ai.team = parseInt(document.getElementById('team-select').value, 10) || 2;
  const stats = CHASSIS_BY_LOADOUT[ai.loadoutKey] || { maxHealth: 10000, maxShield: 3500 };
  ai.maxHealth = stats.maxHealth;
  ai.maxShield = stats.maxShield;
  ai.health = stats.maxHealth;
  ai.shield = stats.maxShield;

  pickSpawn();

  document.getElementById('btn-join').disabled = true;
  document.getElementById('btn-leave').disabled = false;
  setStat('s-conn', 'connecting', 'warn');

  try {
    const trystero = await import(TRYSTERO_URL);
    const { joinRoom: trysteroJoin, selfId } = trystero;
    ai.selfId = selfId;
    ai.room = trysteroJoin({ appId: APP_ID }, code);

    setStat('s-conn', 'connected', 'good');
    setStat('s-self', shortId(selfId));
    setStat('s-room', code);
    setStat('s-ship', ai.loadoutKey + ' / Team ' + (ai.team === 2 ? 'A' : 'B'));
    log('Joined room ' + code + ' as ' + shortId(selfId), 'ok');

    bindChannels(ai.room);

    ai.room.onPeerJoin((peerId) => {
      ai.peers.add(peerId);
      setStat('s-peers', ai.peers.size);
      log('peer joined : ' + shortId(peerId), 'ok');
      // Re-announce loadout so the new peer sees us.
      sendLoadoutAnnounce();
      // Re-send ready so the joiner knows we're ready to launch.
      if (ai.ready && ai.sendEvent) {
        try { ai.sendEvent({ type: 'ready', ready: true }); } catch (_) {}
      }
      // If we've already passed match_start, the new peer is mid-warmup
      // gate and is waiting for us to confirm. Resend warmup_ready so
      // their loading screen advances.
      if (ai._warmupReadySent && ai.sendEvent) {
        try { ai.sendEvent({ type: 'warmup_ready' }); } catch (_) {}
      }
    });
    ai.room.onPeerLeave((peerId) => {
      ai.peers.delete(peerId);
      setStat('s-peers', ai.peers.size);
      log('peer left : ' + shortId(peerId), 'warn');
    });

    // Initial announces ; we're in the room and committed to a loadout.
    sendLoadoutAnnounce();
    // Flip the AI to "ready" immediately so the lobby's all-ready check
    // doesn't gate on us. Real players hit the ready button manually ;
    // the AI never sits in not-ready limbo.
    ai.ready = true;
    setTimeout(() => {
      try { ai.sendEvent({ type: 'ready', ready: true }); log('ready broadcast', 'ok'); } catch (_) {}
    }, 400);

    startTickLoop();
  } catch (e) {
    log('Join failed : ' + (e && e.message ? e.message : e), 'err');
    setStat('s-conn', 'failed', 'bad');
    document.getElementById('btn-join').disabled = false;
    document.getElementById('btn-leave').disabled = true;
  }
}

// Handle pool for the auto-generated display name. The bridge picks
// one at random if the user didn't type a name. Mirrors the "looks
// like a human handle" goal : two-syllable adjective + creature word
// joined by an underscore, sometimes with trailing digits. Drop in
// or replace freely ; the pool is purely cosmetic.
const HANDLE_ADJ = ['quick','grim','hollow','bright','swift','pale','iron','rogue','silent','wraith','vivid','quiet','sharp','ember','crimson','onyx','azure','coral','frost','feral'];
const HANDLE_NOUN = ['mantis','viper','heron','crow','wolf','sparrow','panther','otter','shark','lynx','falcon','hare','newt','badger','swan','marten','stoat','ferret','seal','raptor'];
function _generateAiHandle() {
  const adj = HANDLE_ADJ[Math.floor(Math.random() * HANDLE_ADJ.length)];
  const noun = HANDLE_NOUN[Math.floor(Math.random() * HANDLE_NOUN.length)];
  const tail = Math.random() < 0.4 ? String(Math.floor(Math.random() * 99)) : '';
  // Capitalize first letters so the chip looks like "Quick_Mantis".
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  return cap(adj) + '_' + cap(noun) + tail;
}

// Synthetic Discord snowflake : v27's chip code only cares that the
// field is non-empty, but we shape it like a real 18-digit ID so any
// future tooling that pattern-matches "looks like a snowflake" agrees.
function _generateFakeDiscordId() {
  // 17-19 digits, no leading zero.
  let s = String(1 + Math.floor(Math.random() * 9));
  while (s.length < 18) s += String(Math.floor(Math.random() * 10));
  return s;
}

function sendLoadoutAnnounce() {
  if (!ai.sendLoadout) return;
  // Name : user-typed input first, then a generated handle. Cached on
  // ai so repeated announces stay consistent for the lifetime of the peer.
  if (!ai._displayName) {
    const typed = (document.getElementById('bot-name').value || '').trim();
    ai._displayName = typed || _generateAiHandle();
  }
  if (!ai._fakeDiscordId) {
    ai._fakeDiscordId = _generateFakeDiscordId();
  }
  try {
    ai.sendLoadout({
      loadoutKey: ai.loadoutKey,
      team: ai.team,
      peerId: ai.selfId,
      // The game's lobby chip code reads discord_id / discord_name /
      // discord_avatar to decide whether a peer is "signed in". By
      // shipping a synthetic ID + handle and leaving avatar undefined,
      // we show up with a generated initials-style chip in the same
      // slot a human peer would occupy.
      discord_id:   ai._fakeDiscordId,
      discord_name: ai._displayName,
      discord_avatar: undefined,
    });
  } catch (e) { log('Loadout announce failed : ' + e.message, 'err'); }
}

function leaveRoom() {
  if (ai.intervalId) clearInterval(ai.intervalId);
  ai.intervalId = null;
  if (ai.room && typeof ai.room.leave === 'function') {
    try { ai.room.leave(); } catch (_) {}
  }
  ai.room = null;
  ai.peers.clear();
  ai.peerStates.clear();
  ai.peerLoadouts.clear();
  ai.peerReady.clear();
  ai.matchStartSent = false;
  ai.launchAtSent = false;
  ai.matchState = 'lobby';
  ai.brainActionCount = 0;
  setStat('s-actions', 0);
  ai.sentCount = 0;
  ai.recvCount = 0;
  // (v0.4) Thorough session-state reset so a leave-rejoin starts clean.
  // Previously these accumulated across sessions, which caused stale
  // map-spawn-skip + stale peer-anchor-skip + stale dead/health values
  // that made the AI look glitchy on rejoin.
  ai._spawnSnapped = false;
  ai.mapSpawnedFor = null;
  ai.mapRooms = null;
  ai.mapTunnels = null;
  ai.dead = false;
  ai.health = 0;
  ai.shield = 0;
  ai.spawnProt = 0;
  ai.position.x = 0; ai.position.y = 0; ai.position.z = 0;
  ai.velocity.x = 0; ai.velocity.y = 0; ai.velocity.z = 0;
  if (ai._roundResumeTimer) { clearTimeout(ai._roundResumeTimer); ai._roundResumeTimer = null; }
  setStat('s-conn', 'disconnected', 'bad');
  setStat('s-self', '-');
  setStat('s-room', '-');
  setStat('s-peers', 0);
  setStat('s-sent', 0);
  setStat('s-recv', 0);
  setStat('s-ship', '-');
  setStat('s-match', 'lobby');
  log('Left room', 'warn');
  document.getElementById('btn-join').disabled = false;
  document.getElementById('btn-leave').disabled = true;
}

document.getElementById('btn-join').addEventListener('click', joinRoom);
document.getElementById('btn-leave').addEventListener('click', leaveRoom);

// Auto-populate room code from ?room= query param if present.
const _qsRoom = new URLSearchParams(window.location.search).get('room');
if (_qsRoom) document.getElementById('room-code').value = _qsRoom.toUpperCase();

// Init the status panel default text.
setStat('s-conn', 'disconnected', 'bad');
log('Ready. Enter a room code and click Join.', 'info');

</script>
