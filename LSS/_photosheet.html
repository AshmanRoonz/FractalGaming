<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>photo sheet</title>
<style>
  html,body{margin:0;background:#0a0d14;color:#cfe;font:12px/1.3 system-ui,sans-serif}
  #hdr{padding:4px 8px;background:#111827;color:#ffaa00;font-weight:700;letter-spacing:.08em}
  #g{display:grid;gap:4px;padding:4px}
  .c{position:relative;background:#000;overflow:hidden}
  .c img{width:100%;display:block}
  .cap{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.7);color:#9fd;
       padding:2px 6px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="hdr">loading…</div><div id="g"></div>
<script>
const P = new URLSearchParams(location.search);
const q = P.get('q') || 'building facade';
const n = +(P.get('n') || 6);
const cols = +(P.get('cols') || 3);
const w = +(P.get('w') || 900);
const off = +(P.get('off') || 0);
document.getElementById('g').style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search' +
  '&gsrsearch=' + encodeURIComponent(q) + '&gsrnamespace=6&gsrlimit=' + (n + off) +
  '&gsroffset=0&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=' + w +
  '&format=json&origin=*';
fetch(url).then(r => r.json()).then(j => {
  const pages = (j.query && j.query.pages) ? Object.values(j.query.pages) : [];
  pages.sort((a,b) => (a.index||0) - (b.index||0));
  const use = pages.slice(off, off + n);
  document.getElementById('hdr').textContent = q.toUpperCase() + '  ·  ' + use.length + ' images  ·  Wikimedia Commons';
  let h = '';
  for (const p of use) {
    const ii = p.imageinfo && p.imageinfo[0];
    if (!ii || !ii.thumburl) continue;
    h += '<div class="c"><img src="' + ii.thumburl + '" referrerpolicy="no-referrer">' +
         '<div class="cap">' + (p.title || '').replace(/^File:/, '') + '</div></div>';
  }
  document.getElementById('g').innerHTML = h || '<div style="padding:20px">no results</div>';
  window.__n = use.length;
}).catch(e => { document.getElementById('hdr').textContent = 'ERR ' + e.message; });
</script></body></html>
