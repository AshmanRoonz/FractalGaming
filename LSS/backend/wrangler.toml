# LSS backend Worker config.
# This Worker is api.lss.fractalreality.ca ; the API behind the stats
# website + game-side match posting + lobby browser. See LSS_backend-plan.md.

name              = "lss-backend"
main              = "src/worker.js"
compatibility_date = "2026-05-02"

# D1 database binding. Created via:
#   wrangler d1 create lss-stats
# After creation, paste the printed database_id below.
[[d1_databases]]
binding       = "DB"
database_name = "lss-stats"
database_id   = "d8ee795c-ce34-4379-8fdb-770f49fd82c2"

# KV namespace for ephemeral lobby heartbeats. Created via:
#   wrangler kv namespace create ROOMS
# After creation, paste the printed id below.
[[kv_namespaces]]
binding = "ROOMS"
id      = "fe801add70614d9a8861d4e79a750060"

# KV namespace for hot read-cache (top-N leaderboard, etc.). Created via:
#   wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id      = "620b789dd1b049ed90b21f8877f186d5"

# Allowed origins for CORS responses. Comma-separated. The Worker checks
# the request's Origin header against this list and echoes a matching
# Access-Control-Allow-Origin header back. Update if you add new
# preview / staging origins.
[vars]
ALLOWED_ORIGINS  = "https://lss.fractalreality.ca,http://localhost:8000,http://localhost:8099"
APPLICATION_ID   = "1500305353210855615"

# Optional: route the Worker on a custom domain. After deploying once,
# uncomment + configure in the Cloudflare dashboard, or via
# `wrangler routes`. Until then the Worker is reachable at
# lss-backend.<your-account>.workers.dev.
# routes = [
#   { pattern = "api.lss.fractalreality.ca/*", zone_name = "fractalreality.ca" },
# ]
