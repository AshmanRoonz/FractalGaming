<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BCS TSL spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #050608; color: #aaccdd;
    font: 12px/1.4 monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 8px 10px;
    background: rgba(0,0,0,0.55); border: 1px solid #234;
    z-index: 10; pointer-events: auto; min-width: 280px;
  }
  #hud button { margin: 4px 6px 0 0; padding: 4px 8px; background: #123;
    border: 1px solid #345; color: #aef; cursor: pointer; }
  #hud button:hover { background: #245; }
  #hud button.on { background: #295; color: #fff; }
  #log {
    position: fixed; bottom: 8px; left: 8px; right: 8px; max-height: 160px;
    overflow-y: auto; padding: 6px 8px; background: rgba(0,0,0,0.55);
    border: 1px solid #234; z-index: 10; pointer-events: none;
    font-size: 11px;
  }
  #log .e { color: #f88; }
  #log .w { color: #fa6; }
  #log .i { color: #8df; }
  #log .o { color: #cdd; }
</style>
</head>
<body>
<div id="hud">
  <div><b>BCS TSL spike</b></div>
  <div>FPS: <span id="fps">--</span> &nbsp; slots: <span id="slots">--</span> &nbsp; draws: <span id="draws">--</span></div>
  <div style="margin-top:6px">
    <button id="b-spin" class="on">Spin camera</button>
    <button id="b-lights" class="on">Orbit lights</button>
    <button id="b-bloom">PostProcessing + bloom</button>
    <button id="b-noise" class="on">FBM noise</button>
  </div>
  <div style="margin-top:6px; opacity:0.7">
    Pass criteria: sprites visible, lights tint nearby slots,
    FBM noise differs per-slot (via iSeed), bloom mode does not crash.
  </div>
</div>
<div id="log"></div>

<script type="importmap">
{
  "imports": {
    "three":               "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js",
    "three/webgpu":        "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js",
    "three/tsl":           "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.tsl.js",
    "three/addons/":       "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const logEl = document.getElementById('log');
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = cls || 'o';
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  // also to console
  if (cls === 'e') console.error(msg);
  else if (cls === 'w') console.warn(msg);
  else console.log(msg);
}
window.addEventListener('error', (e) => {
  log(`[window.error] ${e.message} @ ${e.filename}:${e.lineno}`, 'e');
});
window.addEventListener('unhandledrejection', (e) => {
  log(`[unhandledrejection] ${e.reason && e.reason.message || e.reason}`, 'e');
});

// ============================================================
// (1) WebGPU init
// ============================================================
log('init: importing three.webgpu r172', 'i');
log(`THREE keys: ${Object.keys(THREE).length} ; has WebGPURenderer: ${typeof THREE.WebGPURenderer}`, 'i');

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050608, 1);
document.body.appendChild(renderer.domElement);

try {
  await renderer.init();
  log('renderer.init() ok', 'i');
} catch (e) {
  log(`renderer.init() FAILED: ${e && e.message}`, 'e');
  throw e;
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 5000);
camera.position.set(0, 60, 320);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// Tiny scene reference cube so we know SOMETHING is rendering even if BCS fails.
const refCube = new THREE.Mesh(
  new THREE.BoxGeometry(8, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0x336688, wireframe: true }),
);
scene.add(refCube);

// ============================================================
// (2) TSL imports
// ============================================================
log('importing three/tsl', 'i');
let tsl;
try {
  tsl = await import('three/tsl');
  log(`tsl ok ; ${Object.keys(tsl).length} exports`, 'i');
} catch (e) {
  log(`tsl import FAILED: ${e && e.message}`, 'e');
  throw e;
}

const {
  Fn, attribute, uniform, uniformArray,
  vec2, vec3, vec4, float, mat3,
  positionLocal, positionWorld, normalLocal,
  cameraPosition, cameraViewMatrix, modelViewMatrix,
  uv, time,
  abs, fract, floor, sin, cos, min, max, mix, smoothstep, length, dot,
  step, clamp, exp, pow, normalize, cross, sub, add, mul, div,
  mx_noise_float,
} = tsl;

log(`tsl destructure ok : attribute=${typeof attribute}, uniformArray=${typeof uniformArray}, mx_noise_float=${typeof mx_noise_float}`, 'i');

// ============================================================
// (3) BCS InstancedBufferGeometry
// ============================================================
const MAX_SLOTS = 100;

const positions = new Float32Array(MAX_SLOTS * 3);
const scales    = new Float32Array(MAX_SLOTS);
const colors    = new Float32Array(MAX_SLOTS * 3);
const alphas    = new Float32Array(MAX_SLOTS);
const seeds     = new Float32Array(MAX_SLOTS);

// Fill slots : random positions in a 200-radius sphere ; varied scale,
// color, alpha, seed.
const PALETTE = [
  [0.40, 0.55, 0.85],   // blue
  [0.65, 0.35, 0.80],   // violet
  [0.85, 0.40, 0.55],   // magenta
  [0.30, 0.80, 0.65],   // teal
  [0.90, 0.75, 0.40],   // gold
  [0.45, 0.85, 0.55],   // mint
];
for (let i = 0; i < MAX_SLOTS; i++) {
  // Random unit vector × random radius (uniform in volume).
  const u = Math.random(), v = Math.random();
  const phi = Math.acos(2 * v - 1);
  const theta = u * Math.PI * 2;
  const r = 60 + Math.cbrt(Math.random()) * 160;
  positions[i*3+0] = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  scales[i] = 14 + Math.random() * 18;
  const c = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  colors[i*3+0] = c[0] * (0.7 + Math.random() * 0.4);
  colors[i*3+1] = c[1] * (0.7 + Math.random() * 0.4);
  colors[i*3+2] = c[2] * (0.7 + Math.random() * 0.4);
  alphas[i] = 0.45 + Math.random() * 0.40;
  seeds[i]  = Math.random();
}

const baseGeo = new THREE.PlaneGeometry(1, 1);
const geo = new THREE.InstancedBufferGeometry();
geo.index = baseGeo.index;
geo.setAttribute('position', baseGeo.attributes.position);
geo.setAttribute('uv', baseGeo.attributes.uv);
geo.instanceCount = MAX_SLOTS;
geo.setAttribute('iPosition', new THREE.InstancedBufferAttribute(positions, 3));
geo.setAttribute('iScale',    new THREE.InstancedBufferAttribute(scales,    1));
geo.setAttribute('iColor',    new THREE.InstancedBufferAttribute(colors,    3));
geo.setAttribute('iAlpha',    new THREE.InstancedBufferAttribute(alphas,    1));
geo.setAttribute('iSeed',     new THREE.InstancedBufferAttribute(seeds,     1));
log(`InstancedBufferGeometry built : ${MAX_SLOTS} instances`, 'i');

// ============================================================
// (4) TSL NodeMaterial : camera-facing billboard + FBM noise + radial alpha
// ============================================================
const iPosition = attribute('iPosition');
const iScale    = attribute('iScale');
const iColor    = attribute('iColor');
const iAlpha    = attribute('iAlpha');
const iSeed     = attribute('iSeed');

// Light array : 2 lights, each (vec3 pos, vec3 color, float strength).
// Using individual uniforms keeps the TSL path simple ; v17o uses arrays
// but we're proving the concept with 2 lights, easy to extend.
const uLight0Pos    = uniform(new THREE.Vector3(0, 0, 0));
const uLight0Color  = uniform(new THREE.Color(0xff8855));
const uLight0Str    = uniform(0.0);
const uLight1Pos    = uniform(new THREE.Vector3(0, 0, 0));
const uLight1Color  = uniform(new THREE.Color(0x88aaff));
const uLight1Str    = uniform(0.0);

const uNoiseEnabled = uniform(1.0);

// Position node : compute camera-facing billboard world position.
// position.xy is the quad vertex in [-0.5, 0.5] (PlaneGeometry(1,1)).
// We project it onto the camera-aligned right/up basis derived from
// the slot-to-camera direction (cross with world-up).
const positionNode = Fn(() => {
  const slotWorld = iPosition;
  const toCam = cameraPosition.sub(slotWorld).normalize();
  const worldUp = vec3(0.0, 1.0, 0.0);
  // Guard the degenerate case (looking straight up/down) by adding a tiny
  // bias. When |toCam.y| ≈ 1, cross(worldUp, toCam) collapses.
  const camBias = toCam.add(vec3(0.0, 0.0, 0.0001));
  const right = worldUp.cross(camBias).normalize();
  const up    = camBias.cross(right).normalize();
  const local = positionLocal.xy; // [-0.5, 0.5]
  const offset = right.mul(local.x).add(up.mul(local.y)).mul(iScale);
  return slotWorld.add(offset);
})();

// Color node : per-slot color modulated by 2-octave FBM noise (centered on
// the sprite UV, offset by iSeed so adjacent sprites read differently).
// Plus light contribution from the 2 dynamic lights.
const colorNode = Fn(() => {
  const centered = uv().sub(vec2(0.5, 0.5));
  // Noise sampled in a small 2D field per sprite ; offset by seed.
  const noiseP = vec3(
    centered.x.mul(4.0).add(iSeed.mul(31.7)),
    centered.y.mul(4.0).add(iSeed.mul(53.3)),
    iSeed.mul(13.1),
  );
  const n1 = mx_noise_float(noiseP).mul(0.5).add(0.5);
  const n2 = mx_noise_float(noiseP.mul(2.3)).mul(0.5).add(0.5);
  const fbm = n1.mul(0.65).add(n2.mul(0.35));
  // Mix FBM contribution by uNoiseEnabled so we can A/B without recompiling.
  const noiseMul = mix(float(1.0), fbm.mul(1.4), uNoiseEnabled);
  // Light pickup : each light contributes color × strength × inverseDist.
  // We sample at the slot center (iPosition) so all fragments of one sprite
  // share the same lighting — matches v17o's per-sprite uLightStrength
  // attenuation.
  const d0 = length(uLight0Pos.sub(iPosition));
  const d1 = length(uLight1Pos.sub(iPosition));
  const atten0 = float(1.0).div(d0.mul(0.012).add(1.0)).mul(uLight0Str);
  const atten1 = float(1.0).div(d1.mul(0.012).add(1.0)).mul(uLight1Str);
  const lightAdd = uLight0Color.mul(atten0).add(uLight1Color.mul(atten1));
  return iColor.mul(noiseMul).add(lightAdd);
})();

// Opacity node : soft radial circle from sprite center, multiplied by
// iAlpha and gated by FBM so noise-low regions go transparent (creates
// the wispy edges instead of hard discs).
const opacityNode = Fn(() => {
  const centered = uv().sub(vec2(0.5, 0.5));
  const r = length(centered);
  const soft = smoothstep(float(0.5), float(0.05), r);
  // Re-use the noise so the edge dissolves into wispy fractal fingers.
  const noiseP = vec3(
    centered.x.mul(4.0).add(iSeed.mul(31.7)),
    centered.y.mul(4.0).add(iSeed.mul(53.3)),
    iSeed.mul(13.1),
  );
  const n = mx_noise_float(noiseP).mul(0.5).add(0.5);
  const noiseBias = mix(float(1.0), n.mul(1.6), uNoiseEnabled);
  return soft.mul(iAlpha).mul(noiseBias);
})();

let mat;
try {
  mat = new THREE.NodeMaterial();
  mat.transparent = true;
  mat.blending = THREE.AdditiveBlending;
  mat.depthWrite = false;
  mat.depthTest = true;
  mat.side = THREE.DoubleSide;
  mat.positionNode = positionNode;
  mat.colorNode = colorNode;
  mat.opacityNode = opacityNode;
  log('NodeMaterial constructed ok', 'i');
} catch (e) {
  log(`NodeMaterial construct FAILED: ${e && e.message}`, 'e');
  throw e;
}

const bcsMesh = new THREE.Mesh(geo, mat);
bcsMesh.frustumCulled = false;
scene.add(bcsMesh);
log('BCS mesh added to scene', 'i');

// ============================================================
// (5) Two orbiting "lights" : just spheres + uniform writes
// ============================================================
const light0 = new THREE.Mesh(
  new THREE.SphereGeometry(4, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xff8855 }),
);
const light1 = new THREE.Mesh(
  new THREE.SphereGeometry(4, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0x88aaff }),
);
scene.add(light0);
scene.add(light1);

// ============================================================
// (6) PostProcessing + bloom (lazy-loaded ; can be toggled at runtime)
// ============================================================
let postProcessing = null;
let bloomEnabled = false;
let bloomMod = null;
async function ensureBloom() {
  if (postProcessing) return;
  try {
    bloomMod = await import('three/addons/tsl/display/BloomNode.js');
    const PostProcessing = THREE.PostProcessing;
    if (!PostProcessing) {
      log('THREE.PostProcessing not available ; cannot enable bloom', 'e');
      return;
    }
    postProcessing = new PostProcessing(renderer);
    const { pass } = tsl;
    const scenePass = pass(scene, camera);
    const bloomPass = bloomMod.bloom(scenePass.getTextureNode('output'), 0.6, 0.55, 0.50);
    postProcessing.outputNode = scenePass.add(bloomPass);
    log('PostProcessing + bloom wired ok', 'i');
  } catch (e) {
    log(`bloom setup FAILED: ${e && e.message}`, 'e');
    postProcessing = null;
  }
}

// ============================================================
// (7) Hud + animation
// ============================================================
let spinCam = true, orbitLights = true, noiseOn = true;
const bSpin   = document.getElementById('b-spin');
const bLights = document.getElementById('b-lights');
const bBloom  = document.getElementById('b-bloom');
const bNoise  = document.getElementById('b-noise');
bSpin.onclick   = () => { spinCam = !spinCam; bSpin.classList.toggle('on', spinCam); };
bLights.onclick = () => { orbitLights = !orbitLights; bLights.classList.toggle('on', orbitLights); };
bNoise.onclick  = () => { noiseOn = !noiseOn; bNoise.classList.toggle('on', noiseOn); uNoiseEnabled.value = noiseOn ? 1.0 : 0.0; };
bBloom.onclick  = async () => {
  bloomEnabled = !bloomEnabled;
  bBloom.classList.toggle('on', bloomEnabled);
  if (bloomEnabled) await ensureBloom();
};

const fpsEl = document.getElementById('fps');
const slotsEl = document.getElementById('slots');
const drawsEl = document.getElementById('draws');
slotsEl.textContent = MAX_SLOTS;

let frame = 0;
let lastFpsT = performance.now();
let fpsAcc = 0;
let camAngle = 0;
let lightAngle = 0;

let renderFailLogged = false;
async function loop(now) {
  frame++;
  const dt = 1/60;
  // Spin camera around origin.
  if (spinCam) {
    camAngle += dt * 0.3;
    const camR = 320;
    camera.position.set(Math.cos(camAngle) * camR, 60 + Math.sin(camAngle * 0.5) * 40, Math.sin(camAngle) * camR);
    camera.lookAt(0, 0, 0);
  }
  // Orbit the two lights.
  if (orbitLights) {
    lightAngle += dt * 1.2;
    const r0 = 110, r1 = 160;
    light0.position.set(Math.cos(lightAngle) * r0, 20, Math.sin(lightAngle) * r0);
    light1.position.set(Math.cos(-lightAngle * 0.7) * r1, -10, Math.sin(-lightAngle * 0.7) * r1);
    uLight0Pos.value.copy(light0.position);
    uLight1Pos.value.copy(light1.position);
    uLight0Str.value = 1.0;
    uLight1Str.value = 1.0;
  } else {
    uLight0Str.value = 0.0;
    uLight1Str.value = 0.0;
  }
  // Spin the reference cube so we know the render loop is alive.
  refCube.rotation.x += dt * 0.6;
  refCube.rotation.y += dt * 0.8;

  try {
    if (bloomEnabled && postProcessing) {
      await postProcessing.renderAsync();
    } else {
      await renderer.renderAsync(scene, camera);
    }
  } catch (e) {
    if (!renderFailLogged) {
      renderFailLogged = true;
      log(`render FAILED: ${e && e.message}`, 'e');
      log(`stack: ${e && e.stack && e.stack.split('\n').slice(0, 3).join(' | ')}`, 'e');
    }
  }

  // FPS / draw count readout.
  fpsAcc++;
  if (now - lastFpsT > 500) {
    const fps = (fpsAcc * 1000 / (now - lastFpsT)).toFixed(0);
    fpsEl.textContent = fps;
    if (renderer.info && renderer.info.render) {
      drawsEl.textContent = renderer.info.render.calls || '--';
    }
    lastFpsT = now;
    fpsAcc = 0;
  }
}

renderer.setAnimationLoop(loop);
log('render loop started', 'i');
</script>
</body>
</html>
