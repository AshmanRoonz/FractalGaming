<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Last Ship Sailing - Checkout</title>
<!--
  (v49.57) PayPal's return_url / cancel_url for the livery shop (see the Worker's
  handlePaypalCreate and PREMIUM LIVERIES in index-working.html).
  It decides nothing and holds no secret: it only tells the game which order came back
  (?token=<PayPal order id>) and whether it was cancelled. The game then asks the Worker
  to capture it, and the Worker asks PayPal - so a forged visit here achieves nothing.
  Announced three ways, because a popup's window.opener does NOT survive a trip through
  PayPal's cross-origin pages:
    - BroadcastChannel('lss_shop')      the game tab, if it is open and listening
    - localStorage 'lss_paypal_return'  its storage event, and a game tab that boots later
    - window.opener.postMessage         when the opener did survive
  In the full-page REDIRECT flow (popup blocked / phone) it bounces back into the game with
  ?paypal_order=, where _lssPaypalResume finishes the capture on boot.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #05070d; color: #cfe3ff; font: 15px/1.5 'Rajdhani', system-ui, sans-serif; text-align: center; }
  .card { max-width: 360px; border: 1px solid rgba(255,196,57,0.5); border-radius: 10px; padding: 22px 26px;
          background: rgba(10,14,26,0.92); }
  h1 { font: 700 15px 'Orbitron', system-ui, sans-serif; letter-spacing: 3px; color: #ffc439; margin: 0 0 10px; }
  a { color: #8fd0ff; }
</style>
</head>
<body>
<div class="card">
  <h1 id="h">LAST SHIP SAILING</h1>
  <div id="m">Returning to the hangar&hellip;</div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var order = q.get('token') || '';
  var cancel = q.get('cancel') === '1';
  var msg = { type: 'lss_paypal_return', order_id: order, cancel: cancel, at: Date.now() };
  if (order) {
    try { localStorage.setItem('lss_paypal_return', JSON.stringify(msg)); } catch (e) {}
    try { new BroadcastChannel('lss_shop').postMessage(msg); } catch (e) {}
    try { if (window.opener && !window.opener.closed) window.opener.postMessage(msg, location.origin); } catch (e) {}
  }
  var mode = '';
  try { mode = localStorage.getItem('lss_paypal_mode') || ''; } catch (e) {}
  if (mode === 'redirect' || !order) {
    try { localStorage.removeItem('lss_paypal_mode'); } catch (e) {}
    location.replace('./' + (order ? ('?paypal_order=' + encodeURIComponent(order) + (cancel ? '&paypal_cancel=1' : '')) : ''));
    return;
  }
  document.getElementById('h').textContent = cancel ? 'CHECKOUT CANCELLED' : 'PAYMENT SENT';
  document.getElementById('m').innerHTML = cancel
    ? 'Nothing was charged. You can close this window.'
    : 'Your livery unlocks in the game as soon as PayPal confirms.<br>You can close this window.';
  setTimeout(function () { try { window.close(); } catch (e) {} }, 900);
})();
</script>
</body>
</html>
