<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Ship Sailing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Discord Activities iframe enforces a strict CSP. Inline <style> is
     allowed (style-src includes unsafe-inline) ; inline <script> + onclick
     are NOT. Hence: styles inline here, behavior in activity.js. No
     external CDN fonts loaded ; system font stack instead. */
  :root {
    --bg: #050510;
    --bg-elev: #0d0d1c;
    --text: #d8d8e0;
    --text-dim: #888899;
    --accent: #ffaa00;
    --accent-dim: rgba(255,170,0,0.35);
    --discord: #5865F2;
    --rule: rgba(80,80,120,0.3);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    background: radial-gradient(ellipse at center,
      rgba(255,170,0,0.06), transparent 60%),
      var(--bg);
  }
  .logo {
    max-width: 320px;
    width: 80%;
    height: auto;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 32px rgba(255,170,0,0.35));
  }
  h1 {
    font-weight: 900;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 5px;
    margin: 0 0 6px;
    text-transform: uppercase;
    text-shadow: 0 0 24px var(--accent-dim);
  }
  .tagline {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 36px;
  }
  .engage {
    background: var(--accent);
    color: #050510;
    border: none;
    padding: 18px 56px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: transform 120ms, box-shadow 120ms, background 120ms;
    box-shadow: 0 0 24px rgba(255,170,0,0.4);
  }
  .engage:hover {
    background: #ffc640;
    transform: translateY(-1px);
    box-shadow: 0 4px 32px rgba(255,170,0,0.55);
  }
  .engage:active { transform: translateY(0); }
  .engage:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .note {
    margin-top: 28px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
    max-width: 360px;
    line-height: 1.55;
  }
  .status {
    margin-top: 20px;
    min-height: 18px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .status.ok    { color: #66cc66; }
  .status.warn  { color: #ffaa00; }
  .status.error { color: #ff6644; }
  .footer {
    margin-top: auto;
    padding-top: 36px;
    color: #444;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .footer a {
    color: #555;
    text-decoration: none;
    margin: 0 6px;
    border-bottom: 1px dotted rgba(80,80,120,0.4);
  }
  .footer a:hover { color: #888; border-bottom-color: rgba(150,150,180,0.6); }
</style>
</head>
<body>
<div class="stage">
  <img class="logo" src="LSS.png" alt="Last Ship Sailing">
  <h1>Last Ship Sailing</h1>
  <p class="tagline">Zero-Gravity Ship Combat</p>

  <button class="engage" id="engage-btn" type="button">ENGAGE</button>

  <p class="note">Opens the full game in a new browser window with VR support, full-screen, and all the controls. Your Discord identity carries over.</p>

  <p class="status" id="status"></p>

  <div class="footer">
    <a href="https://lss.fractalreality.ca" target="_blank" rel="noopener">lss.fractalreality.ca</a>
    <a href="https://lss.fractalreality.ca/terms.html" target="_blank" rel="noopener">terms</a>
    <a href="https://lss.fractalreality.ca/privacy.html" target="_blank" rel="noopener">privacy</a>
  </div>
</div>
<!-- ?v= cache-buster: bump when activity.js changes. GH Pages serves
     max-age=600 and Discord's client/proxy cache aggressively; a stale
     stub cost us a debugging round on 2026-07-21. -->
<script type="module" src="activity.js?v=251"></script>
</body>
</html>
