<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Ship Sailing ; Live Rooms</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050510;
    --bg-elev: #0d0d1c;
    --bg-card: #0e0e1d;
    --bg-card-hover: #15152a;
    --text: #d8d8e0;
    --text-dim: #888899;
    --text-faint: #555566;
    --accent: #ffaa00;
    --accent-dim: rgba(255,170,0,0.35);
    --discord: #5865F2;
    --rule: rgba(80,80,120,0.3);
    --good: #66cc66;
    --bad:  #ff6644;
    --you: #ffaa00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  header.page {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(to bottom, rgba(255,170,0,0.04), transparent);
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  header.page .logo-link {
    display: flex; align-items: center; gap: 14px;
    color: inherit; text-decoration: none;
  }
  header.page .logo-link img {
    width: 56px; height: 56px;
    filter: drop-shadow(0 0 14px var(--accent-dim));
  }
  header.page h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 18px var(--accent-dim);
  }
  header.page .tagline {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  header.page .nav {
    margin-left: auto;
    display: flex; gap: 18px; align-items: center;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  }
  header.page .nav a {
    color: var(--text-dim); text-decoration: none;
    border-bottom: 1px dotted transparent;
    transition: color 120ms;
  }
  header.page .nav a:hover { color: var(--accent); border-bottom-color: var(--accent-dim); }
  header.page .nav a.cta {
    background: var(--accent); color: #050510;
    padding: 8px 18px; font-weight: 700; border-radius: 2px;
    border: none;
  }
  header.page .nav a.cta:hover { background: #ffc640; color: #050510; border-bottom: 0; }

  .controls {
    padding: 18px 32px;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
  }
  .room-count {
    color: var(--text-dim); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .room-count strong { color: var(--accent); font-weight: 700; }
  .controls .spacer { flex: 1; }
  .controls .refresh-info { color: var(--text-faint); font-size: 10px; letter-spacing: 1.5px; }

  main {
    padding: 24px 32px 64px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .status-line {
    padding: 24px 0;
    color: var(--text-dim); font-size: 12px; letter-spacing: 1px;
    text-align: center;
  }
  .status-line.error { color: var(--bad); }
  .status-line button {
    background: var(--accent); color: #050510;
    border: none; padding: 8px 18px; margin-left: 12px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700; cursor: pointer;
    border-radius: 2px;
  }
  .status-line button:hover { background: #ffc640; }

  .rooms {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .room-card {
    background: var(--bg-card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    transition: background 120ms, border-color 120ms, transform 120ms;
  }
  .room-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-dim);
    transform: translateY(-2px);
  }
  .room-card .top-row {
    display: flex; align-items: center; gap: 12px;
  }
  .room-card .code {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .room-card .player-count {
    background: rgba(102,204,102,0.12);
    color: var(--good);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px; letter-spacing: 1.5px;
    font-weight: 700;
    border: 1px solid rgba(102,204,102,0.3);
  }
  .room-card .player-count.full {
    background: rgba(255,102,68,0.12);
    color: var(--bad);
    border-color: rgba(255,102,68,0.3);
  }
  .room-card .host {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-dim); font-size: 12px;
  }
  .room-card .host img {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--rule);
  }
  .room-card .host .label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-faint); display: block;
  }
  .room-card .host .name { color: var(--text); font-weight: 500; }
  .room-card .meta {
    display: flex; gap: 14px; flex-wrap: wrap;
    color: var(--text-dim); font-size: 11px;
  }
  .room-card .meta-item {
    display: flex; flex-direction: column; gap: 2px;
  }
  .room-card .meta-item .lbl {
    font-size: 9px; letter-spacing: 2px; color: var(--text-faint);
    text-transform: uppercase;
  }
  .room-card .meta-item .val { color: var(--text); }
  .room-card .actions {
    margin-top: 6px; display: flex; gap: 8px;
  }
  .room-card .join-btn {
    flex: 1;
    background: var(--accent); color: #050510;
    border: none; padding: 12px; cursor: pointer;
    font-family: inherit; font-size: 12px; letter-spacing: 3px;
    font-weight: 700; text-transform: uppercase;
    border-radius: 2px;
    transition: background 120ms;
    text-decoration: none; text-align: center;
  }
  .room-card .join-btn:hover { background: #ffc640; }
  .room-card .copy-btn {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--rule); padding: 12px 14px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    cursor: pointer; border-radius: 2px;
    transition: color 120ms, border-color 120ms;
  }
  .room-card .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .room-card .copy-btn.copied { color: var(--good); border-color: var(--good); }
  .room-card .last-seen {
    font-size: 10px; color: var(--text-faint); letter-spacing: 1.2px;
  }

  .empty-state {
    text-align: center; padding: 80px 20px;
    color: var(--text-dim); grid-column: 1 / -1;
  }
  .empty-state h2 {
    font-family: 'Orbitron', sans-serif;
    color: var(--text);
    letter-spacing: 4px;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .empty-state p { max-width: 480px; margin: 0 auto 22px; line-height: 1.6; }
  .empty-state a {
    display: inline-block; margin-top: 8px;
    background: var(--accent); color: #050510;
    padding: 12px 28px; text-decoration: none;
    font-family: inherit; font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    border-radius: 2px;
  }
  .empty-state a:hover { background: #ffc640; }

  footer.page {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-faint); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
    border-top: 1px solid var(--rule);
    margin-top: 40px;
  }
  footer.page a { color: var(--text-dim); text-decoration: none; margin: 0 8px; }
  footer.page a:hover { color: var(--accent); }
</style>
</head>
<body>

<header class="page">
  <a href="index.html" class="logo-link">
    <img src="LSS.png" alt="LSS">
    <div>
      <h1>Live Rooms</h1>
      <div class="tagline">Last Ship Sailing</div>
    </div>
  </a>
  <div class="nav">
    <a href="index.html" class="cta">PLAY</a>
    <a href="leaderboard.html">leaderboard</a>
    <a href="terms.html">terms</a>
    <a href="privacy.html">privacy</a>
  </div>
</header>

<div class="controls">
  <div class="room-count" id="room-count">; ; ;</div>
  <div class="spacer"></div>
  <div class="refresh-info" id="refresh-info">; ; ;</div>
</div>

<main>
  <div id="status" class="status-line">Loading rooms...</div>
  <div id="rooms" class="rooms" style="display:none;"></div>
</main>

<footer class="page">
  <a href="https://fractalreality.ca">fractalreality.ca</a>
  <a href="https://github.com/ashmanroonz">github</a>
  ; rooms heartbeat via Cloudflare KV ;
</footer>

<script>
  const API_BASE = 'https://lss-backend.ashroney.workers.dev';
  const REFRESH_MS = 10000; // rooms refresh faster than leaderboard

  let lastFetchAt = 0;

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function setStatus(text, isError) {
    const el = document.getElementById('status');
    el.textContent = text || '';
    el.className = 'status-line' + (isError ? ' error' : '');
    el.style.display = text ? '' : 'none';
  }

  function setRetryButton() {
    const el = document.getElementById('status');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Retry';
    btn.addEventListener('click', () => loadRooms());
    el.appendChild(btn);
  }

  function fmtAge(ms) {
    const sec = Math.max(0, Math.floor(ms / 1000));
    if (sec < 5)        return 'live';
    if (sec < 60)       return sec + 's ago';
    if (sec < 3600)     return Math.floor(sec / 60) + 'm ago';
    return Math.floor(sec / 3600) + 'h ago';
  }

  function renderRoom(r) {
    const card = document.createElement('div');
    card.className = 'room-card';
    const playerCount = Number(r.player_count || 1);
    // Treat 6+ as a soft "full" indicator. The game's MAX_PLAYERS is 12
    // but most matches are 2v2 / 3v3.
    const isFull = playerCount >= 6;
    const codeSafe = encodeURIComponent(r.code || '');
    card.innerHTML = `
      <div class="top-row">
        <div class="code" title="${escapeHtml(r.code)}">${escapeHtml(r.code)}</div>
        <div class="player-count ${isFull ? 'full' : ''}">${playerCount} ${playerCount === 1 ? 'PLAYER' : 'PLAYERS'}</div>
      </div>
      <div class="host">
        ${r.host_avatar ? `<img src="${escapeHtml(r.host_avatar)}" alt="">` : ''}
        <div>
          <span class="label">HOST</span>
          <span class="name">${escapeHtml(r.host_name || 'Player')}</span>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item">
          <span class="lbl">MAP</span>
          <span class="val">${escapeHtml(r.map_key || '-')}</span>
        </div>
        ${r.version ? `<div class="meta-item"><span class="lbl">VERSION</span><span class="val">${escapeHtml(r.version)}</span></div>` : ''}
        <div class="meta-item">
          <span class="lbl">SEEN</span>
          <span class="val last-seen">${fmtAge(Date.now() - (r.last_seen || 0))}</span>
        </div>
      </div>
      <div class="actions">
        <a class="join-btn" href="index.html?room=${codeSafe}">JOIN</a>
        <button class="copy-btn" type="button" data-code="${escapeHtml(r.code)}" title="Copy room code">COPY</button>
      </div>
    `;
    return card;
  }

  function renderRooms(rooms) {
    const container = document.getElementById('rooms');
    container.innerHTML = '';
    rooms.forEach(r => container.appendChild(renderRoom(r)));
    container.style.display = '';

    // Wire copy buttons
    container.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const code = btn.dataset.code;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = 'COPIED';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1500);
        } catch (err) {
          btn.textContent = 'OOPS';
          setTimeout(() => { btn.textContent = 'COPY'; }, 1500);
        }
      });
    });
  }

  async function loadRooms() {
    setStatus('Loading...');
    document.getElementById('rooms').style.display = 'none';
    try {
      const res = await fetch(API_BASE + '/rooms');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const rooms = data.rooms || [];
      lastFetchAt = Date.now();
      updateRefreshInfo();
      const countEl = document.getElementById('room-count');
      if (rooms.length === 0) {
        countEl.innerHTML = '<strong>0</strong> ROOMS LIVE';
        document.getElementById('rooms').style.display = 'none';
        document.getElementById('status').innerHTML = `
          <div class="empty-state">
            <h2>No live rooms</h2>
            <p>No multiplayer matches are running right now. Start the game and create a room ; it'll show up here within seconds for friends to join.</p>
            <a href="index.html">Open Game</a>
          </div>
        `;
        document.getElementById('status').className = 'status-line';
        return;
      }
      countEl.innerHTML = '<strong>' + rooms.length + '</strong> ' + (rooms.length === 1 ? 'ROOM' : 'ROOMS') + ' LIVE';
      setStatus('');
      renderRooms(rooms);
    } catch (err) {
      console.error('[rooms] fetch failed:', err);
      setStatus('Failed to load rooms: ' + (err && err.message || err), true);
      setRetryButton();
    }
  }

  function updateRefreshInfo() {
    if (!lastFetchAt) return;
    const ageSec = Math.floor((Date.now() - lastFetchAt) / 1000);
    const el = document.getElementById('refresh-info');
    if (ageSec < 5)        el.textContent = 'just now';
    else if (ageSec < 60)  el.textContent = ageSec + 's ago';
    else                   el.textContent = Math.floor(ageSec / 60) + 'm ' + (ageSec % 60) + 's ago';
  }

  setInterval(updateRefreshInfo, 1000);
  setInterval(() => {
    if (document.visibilityState === 'visible') loadRooms();
  }, REFRESH_MS);

  loadRooms();
</script>

</body>
</html>
