<meta charset="utf-8">
<title>LSS — Touch Control Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0f14; --panel:#121922; --panel2:#0e141c; --line:#22303f;
  --ink:#dff2ff; --dim:#7d93a7; --accent:#4fd1ff; --warn:#ffb020; --bad:#ff5d5d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:13px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{display:flex;height:100%}
#stagewrap{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#topbar h1{font:700 13px/1 "Segoe UI";margin:0 10px 0 0;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent)}
label.f{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.08em}
select,input[type=text],input[type=number]{background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:12px/1 inherit}
input[type=number]{width:68px}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:5px 10px;font:600 11px/1 inherit;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#04222e;border-color:var(--accent)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;
  padding:22px;overflow:hidden;background:
    repeating-linear-gradient(45deg,#0c1117 0 12px,#0a0e13 12px 24px)}
#device{position:relative;border-radius:16px;overflow:hidden;
  box-shadow:0 0 0 8px #05080b,0 0 0 9px #1d2733,0 18px 60px rgba(0,0,0,.7);
  touch-action:none;user-select:none}
#scene{position:absolute;inset:0}
#tc{position:absolute;inset:0}
.part{position:absolute;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(80,200,255,.07);
  border:1px solid rgba(120,220,255,.30);color:rgba(190,235,255,.75);
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;cursor:grab;
  overflow:hidden;text-align:center}
.part.sel{border-color:var(--warn);background:rgba(255,176,32,.12);
  box-shadow:0 0 0 1px var(--warn),0 0 18px rgba(255,176,32,.35);z-index:5}
.part.zone{background:rgba(255,93,93,.07);border:1px dashed rgba(255,93,93,.5)}
.part.hidden{opacity:.22}
.part .kick{opacity:.55;letter-spacing:.18em}
.part .nm{line-height:1.12;padding:0 2%}
.knob{position:absolute;left:50%;top:50%;width:38%;height:38%;margin:-19% 0 0 -19%;
  border-radius:50%;background:rgba(120,220,255,.18);
  border:1px solid rgba(170,240,255,.55);pointer-events:none}
.h{position:absolute;width:11px;height:11px;background:var(--warn);
  border:1px solid #201400;border-radius:2px;z-index:6}
.h.nw{cursor:nwse-resize}.h.ne{cursor:nesw-resize}
.h.sw{cursor:nesw-resize}.h.se{cursor:nwse-resize}
#reach,#hudring{position:absolute;inset:0;pointer-events:none}
#side{width:296px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#side h2{font:700 11px/1 inherit;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0;padding:10px 12px 6px}
#list{overflow:auto;max-height:34%;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;
  border-left:2px solid transparent}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--panel2);border-left-color:var(--warn);color:var(--warn)}
.row .id{flex:1;font:600 11px/1 ui-monospace,monospace;letter-spacing:.04em}
.row .tag{font-size:10px;color:var(--dim)}
#props{padding:8px 12px 14px;overflow:auto;flex:1}
.g{display:grid;grid-template-columns:58px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.g > span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.g input,.g select{width:100%}
.full{grid-column:1/4}
.two{grid-column:2/4}
#hint{padding:8px 12px;color:var(--dim);font-size:11px;border-top:1px solid var(--line)}
#hint b{color:var(--ink)}
#out{position:fixed;inset:6% 12%;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;display:none;flex-direction:column;z-index:50;box-shadow:0 20px 80px #000}
#out.on{display:flex}
#out textarea{flex:1;background:#080c11;color:var(--ink);border:0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:12px;font:12px/1.5 ui-monospace,monospace;resize:none}
#outbar{display:flex;gap:8px;align-items:center;padding:8px 12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);
  color:#04222e;font:700 12px/1 inherit;padding:9px 16px;border-radius:20px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
</style>

<div id="wrap">
  <div id="stagewrap">
    <div id="topbar">
      <h1>Touch Studio</h1>
      <label class="f">Preset
        <select id="preset">
          <option value="shipped">Shipped (v35.47)</option>
          <option value="mirror">Left-handed mirror</option>
          <option value="compact">Compact / small phone</option>
          <option value="thumbs">Thumb-reach optimised</option>
        </select>
      </label>
      <label class="f">Device
        <select id="aspect">
          <option value="2.167">19.5:9 — iPhone</option>
          <option value="2.222">20:9 — Android tall</option>
          <option value="2.0">18:9</option>
          <option value="1.778" selected>16:9</option>
          <option value="1.6">16:10</option>
          <option value="1.333">4:3 — iPad</option>
        </select>
      </label>
      <button id="bReach">Thumb reach</button>
      <button id="bHud">HUD keep-clear</button>
      <button id="bZones" class="on">Capture zones</button>
      <button id="bTest">Test press</button>
      <span style="flex:1"></span>
      <button id="bImport">Import</button>
      <button id="bJson">Export JSON</button>
      <button id="bCss">Export CSS</button>
    </div>
    <div id="stage"><div id="device">
      <div id="scene"></div>
      <canvas id="reach"></canvas>
      <canvas id="hudring"></canvas>
      <div id="tc"></div>
    </div></div>
  </div>

  <div id="side">
    <h2>Controls</h2>
    <div id="list"></div>
    <h2>Properties</h2>
    <div id="props"></div>
    <div id="hint">
      <b>Drag</b> to move · <b>handles</b> to resize · <b>double-click</b> to rename<br>
      <b>Arrows</b> nudge 0.5 · <b>Shift+Arrows</b> nudge 5 · <b>H</b> hide · <b>Ctrl+Z</b> undo
    </div>
  </div>
</div>

<div id="out">
  <div id="outbar">
    <b id="outTitle">Export</b><span style="flex:1"></span>
    <button id="outCopy">Copy</button>
    <button id="outApply" style="display:none">Apply</button>
    <button id="outClose">Close</button>
  </div>
  <textarea id="outText" spellcheck="false"></textarea>
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// LSS TOUCH CONTROL STUDIO
//
// Lays out the on-screen touch controls the game builds in the #touch-controls
// IIFE. Everything is in VMIN — 1 = 1% of min(viewportW, viewportH) — which is
// what the game's CSS already uses, and in landscape (the only orientation LSS
// runs in) vmin is the screen HEIGHT, so a "%" of height and a vmin are the
// same number. That is why `top:22%` on the zoom button round-trips to 22.
//
// Anchors mirror the CSS: a part sticks to left|center|right and top|bottom,
// and its offset is measured from that edge. Drag re-derives the offset against
// whichever anchor the part already has, so a right-anchored button stays glued
// to the right edge across every device aspect — which is the entire point.
// ═══════════════════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);

// ---- The shipped layout, read off index-working.html (the _el() calls) ------
// `.tc-rect` = 24x15, `.tc-chip` = 11x11 round, `.tc-top` = 7x7.
// The four top buttons use left:50% + translateX(-165%/-50%/65%/180%) of a
// 7vmin box; centre-offset = tx + w/2, giving the symmetric set below.
const SHIPPED = {
  'tc-move':      {ax:'left',  x:2.5,  ay:'bottom', y:3,    w:30, h:30, shape:'circle', kick:'', nm:'MOVE',    role:'stick'},
  'tc-look':      {ax:'right', x:24,   ay:'bottom', y:3,    w:30, h:30, shape:'circle', kick:'', nm:'LOOK',    role:'stick'},
  'tc-lt':        {ax:'left',  x:1,    ay:'top',    y:22,   w:24, h:15, shape:'rect',   kick:'LT', nm:'ZOOM'},
  'tc-rt':        {ax:'right', x:1,    ay:'top',    y:1.5,  w:24, h:15, shape:'rect',   kick:'RT', nm:'FIRE'},
  'tc-rb':        {ax:'right', x:1,    ay:'top',    y:18.5, w:24, h:15, shape:'rect',   kick:'RB', nm:'ABILITY 2'},
  'tc-lb':        {ax:'right', x:1,    ay:'top',    y:35.5, w:24, h:15, shape:'rect',   kick:'LB', nm:'ABILITY 1'},
  'tc-fd':        {ax:'right', x:1,    ay:'top',    y:52.5, w:24, h:15, shape:'rect',   kick:'F',  nm:'ABILITY 3'},
  'tc-rd':        {ax:'right', x:26.5, ay:'top',    y:1.5,  w:16, h:9,  shape:'rect',   kick:'R',  nm:'RELOAD'},
  'tc-core':      {ax:'center',x:0,    ay:'bottom', y:2,    w:24, h:9,  shape:'rect',   kick:'CORE', nm:'CORE'},
  'tc-up':        {ax:'left',  x:34,   ay:'bottom', y:15,   w:11, h:11, shape:'circle', kick:'▲', nm:''},
  'tc-dn':        {ax:'left',  x:34,   ay:'bottom', y:3,    w:11, h:11, shape:'circle', kick:'▼', nm:''},
  'tc-ship':      {ax:'center',x:-8.05,ay:'top',    y:1.5,  w:7,  h:7,  shape:'rect',   kick:'⇄', nm:''},
  'tc-set':       {ax:'center',x:0,    ay:'top',    y:1.5,  w:7,  h:7,  shape:'rect',   kick:'⚙', nm:''},
  'tc-view':      {ax:'center',x:8.05, ay:'top',    y:1.5,  w:7,  h:7,  shape:'rect',   kick:'△', nm:''},
  'tc-fs':        {ax:'center',x:16.1, ay:'top',    y:1.5,  w:7,  h:7,  shape:'rect',   kick:'⛶', nm:''},
  // Invisible capture regions. The genre standard: the stick answers to the
  // whole bottom-left region and aiming to the right half, so a thumb that
  // misses the drawn circle still works. Sized in % of the screen in the game;
  // in landscape that is vmin vertically and (vmin * aspect) horizontally, so
  // these carry a `pct` flag and are stored as percentages of each axis.
  'tc-move-zone': {ax:'left',  x:0, ay:'bottom', y:0,  w:42, h:60, shape:'rect', kick:'', nm:'MOVE ZONE', zone:true, pct:true},
  'tc-look-zone': {ax:'right', x:0, ay:'top',    y:12, w:50, h:88, shape:'rect', kick:'', nm:'LOOK ZONE', zone:true, pct:true},
};

const ORDER = Object.keys(SHIPPED);
let L = clone(SHIPPED);
let sel = 'tc-move';
let testMode = false;
const undoStack = [];

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }
function pushUndo(){ undoStack.push(clone(L)); if(undoStack.length>60) undoStack.shift(); }

// ---- Geometry --------------------------------------------------------------
// vmin is the SHORT side. LSS is landscape-locked, so that is always height.
function metrics(){
  const d=$('device');
  const W=d.clientWidth, H=d.clientHeight;
  return {W,H,vmin:Math.min(W,H)/100};
}
// Resolve a part to pixels. `pct` parts measure w/h against their own axis.
function rect(p){
  const {W,H,vmin}=metrics();
  const w = p.pct ? W*(p.w/100) : p.w*vmin;
  const h = p.pct ? H*(p.h/100) : p.h*vmin;
  const ox = p.pct ? W*(p.x/100) : p.x*vmin;
  const oy = p.pct ? H*(p.y/100) : p.y*vmin;
  let left;
  if (p.ax==='left')       left = ox;
  else if (p.ax==='right') left = W - ox - w;
  else                     left = W/2 + ox - w/2;      // centre-anchored
  const top = (p.ay==='top') ? oy : H - oy - h;
  return {left,top,w,h,W,H,vmin};
}
// Inverse of rect(): given a pixel box, write back the anchored offsets.
function setFromPx(p,left,top){
  const {W,H,vmin}=metrics();
  const r=rect(p);
  const ux = p.pct ? W/100 : vmin, uy = p.pct ? H/100 : vmin;
  if (p.ax==='left')        p.x = left/ux;
  else if (p.ax==='right')  p.x = (W - left - r.w)/ux;
  else                      p.x = (left + r.w/2 - W/2)/ux;
  p.y = (p.ay==='top') ? top/uy : (H - top - r.h)/uy;
  p.x = round(p.x); p.y = round(p.y);
}
const round = v => Math.round(v*10)/10;

// ---- Render ----------------------------------------------------------------
function sizeDevice(){
  const st=$('stage'), d=$('device');
  const ar=parseFloat($('aspect').value);
  const pad=44;
  let w=st.clientWidth-pad, h=w/ar;
  if(h>st.clientHeight-pad){ h=st.clientHeight-pad; w=h*ar; }
  d.style.width=Math.round(w)+'px'; d.style.height=Math.round(h)+'px';
  drawScene(); drawReach(); drawHud(); render();
}

function drawScene(){
  // A stand-in for the game view, only so contrast is judgeable: a bright sky
  // and a dark ground are the two backgrounds these controls have to survive.
  const s=$('scene');
  s.style.background =
    'linear-gradient(#7fb4d8 0%,#a9cfe6 38%,#2e4a33 38%,#1a2c1f 100%)';
}

function drawReach(){
  const c=$('reach'), {W,H}=metrics();
  c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  if(!$('bReach').classList.contains('on')) return;
  // Thumb arcs swept from where the hands actually hold a phone: roughly the
  // lower corners, inset a little. Comfortable ~ 42% of the diagonal.
  const R=Math.hypot(W,H)*0.42;
  for(const [cx,cy] of [[W*0.06,H*1.02],[W*0.94,H*1.02]]){
    const grd=g.createRadialGradient(cx,cy,R*0.45,cx,cy,R);
    grd.addColorStop(0,'rgba(79,209,255,0.16)');
    grd.addColorStop(1,'rgba(79,209,255,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
    g.strokeStyle='rgba(79,209,255,0.5)'; g.setLineDash([5,5]); g.lineWidth=1;
    g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke(); g.setLineDash([]);
  }
}

function drawHud(){
  const c=$('hudring'), {W,H,vmin}=metrics();
  c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  if(!$('bHud').classList.contains('on')) return;
  // From tools/hud_layout.json `_forFrameDesign`: the instrument ring ends at
  // 15.2 vmin and the ability labels reach 19.6. A touch control under either
  // is a control you cannot see while flying.
  const rings=[[15.2,'rgba(79,209,255,0.55)','ring 15.2'],[19.6,'rgba(255,176,32,0.65)','labels 19.6']];
  for(const [rv,col,lab] of rings){
    g.strokeStyle=col; g.lineWidth=1; g.setLineDash([6,4]);
    g.beginPath(); g.arc(W/2,H/2,rv*vmin,0,7); g.stroke(); g.setLineDash([]);
    g.fillStyle=col; g.font='10px ui-monospace,monospace'; g.textAlign='center';
    g.fillText(lab, W/2, H/2 - rv*vmin - 4);
  }
  // The radar + compass rose, also centre-bottom, also unusable if covered.
  g.strokeStyle='rgba(79,209,255,0.45)'; g.setLineDash([6,4]);
  g.beginPath(); g.arc(W/2,H-19*vmin,13.5*vmin,0,7); g.stroke(); g.setLineDash([]);
}

function render(){
  const host=$('tc');
  host.innerHTML='';
  const {vmin}=metrics();
  const showZones=$('bZones').classList.contains('on');
  for(const id of ORDER){
    const p=L[id]; if(!p) continue;
    if(p.zone && !showZones) continue;
    const r=rect(p);
    const d=document.createElement('div');
    d.className='part'+(p.zone?' zone':'')+(id===sel?' sel':'')+(p.off?' hidden':'');
    d.dataset.id=id;
    d.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.w}px;height:${r.h}px;`+
      `border-radius:${p.shape==='circle'?'50%':(1.2*vmin)+'px'};`+
      `font-size:${1.7*vmin}px`;
    if(p.kick){ const k=document.createElement('span'); k.className='kick';
      k.textContent=p.kick; k.style.fontSize=(p.nm?1.7:3)*vmin+'px'; d.appendChild(k); }
    if(p.nm){ const n=document.createElement('span'); n.className='nm';
      n.textContent=p.nm; n.style.fontSize=2.5*vmin+'px'; d.appendChild(n); }
    if(p.role==='stick'){ const k=document.createElement('div'); k.className='knob'; d.appendChild(k); }
    host.appendChild(d);
    if(id===sel && !testMode){
      for(const h of ['nw','ne','sw','se']){
        const el=document.createElement('div');
        el.className='h '+h; el.dataset.id=id; el.dataset.h=h;
        el.style.left=(r.left+(h[1]==='w'?0:r.w)-5)+'px';
        el.style.top =(r.top +(h[0]==='n'?0:r.h)-5)+'px';
        host.appendChild(el);
      }
    }
  }
  renderList(); renderProps();
}

function renderList(){
  const l=$('list'); l.innerHTML='';
  for(const id of ORDER){
    const p=L[id]; if(!p) continue;
    const r=document.createElement('div');
    r.className='row'+(id===sel?' sel':'');
    r.innerHTML=`<span class="id">${id.replace('tc-','')}</span>`+
      `<span class="tag">${p.nm||p.kick||''}${p.off?' · hidden':''}</span>`;
    r.onclick=()=>{sel=id;render();};
    l.appendChild(r);
  }
}

function renderProps(){
  const p=L[sel], box=$('props');
  if(!p){box.innerHTML='';return;}
  const unit=p.pct?'%':'vmin';
  box.innerHTML=`
    <div class="g"><span>id</span><input class="two" id="pId" value="${sel}" readonly></div>
    <div class="g"><span>Key</span><input class="two" id="pKick" value="${p.kick||''}"></div>
    <div class="g"><span>Name</span><input class="two" id="pNm" value="${p.nm||''}"></div>
    <div class="g"><span>Anchor</span>
      <select id="pAx">${['left','center','right'].map(v=>`<option ${p.ax===v?'selected':''}>${v}</option>`).join('')}</select>
      <select id="pAy">${['top','bottom'].map(v=>`<option ${p.ay===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="g"><span>Offset</span>
      <input type="number" step="0.5" id="pX" value="${p.x}">
      <input type="number" step="0.5" id="pY" value="${p.y}"></div>
    <div class="g"><span>Size</span>
      <input type="number" step="0.5" id="pW" value="${p.w}">
      <input type="number" step="0.5" id="pH" value="${p.h}"></div>
    <div class="g"><span>Shape</span>
      <select id="pShape">${['rect','circle'].map(v=>`<option ${p.shape===v?'selected':''}>${v}</option>`).join('')}</select>
      <label class="f" style="justify-content:flex-end"><input type="checkbox" id="pOff" ${p.off?'checked':''}>hidden</label></div>
    <div class="g"><span style="grid-column:1/4;color:var(--dim)">units: ${unit}${p.pct?' of each axis':''}</span></div>
  `;
  const bind=(el,fn)=>{const e=$(el); if(e) e.oninput=()=>{pushUndo();fn(e);render();};};
  bind('pKick',e=>p.kick=e.value);
  bind('pNm',e=>p.nm=e.value);
  bind('pX',e=>p.x=parseFloat(e.value)||0);
  bind('pY',e=>p.y=parseFloat(e.value)||0);
  bind('pW',e=>p.w=Math.max(1,parseFloat(e.value)||1));
  bind('pH',e=>p.h=Math.max(1,parseFloat(e.value)||1));
  const rebind=(el,fn)=>{const e=$(el); if(e) e.onchange=()=>{pushUndo();fn(e);render();};};
  // Changing an anchor must PRESERVE the on-screen position, otherwise the part
  // teleports and you have to drag it back — the offset is re-derived from the
  // pixels it currently occupies.
  rebind('pAx',e=>{const r=rect(p); p.ax=e.value; setFromPx(p,r.left,r.top);});
  rebind('pAy',e=>{const r=rect(p); p.ay=e.value; setFromPx(p,r.left,r.top);});
  rebind('pShape',e=>{p.shape=e.value; if(p.shape==='circle') p.h=p.w;});
  rebind('pOff',e=>p.off=e.checked);
}

// ---- Drag / resize ---------------------------------------------------------
let drag=null;
$('tc').addEventListener('pointerdown',e=>{
  if(testMode){ const t=e.target.closest('.part');
    if(t){ t.style.background='rgba(120,220,255,.22)'; t.style.borderColor='rgba(170,240,255,.7)'; }
    return; }
  const h=e.target.closest('.h'), part=e.target.closest('.part');
  const id=(h||part)&&(h||part).dataset.id;
  if(!id) return;
  sel=id;
  const p=L[id], r=rect(p);
  drag={id,mode:h?('h'+h.dataset.h):'move',x0:e.clientX,y0:e.clientY,
        left:r.left,top:r.top,w:r.w,h:r.h};
  pushUndo();
  $('tc').setPointerCapture(e.pointerId);
  render(); e.preventDefault();
});
$('tc').addEventListener('pointermove',e=>{
  if(!drag) return;
  const p=L[drag.id], {W,H,vmin}=metrics();
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(drag.mode==='move'){
    setFromPx(p, clampN(drag.left+dx,-40,W-10), clampN(drag.top+dy,-40,H-10));
  } else {
    const west=drag.mode.includes('w'), north=drag.mode.includes('n');
    let w=drag.w+(west?-dx:dx), h=drag.h+(north?-dy:dy);
    w=Math.max(12,w); h=Math.max(12,h);
    if(p.shape==='circle'){ const s=Math.max(w,h); w=s; h=s; }
    const ux=p.pct?W/100:vmin, uy=p.pct?H/100:vmin;
    p.w=round(w/ux); p.h=round(h/uy);
    setFromPx(p, west?drag.left+(drag.w-w):drag.left, north?drag.top+(drag.h-h):drag.top);
  }
  render();
});
const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
addEventListener('pointerup',()=>{drag=null;});

// double-click to rename in place
$('tc').addEventListener('dblclick',e=>{
  const t=e.target.closest('.part'); if(!t) return;
  const p=L[t.dataset.id];
  const v=prompt('Name for '+t.dataset.id, p.nm||'');
  if(v!==null){ pushUndo(); p.nm=v; render(); }
});

addEventListener('keydown',e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if(e.ctrlKey&&e.key==='z'){ if(undoStack.length){ L=undoStack.pop(); render(); toast('undo'); } return; }
  const p=L[sel]; if(!p) return;
  const step=e.shiftKey?5:0.5;
  const map={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
  if(map[e.key]){
    pushUndo();
    const [mx,my]=map[e.key];
    // Offsets grow AWAY from their anchor, so a right/bottom anchor inverts.
    p.x = round(p.x + (p.ax==='right'? -mx : mx));
    p.y = round(p.y + (p.ay==='bottom'? -my : my));
    render(); e.preventDefault();
  }
  if(e.key==='h'||e.key==='H'){ pushUndo(); p.off=!p.off; render(); }
});

// ---- Presets ---------------------------------------------------------------
function preset(k){
  pushUndo();
  if(k==='shipped'){ L=clone(SHIPPED); }
  if(k==='mirror'){
    L=clone(SHIPPED);
    for(const id in L){ const p=L[id];
      if(p.ax==='left') p.ax='right'; else if(p.ax==='right') p.ax='left';
      else p.x=-p.x; }
  }
  if(k==='compact'){
    L=clone(SHIPPED);
    const s=0.78;
    for(const id in L){ const p=L[id]; if(p.zone) continue;
      p.w=round(p.w*s); p.h=round(p.h*s); }
    L['tc-rt'].y=1.5; L['tc-rb'].y=14; L['tc-lb'].y=26.5; L['tc-fd'].y=39;
  }
  if(k==='thumbs'){
    // Everything pulled into the lower corners where a held phone's thumbs
    // actually reach; the top strip is left for glanceable-only buttons.
    L=clone(SHIPPED);
    L['tc-rt'] ={...L['tc-rt'], ax:'right', x:1,  ay:'bottom', y:34};
    L['tc-rb'] ={...L['tc-rb'], ax:'right', x:1,  ay:'bottom', y:18};
    L['tc-lb'] ={...L['tc-lb'], ax:'right', x:26, ay:'bottom', y:34};
    L['tc-fd'] ={...L['tc-fd'], ax:'right', x:26, ay:'bottom', y:18};
    L['tc-rd'] ={...L['tc-rd'], ax:'right', x:1,  ay:'bottom', y:2};
    L['tc-lt'] ={...L['tc-lt'], ax:'left',  x:1,  ay:'top',    y:22};
    L['tc-core']={...L['tc-core'],ax:'center',x:0, ay:'bottom', y:2};
  }
  render();
}

// ---- Export ----------------------------------------------------------------
function showOut(title,text,apply){
  $('outTitle').textContent=title; $('outText').value=text;
  $('outApply').style.display=apply?'':'none';
  $('out').classList.add('on');
}
$('outClose').onclick=()=>$('out').classList.remove('on');
$('outCopy').onclick=()=>{navigator.clipboard.writeText($('outText').value);toast('copied');};
$('outApply').onclick=()=>{
  try{ const j=JSON.parse($('outText').value);
    pushUndo(); L=j.parts||j; render(); $('out').classList.remove('on'); toast('applied'); }
  catch(err){ toast('bad JSON: '+err.message); }
};
$('bJson').onclick=()=>showOut('Export JSON', JSON.stringify({
  _note:'LSS touch control layout. Units are VMIN (1 = 1% of min(vw,vh)); in landscape that is screen height. '+
        'Parts flagged pct:true size in % of their own axis. ax/ay pick the anchored edge; x/y are offsets from it.',
  aspectDesignedOn: $('aspect').selectedOptions[0].textContent,
  parts:L
},null,2));
$('bImport').onclick=()=>showOut('Import JSON — paste and Apply','',true);

$('bCss').onclick=()=>{
  // Emit lines shaped like the game's CSS array so they can be dropped into the
  // #touch-controls IIFE with minimal edit.
  const out=[];
  for(const id of ORDER){
    const p=L[id]; if(!p) continue;
    const u=p.pct?'%':'vmin';
    const parts=[];
    if(p.ax==='center') parts.push(`left: 50%`, `transform: translateX(calc(-50% + ${p.x}vmin))`);
    else parts.push(`${p.ax}: ${p.x}${u}`);
    parts.push(`${p.ay}: ${p.y}${u}`);
    parts.push(`width: ${p.w}${u}`, `height: ${p.h}${u}`);
    if(p.shape==='circle') parts.push('border-radius: 50%');
    out.push(`'#${id} { ${parts.join('; ')}; }',`);
  }
  showOut('Export CSS — paste into the #touch-controls CSS array',
    '// Generated by tools/touch_studio.html\n'+out.join('\n'));
};

['bReach','bHud','bZones'].forEach(b=>$(b).onclick=()=>{
  $(b).classList.toggle('on');
  if(b==='bReach') drawReach(); else if(b==='bHud') drawHud(); else render();
});
$('bTest').onclick=()=>{ testMode=!testMode; $('bTest').classList.toggle('on',testMode);
  toast(testMode?'test mode — tap the controls':'edit mode'); render(); };
$('preset').onchange=e=>preset(e.target.value);
$('aspect').onchange=sizeDevice;
addEventListener('resize',sizeDevice);

sizeDevice();
// Expose for headless checks.
window.TS={get L(){return L},rect,metrics,preset,render,SHIPPED};
</script>
