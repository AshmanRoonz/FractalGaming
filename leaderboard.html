<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Ship Sailing ; Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050510;
    --bg-elev: #0d0d1c;
    --bg-row: #0a0a1a;
    --bg-row-alt: #10101e;
    --bg-row-hover: #1a1a2c;
    --text: #d8d8e0;
    --text-dim: #888899;
    --text-faint: #555566;
    --accent: #ffaa00;
    --accent-dim: rgba(255,170,0,0.35);
    --accent-bg: rgba(255,170,0,0.10);
    --discord: #5865F2;
    --you: #ffaa00;
    --you-bg: rgba(255,170,0,0.08);
    --rule: rgba(80,80,120,0.3);
    --good: #66cc66;
    --bad:  #ff6644;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  header.page {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(to bottom, rgba(255,170,0,0.04), transparent);
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  header.page .logo-link {
    display: flex; align-items: center; gap: 14px;
    color: inherit; text-decoration: none;
  }
  header.page .logo-link img {
    width: 56px; height: 56px;
    filter: drop-shadow(0 0 14px var(--accent-dim));
  }
  header.page h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 18px var(--accent-dim);
  }
  header.page .tagline {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  header.page .nav {
    margin-left: auto;
    display: flex; gap: 18px; align-items: center;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  }
  header.page .nav a {
    color: var(--text-dim); text-decoration: none;
    border-bottom: 1px dotted transparent;
    transition: color 120ms;
  }
  header.page .nav a:hover { color: var(--accent); border-bottom-color: var(--accent-dim); }
  header.page .nav a.cta {
    background: var(--accent); color: #050510;
    padding: 8px 18px; font-weight: 700; border-radius: 2px;
    border: none;
  }
  header.page .nav a.cta:hover { background: #ffc640; color: #050510; border-bottom: 0; }

  .controls {
    padding: 18px 32px;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
  }
  .toggle-group {
    display: flex; border: 1px solid var(--rule); border-radius: 2px;
    overflow: hidden;
  }
  .toggle-group button {
    background: transparent; color: var(--text-dim);
    border: none; padding: 9px 18px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .toggle-group button:hover { color: var(--text); background: var(--bg-elev); }
  .toggle-group button.active {
    color: #050510; background: var(--accent); font-weight: 700;
  }
  .controls label {
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .controls select {
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--rule); padding: 8px 10px;
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    border-radius: 2px; cursor: pointer;
  }
  .controls select:hover { border-color: var(--accent-dim); }
  .controls .spacer { flex: 1; }
  .controls .refresh-info { color: var(--text-faint); font-size: 10px; letter-spacing: 1.5px; }

  main {
    padding: 0 32px 64px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .status-line {
    padding: 24px 0;
    color: var(--text-dim); font-size: 12px; letter-spacing: 1px;
    text-align: center;
  }
  .status-line.error { color: var(--bad); }
  .status-line button {
    background: var(--accent); color: #050510;
    border: none; padding: 8px 18px; margin-left: 12px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700; cursor: pointer;
    border-radius: 2px;
  }
  .status-line button:hover { background: #ffc640; }

  table.lb {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 12px;
  }
  table.lb thead th {
    text-align: left;
    color: var(--text-faint);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }
  table.lb thead th.right { text-align: right; }
  table.lb thead th.center { text-align: center; }
  table.lb tbody tr {
    background: var(--bg-row);
    transition: background 120ms;
  }
  table.lb tbody tr:nth-child(even) { background: var(--bg-row-alt); }
  table.lb tbody tr:hover { background: var(--bg-row-hover); }
  table.lb tbody tr.you { background: var(--you-bg); border-left: 3px solid var(--you); }
  table.lb tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(80,80,120,0.12);
    vertical-align: middle;
  }
  table.lb td.right { text-align: right; }
  table.lb td.center { text-align: center; }
  table.lb .rank {
    width: 38px; color: var(--text-faint); font-family: 'Orbitron', sans-serif;
    font-weight: 700;
  }
  table.lb tr.you .rank { color: var(--accent); }
  table.lb tr:nth-child(1) .rank { color: var(--accent); font-size: 14px; }
  table.lb tr:nth-child(2) .rank { color: #c0c0d0; font-size: 13px; }
  table.lb tr:nth-child(3) .rank { color: #cd7f32; font-size: 13px; }
  table.lb .player {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text);
  }
  table.lb .player img {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--rule);
  }
  table.lb tr.you .player img { border-color: var(--accent); }
  table.lb .player .name { font-weight: 500; }
  table.lb .player:hover .name { color: var(--accent); }
  table.lb .stat { font-variant-numeric: tabular-nums; }
  table.lb .stat-prim { color: var(--text); font-weight: 700; }
  table.lb .stat-dim  { color: var(--text-dim); }
  table.lb .stat-good { color: var(--good); }
  table.lb .stat-bad  { color: var(--bad); }
  table.lb tr td.peak {
    color: var(--accent); font-weight: 700;
  }
  table.lb tr.you td:first-child { padding-left: 9px; }

  .empty-state {
    text-align: center; padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-state h2 {
    font-family: 'Orbitron', sans-serif;
    color: var(--text);
    letter-spacing: 4px;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .empty-state a {
    display: inline-block; margin-top: 18px;
    background: var(--accent); color: #050510;
    padding: 12px 28px; text-decoration: none;
    font-family: inherit; font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    border-radius: 2px;
  }
  .empty-state a:hover { background: #ffc640; }

  footer.page {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-faint); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
    border-top: 1px solid var(--rule);
    margin-top: 40px;
  }
  footer.page a { color: var(--text-dim); text-decoration: none; margin: 0 8px; }
  footer.page a:hover { color: var(--accent); }

  @media (max-width: 720px) {
    table.lb thead th.hide-narrow,
    table.lb tbody td.hide-narrow { display: none; }
    header.page { padding: 18px 16px 14px; gap: 14px; }
    header.page h1 { font-size: 18px; letter-spacing: 3px; }
    main { padding: 0 12px 40px; }
    .controls { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header class="page">
  <a href="index.html" class="logo-link">
    <img src="LSS.png" alt="LSS">
    <div>
      <h1>Leaderboard</h1>
      <div class="tagline">Last Ship Sailing</div>
    </div>
  </a>
  <div class="nav">
    <a href="index.html" class="cta">PLAY</a>
    <a href="terms.html">terms</a>
    <a href="privacy.html">privacy</a>
  </div>
</header>

<div class="controls">
  <div class="toggle-group" id="mode-toggle">
    <button data-mode="multiplayer" class="active">Multiplayer</button>
    <button data-mode="solo">Solo</button>
    <button data-mode="combined">Combined</button>
  </div>
  <label>
    Sort by
    <select id="sort-select">
      <option value="wins">Wins</option>
      <option value="kills">Total Kills</option>
      <option value="matches">Matches Played</option>
      <option value="damage">Total Damage</option>
    </select>
  </label>
  <div class="spacer"></div>
  <div class="refresh-info" id="refresh-info">; ; ;</div>
</div>

<main>
  <div id="status" class="status-line">Loading leaderboard...</div>
  <table class="lb" id="lb-table" style="display:none;">
    <thead>
      <tr>
        <th class="rank">#</th>
        <th>Player</th>
        <th class="right">Matches</th>
        <th class="right">W-L</th>
        <th class="right hide-narrow">Win%</th>
        <th class="right">K/D</th>
        <th class="right hide-narrow">Avg K</th>
        <th class="right">Max K</th>
        <th class="right hide-narrow">Max DMG</th>
      </tr>
    </thead>
    <tbody id="lb-body"></tbody>
  </table>
</main>

<footer class="page">
  <a href="https://fractalreality.ca">fractalreality.ca</a>
  <a href="https://github.com/ashmanroonz">github</a>
  ; backed by Cloudflare D1 + Workers ;
</footer>

<script>
  const API_BASE = 'https://lss-backend.ashroney.workers.dev';
  const REFRESH_MS = 30000;

  let currentMode = 'multiplayer';
  let currentSort = 'wins';
  let lastFetchAt = 0;
  let refreshTimer = null;

  // Identify the signed-in user (if any) so we can highlight their row.
  // The token is set by the game's PKCE flow ; we just read the cached
  // user object, no API call needed.
  function meDiscordId() {
    try {
      const raw = localStorage.getItem('lss_discord_user');
      const u = raw ? JSON.parse(raw) : null;
      return u && u.id ? u.id : null;
    } catch (_) { return null; }
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function fmtPct(n) {
    if (n == null) return '-';
    return Math.round(n * 100) + '%';
  }

  function fmtNum(n) {
    if (n == null) return '-';
    return Number(n).toLocaleString();
  }

  function setStatus(text, isError) {
    const el = document.getElementById('status');
    el.textContent = text || '';
    el.className = 'status-line' + (isError ? ' error' : '');
    el.style.display = text ? '' : 'none';
  }

  function setRetryButton() {
    const el = document.getElementById('status');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Retry';
    btn.addEventListener('click', () => loadLeaderboard());
    el.appendChild(btn);
  }

  function renderRows(entries) {
    const me = meDiscordId();
    const tbody = document.getElementById('lb-body');
    tbody.innerHTML = '';
    entries.forEach((e, i) => {
      const tr = document.createElement('tr');
      if (me && e.discord_id === me) tr.classList.add('you');
      const losses = e.losses != null ? e.losses : Math.max(0, (e.matches || 0) - (e.wins || 0));
      tr.innerHTML = `
        <td class="rank">${i + 1}</td>
        <td>
          <a class="player" href="profile.html?id=${encodeURIComponent(e.discord_id)}">
            ${e.avatar_url ? `<img src="${escapeHtml(e.avatar_url)}" alt="">` : ''}
            <span class="name">${escapeHtml(e.display_name || 'Player')}</span>
          </a>
        </td>
        <td class="right stat stat-dim">${fmtNum(e.matches)}</td>
        <td class="right stat"><span class="stat-good">${fmtNum(e.wins)}</span><span class="stat-dim">-</span><span class="stat-bad">${fmtNum(losses)}</span></td>
        <td class="right stat stat-dim hide-narrow">${fmtPct(e.win_rate)}</td>
        <td class="right stat stat-prim">${e.kd != null ? Number(e.kd).toFixed(2) : '-'}</td>
        <td class="right stat stat-dim hide-narrow">${e.avg_kills != null ? Number(e.avg_kills).toFixed(1) : '-'}</td>
        <td class="right stat peak">${fmtNum(e.max_kills)}</td>
        <td class="right stat peak hide-narrow">${fmtNum(e.max_damage)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function loadLeaderboard() {
    const tbl = document.getElementById('lb-table');
    setStatus('Loading...');
    tbl.style.display = 'none';
    try {
      const url = `${API_BASE}/leaderboard?mode=${encodeURIComponent(currentMode)}&sort=${encodeURIComponent(currentSort)}&limit=100`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const entries = data.entries || [];
      lastFetchAt = Date.now();
      updateRefreshInfo();
      if (entries.length === 0) {
        tbl.style.display = 'none';
        const modeLabel = currentMode === 'multiplayer' ? 'multiplayer' : currentMode === 'solo' ? 'solo' : '';
        document.getElementById('status').innerHTML = `
          <div class="empty-state">
            <h2>No ${modeLabel} matches yet</h2>
            <div>Play a${modeLabel === 'multiplayer' ? ' multiplayer' : modeLabel === 'solo' ? ' solo' : ''} match to seed the leaderboard.</div>
            <a href="index.html">Play Now</a>
          </div>
        `;
        document.getElementById('status').className = 'status-line';
        return;
      }
      setStatus('');
      renderRows(entries);
      tbl.style.display = '';
    } catch (err) {
      console.error('[leaderboard] fetch failed:', err);
      setStatus('Failed to load leaderboard: ' + (err && err.message || err), true);
      setRetryButton();
    }
  }

  function updateRefreshInfo() {
    if (!lastFetchAt) return;
    const ageSec = Math.floor((Date.now() - lastFetchAt) / 1000);
    const el = document.getElementById('refresh-info');
    if (ageSec < 5)        el.textContent = 'just now';
    else if (ageSec < 60)  el.textContent = ageSec + 's ago';
    else                   el.textContent = Math.floor(ageSec / 60) + 'm ' + (ageSec % 60) + 's ago';
  }

  function scheduleRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      // Only auto-refresh if the page is visible, to be polite.
      if (document.visibilityState === 'visible') loadLeaderboard();
    }, REFRESH_MS);
  }

  // Keep the "X seconds ago" label ticking even when nothing else fires.
  setInterval(updateRefreshInfo, 1000);

  // Wire mode toggle
  document.getElementById('mode-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const mode = btn.dataset.mode;
    if (!mode || mode === currentMode) return;
    currentMode = mode;
    document.querySelectorAll('#mode-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    loadLeaderboard();
  });

  // Wire sort dropdown
  document.getElementById('sort-select').addEventListener('change', (e) => {
    currentSort = e.target.value;
    loadLeaderboard();
  });

  // Initial load
  loadLeaderboard();
  scheduleRefresh();
</script>

</body>
</html>
