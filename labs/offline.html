<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractal Reality Labs ; Offline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<!-- Served by sw.js when a page navigation cannot reach the network. The worker caches it, so it is
     fully self-contained: no fonts, images or scripts from anywhere else. -->
<style>
  :root { --bg: #0A0A0F; --gold: #B8A060; --gold-bright: #D8C080; --fog: #a8a094; --dim: #8A8272; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fog); }
  body { font-family: Georgia, 'Times New Roman', serif; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; }
  .symbol { font-size: 54px; color: var(--gold); line-height: 1; margin-bottom: 16px; text-shadow: 0 0 30px rgba(184,160,96,0.35); }
  h1 { font-size: 30px; font-weight: 600; color: var(--gold-bright); margin: 0 0 10px; }
  p { font-size: 17px; line-height: 1.6; max-width: 30em; margin: 0 auto 26px; }
  button { font: 600 14px/1 system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bg);
           background: var(--gold); border: 0; border-radius: 6px; padding: 13px 34px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">&#x2299;</div>
    <h1>You're offline</h1>
    <p>The labs load their engines from the web, so they need a connection. Reconnect and this page will pick up where you were.</p>
    <button type="button" id="retry">Retry</button>
  </main>
<script>
  // The worker answered the failed address with this page, so location is still the page asked for.
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
