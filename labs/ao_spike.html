<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LSS AO Spike (GTAO)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden;
    font-family: 'Rajdhani', system-ui, sans-serif; color: #cfe7ff; }
  #c { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(8,12,22,0.78); border: 1px solid rgba(120,200,255,0.3);
    border-radius: 8px; padding: 12px 14px; width: 230px;
    font-size: 13px; letter-spacing: 0.5px; user-select: none;
  }
  #ui h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: 3px; color: #ffaa00; }
  #ui .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; gap: 8px; }
  #ui input[type=range] { flex: 1; }
  #ui .val { width: 38px; text-align: right; color: #9fd4ff; font-variant-numeric: tabular-nums; }
  #ui button {
    width: 100%; margin-top: 8px; padding: 9px; cursor: pointer;
    background: rgba(20,40,30,0.6); border: 1px solid rgba(120,255,170,0.5);
    color: #bff0d0; border-radius: 6px; font-family: inherit; font-size: 13px;
    letter-spacing: 2px; font-weight: bold;
  }
  #ui button.off { background: rgba(40,20,20,0.6); border-color: rgba(255,120,120,0.5); color: #f0bcbc; }
  #ui .hint { font-size: 11px; opacity: 0.6; margin-top: 8px; line-height: 1.4; }
  #fps { position: fixed; top: 12px; right: 14px; z-index: 10; font-size: 12px;
    color: rgba(150,200,255,0.7); letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>AO SPIKE · GTAO</h1>
  <button id="toggle">AO: ON</button>
  <div class="row"><span>Radius</span><input id="radius" type="range" min="0.5" max="12" step="0.1" value="4"><span class="val" id="radius-v">4.0</span></div>
  <div class="row"><span>Intensity</span><input id="intensity" type="range" min="0.2" max="5" step="0.1" value="2.2"><span class="val" id="intensity-v">2.2</span></div>
  <div class="row"><span>Falloff</span><input id="falloff" type="range" min="0" max="1" step="0.02" value="0.3"><span class="val" id="falloff-v">0.30</span></div>
  <button id="aoonly">VIEW: BEAUTY</button>
  <div class="hint">Drag to orbit · scroll to zoom. Toggle AO to A/B. "AO ONLY" shows the raw occlusion buffer.</div>
</div>
<div id="fps">-- fps</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass }        from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1430);
scene.fog = new THREE.FogExp2(0x0a1430, 0.0042);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 4000);
camera.position.set(70, 48, 90);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 8, 0);
controls.enableDamping = true;

// ---- lighting : matches LSS's bright, low-shadow cartoon feel ----
scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x14203a, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(60, 90, 40);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6a88ff, 0.6);
rim.position.set(-70, 20, -60);
scene.add(rim);

// ---- low-poly flat-shaded "ice canyon" terrain (LSS sandwich-style) ----
function ridged(x, z) {
  // cheap value-noise ridges so the AO has crevices to fill
  const s = (a, b) => Math.sin(a) * Math.cos(b);
  let h = 0;
  h += s(x * 0.06, z * 0.05) * 14;
  h += s(x * 0.13 + 2.0, z * 0.11 - 1.0) * 7;
  h += s(x * 0.31 - 4.0, z * 0.27 + 3.0) * 3.2;
  return h;
}
function buildSheet(flip) {
  const SIZE = 260, SEG = 90, half = SIZE / 2;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let y = ridged(x, z);
    // open a flyable canyon down the middle (z near 0 stays low)
    const lane = Math.exp(-(z * z) / (34 * 34));
    y *= (1 - 0.85 * lane);
    pos.setY(i, flip ? (46 - y) : (-30 + y));
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: flip ? 0x6f7d92 : 0x4a6a86, roughness: 1.0, metalness: 0.0,
    flatShading: true, side: THREE.DoubleSide,
  });
  return new THREE.Mesh(geo, mat);
}
scene.add(buildSheet(false));
scene.add(buildSheet(true));

// ---- a cluster of "rocks" (the crevices AO loves) ----
const rockMat = new THREE.MeshStandardMaterial({ color: 0x586074, roughness: 1.0, metalness: 0.0, flatShading: true });
for (let i = 0; i < 22; i++) {
  const r = 4 + Math.random() * 9;
  const g = new THREE.IcosahedronGeometry(r, 0);
  const m = new THREE.Mesh(g, rockMat);
  const a = Math.random() * Math.PI * 2, rad = 18 + Math.random() * 70;
  m.position.set(Math.cos(a) * rad, -8 + Math.random() * 22, Math.sin(a) * rad * 0.5);
  m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  scene.add(m);
}

// ---- a couple of metallic "ships" so we see AO on hulls + reflections ----
const hullMat = new THREE.MeshStandardMaterial({ color: 0xc8d4e2, roughness: 0.35, metalness: 0.9, flatShading: false });
const glowMat = new THREE.MeshBasicMaterial({ color: 0x3aa0ff });
function ship(x, y, z, col) {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(3.2, 13, 6), hullMat);
  body.rotation.x = Math.PI / 2; grp.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(14, 0.8, 4), hullMat);
  wing.position.z = 1; grp.add(wing);
  const eng = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.4, 3, 8), new THREE.MeshBasicMaterial({ color: col }));
  eng.rotation.x = Math.PI / 2; eng.position.z = 6.5; grp.add(eng);
  grp.position.set(x, y, z);
  scene.add(grp);
  return grp;
}
const ships = [ ship(-14, 10, 6, 0x3aa0ff), ship(16, 14, -10, 0xff5a3a), ship(2, 6, 22, 0xff5a3a) ];

// ---- post : RenderPass -> GTAO -> Output ----
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);
const renderPass = new RenderPass(scene, camera);
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
const outputPass = new OutputPass();
composer.addPass(renderPass);
composer.addPass(gtao);
composer.addPass(outputPass);

// GTAO tuning (LSS-leaning: punchy contact shadows, mid radius)
const aoParams = {
  radius: 4.0, distanceExponent: 1.0, thickness: 1.0,
  scale: 2.2, samples: 16, distanceFallOff: 0.3, screenSpaceRadius: false,
};
function applyAO() {
  gtao.updateGtaoMaterial(aoParams);
  // PD (denoise) defaults are fine for the spike
}
applyAO();

// ---- UI wiring ----
let aoOn = true, aoOnly = false;
const toggle = document.getElementById('toggle');
const aoonlyBtn = document.getElementById('aoonly');
function setOutput() {
  gtao.output = aoOnly ? GTAOPass.OUTPUT.Denoise : GTAOPass.OUTPUT.Default;
}
toggle.onclick = () => {
  aoOn = !aoOn;
  gtao.enabled = aoOn;
  toggle.textContent = 'AO: ' + (aoOn ? 'ON' : 'OFF');
  toggle.classList.toggle('off', !aoOn);
};
aoonlyBtn.onclick = () => {
  aoOnly = !aoOnly;
  gtao.output = aoOnly ? GTAOPass.OUTPUT.AO : GTAOPass.OUTPUT.Default;
  aoonlyBtn.textContent = 'VIEW: ' + (aoOnly ? 'AO ONLY' : 'BEAUTY');
};
function bindSlider(id, key, fmt) {
  const el = document.getElementById(id), v = document.getElementById(id + '-v');
  el.oninput = () => {
    aoParams[key] = parseFloat(el.value);
    v.textContent = fmt(aoParams[key]);
    applyAO();
  };
}
bindSlider('radius', 'radius', x => x.toFixed(1));
bindSlider('intensity', 'scale', x => x.toFixed(1));
bindSlider('falloff', 'distanceFallOff', x => x.toFixed(2));

// ---- loop ----
const fpsEl = document.getElementById('fps');
let last = performance.now(), frames = 0, facc = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  controls.update();
  // drift the ships a touch so it feels alive
  const t = now / 1000;
  ships.forEach((s, i) => { s.position.y += Math.sin(t * 0.6 + i) * 0.02; s.rotation.y = Math.sin(t * 0.3 + i) * 0.3; });
  composer.render();
  frames++; facc += dt;
  if (facc >= 0.5) { fpsEl.textContent = Math.round(frames / facc) + ' fps'; frames = 0; facc = 0; }
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gtao.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
