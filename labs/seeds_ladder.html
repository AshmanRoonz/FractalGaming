<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seeds Ladder — atoms → molecules → up</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04050a; cursor: crosshair; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; pointer-events: none;
    font: 12px ui-monospace, Menlo, monospace; color: #cfe0ff; background: rgba(8,12,20,0.5);
    padding: 6px 10px; border-radius: 6px; line-height: 1.6; }
  #hud b { color: #9fd0ff; } .k { color: #ffd27f; } #lv { color: #bdf5c8; }
  #start { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center;
    background: rgba(4,5,10,0.6); color: #dfeaff; font: 16px ui-monospace, Menlo, monospace; cursor: pointer; }
  #start span { padding: 14px 22px; border: 1px solid #2a3a52; border-radius: 10px; background: rgba(12,18,30,0.7); }
</style>
</head>
<body>
<div id="hud">
  <b>Seeds Ladder</b> — bonded clusters lock, then <b>recompress</b> into one seed a level up<br>
  <span class="k">click</span> = drop atoms · same operation climbs the rungs<br>
  <span id="lv">–</span>
</div>
<div id="start"><span>click to begin (sight + sound)</span></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.tsl.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { Fn, uv, vec3, vec4, float, uniform, max, exp, abs, fract, smoothstep, mix } from 'three/tsl';

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
let actx = null, master = null; const voices = [];   // audio state (declared early; spawnAtom references it)

// ---- tuning ----
const MAX = 30;                 // unit slots (uniform field samples)
const N0 = 16;                  // starting atoms
const BASE_R2 = 0.0022;         // level-0 influence radius²
const FORM = 0.075, REST = 0.052, REPEL = 0.040;   // bond form / rest / hard-repel distances
const V_LOCK = 0.07, LOCK_TIME = 1.1, MAXCLUSTER = 4;
const LEVEL_HUE = [0x39d0c8, 0xff5da2, 0xffc24b, 0x6ad06a, 0x5aa0ff];

const aspect = uniform(innerWidth / innerHeight);
const THRESH = uniform(0.26);
const seedU = []; for (let i = 0; i < MAX; i++) seedU.push(uniform(new THREE.Vector4(0.5, 0.5, 0, BASE_R2)));
const hueU = []; for (let i = 0; i < MAX; i++) hueU.push(uniform(new THREE.Vector3(1, 1, 1)));

// ===========================================================================
// FIELD: normalized sum of active units' influence (per-seed radius in .w).
//   The whole's colour is the normalized blend; it only emerges above THRESH.
// ===========================================================================
const field = Fn(() => {
  const p = uv();
  const wsum = float(0).toVar();
  const csum = vec3(0, 0, 0).toVar();
  for (let i = 0; i < MAX; i++) {
    const s = seedU[i];
    const dx = p.x.sub(s.x).mul(aspect), dy = p.y.sub(s.y);
    const d2 = dx.mul(dx).add(dy.mul(dy));
    const infl = s.z.mul(exp(d2.div(max(s.w, float(0.0001))).negate()));
    wsum.addAssign(infl);
    csum.addAssign(hueU[i].mul(infl));
  }
  const col = csum.div(max(wsum, float(0.0001)));
  const emerge = smoothstep(THRESH, THRESH.add(0.4), wsum);
  const contour = smoothstep(0.42, 0.5, abs(fract(wsum.mul(3.0)).sub(0.5)));
  const lit = col.mul(float(0.4).add(emerge.mul(1.0))).add(col.mul(contour.mul(emerge).mul(0.45)));
  return vec4(mix(vec3(0.012, 0.02, 0.038), lit, emerge), 1.0);
});
const mat = new THREE.MeshBasicNodeMaterial();
mat.colorNode = field();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ===========================================================================
// UNITS + BONDS. A unit is a seed: level, position, mass, valence, hue, voice.
// ===========================================================================
const clamp01 = v => v < 0.05 ? 0.05 : v > 0.95 ? 0.95 : v;
const units = [];
for (let i = 0; i < MAX; i++) units.push({
  active: false, level: 0, x: 0.5, y: 0.5, vx: 0, vy: 0, mass: 1, valence: 2, bonds: 0,
  hue: new THREE.Color(0xffffff), base: 1, freq: 1, phase: 0, amp: 0, stableT: 0, r2: BASE_R2, comp: -1, compSize: 1,
});
let bonds = [];   // {a, b, rest}
function freeSlot() { for (let i = 0; i < MAX; i++) if (!units[i].active) return i; return -1; }
function spawnAtom(x, y) {
  const i = freeSlot(); if (i < 0) return;
  const u = units[i];
  u.active = true; u.level = 0; u.x = clamp01(x); u.y = clamp01(y); u.vx = 0; u.vy = 0; u.mass = 1;
  u.valence = Math.random() < 0.25 ? 1 : 2; u.bonds = 0; u.stableT = 0; u.r2 = BASE_R2;
  u.hue.setHex(LEVEL_HUE[0]).offsetHSL((Math.random()-0.5)*0.12, 0, (Math.random()-0.5)*0.1);
  u.base = 0.9 + Math.random()*0.4; u.freq = 0.5 + Math.random()*0.8; u.phase = Math.random()*6.28;
  if (actx) retune(i);
}
for (let i = 0; i < N0; i++) spawnAtom(Math.random()*0.9+0.05, Math.random()*0.9+0.05);

function bonded(a, b) { for (const bd of bonds) if ((bd.a===a&&bd.b===b)||(bd.a===b&&bd.b===a)) return true; return false; }
function components() {                          // connected components over active units via bonds
  const adj = Array.from({length: MAX}, () => []);
  for (const bd of bonds) if (units[bd.a].active && units[bd.b].active) { adj[bd.a].push(bd.b); adj[bd.b].push(bd.a); }
  for (let i = 0; i < MAX; i++) { units[i].comp = -1; units[i].compSize = 1; }
  let c = 0; const comps = [];
  for (let i = 0; i < MAX; i++) {
    if (!units[i].active || units[i].comp >= 0) continue;
    const stack = [i], mem = []; units[i].comp = c;
    while (stack.length) { const k = stack.pop(); mem.push(k); for (const n of adj[k]) if (units[n].comp < 0) { units[n].comp = c; stack.push(n); } }
    for (const m of mem) units[m].compSize = mem.length;
    comps.push(mem); c++;
  }
  return comps;
}

// ---- recompress a stable cluster into ONE composite seed a level up ----
function recompress(mem) {
  const L = units[mem[0]].level;
  let mx=0, my=0, mvx=0, mvy=0, M=0, r=0, g=0, b=0;
  for (const i of mem) { const u = units[i]; mx+=u.x*u.mass; my+=u.y*u.mass; mvx+=u.vx*u.mass; mvy+=u.vy*u.mass; M+=u.mass; r+=u.hue.r; g+=u.hue.g; b+=u.hue.b; }
  mx/=M; my/=M; mvx/=M; mvy/=M; const n=mem.length; r/=n; g/=n; b/=n;
  for (const i of mem) { units[i].active = false; seedU[i].value.set(units[i].x, units[i].y, 0, units[i].r2); if (actx) voices[i].g.gain.setTargetAtTime(0, actx.currentTime, 0.1); }
  bonds = bonds.filter(bd => !(mem.includes(bd.a) || mem.includes(bd.b)));
  const p = freeSlot(); if (p < 0) return;
  const u = units[p];
  u.active = true; u.level = L+1; u.x = mx; u.y = my; u.vx = mvx*0.4; u.vy = mvy*0.4; u.mass = M;
  u.valence = 2; u.bonds = 0; u.stableT = 0;
  const hx = new THREE.Color(LEVEL_HUE[Math.min(LEVEL_HUE.length-1, L+1)]);
  u.hue.setRGB(r, g, b).lerp(hx, 0.4);          // blend of parts, tinted toward the level's hue
  u.base = 1.0 + 0.25*Math.min(3, n); u.freq = (0.5 + Math.random()*0.6) / (1 + (L+1)*0.6); u.phase = Math.random()*6.28;
  u.r2 = BASE_R2 * (1 + 1.1*(L+1)) * (0.7 + 0.5*Math.sqrt(M));
  if (actx) retune(p);
}

let reseedHint = 0;
function step(dt, t) {
  // forces: same-level repel close / attract mid / wander; bonded pairs hold rest length
  for (let i = 0; i < MAX; i++) { if (!units[i].active) continue; const a = units[i]; let fx=0, fy=0, neigh=0;
    for (let j = 0; j < MAX; j++) { if (j===i || !units[j].active) continue; const b = units[j];
      let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy)||1e-4, ux=dx/d, uy=dy/d;
      neigh += Math.exp(-(d*d)/0.05);
      if (units[j].level !== a.level) continue;                              // only same-scale interaction
      if (d < REPEL) { fx -= ux*(REPEL-d)*9; fy -= uy*(REPEL-d)*9; }
      else if (d < 0.34) { fx += ux*0.45; fy += uy*0.45; }
    }
    fx += Math.sin(t*0.3 + a.phase)*0.35; fy += Math.cos(t*0.27 + a.phase*1.3)*0.35;
    a._fx = fx; a._fy = fy;
  }
  for (const bd of bonds) { const a=units[bd.a], b=units[bd.b]; if(!a.active||!b.active) continue;
    let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy)||1e-4, c=(d-bd.rest)/d*0.5*14;
    a._fx += dx*c; a._fy += dy*c; b._fx -= dx*c; b._fy -= dy*c;
  }
  for (let i = 0; i < MAX; i++) { if (!units[i].active) continue; const a = units[i];
    a.vx=(a.vx + a._fx*dt/Math.sqrt(a.mass))*0.88; a.vy=(a.vy + a._fy*dt/Math.sqrt(a.mass))*0.88;
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(a.x<0.05){a.x=0.05;a.vx=Math.abs(a.vx);} if(a.x>0.95){a.x=0.95;a.vx=-Math.abs(a.vx);}
    if(a.y<0.05){a.y=0.05;a.vy=Math.abs(a.vy);} if(a.y>0.95){a.y=0.95;a.vy=-Math.abs(a.vy);}
    const pulse = 0.5 + 0.5*Math.sin(t*a.freq + a.phase);
    a.amp = a.base * pulse * (0.55 + 0.55*Math.min(1.5, neighOf(i)));
  }
  // form bonds: near + slow + both have spare valence + cluster stays small
  const comps = components();
  for (let i = 0; i < MAX; i++) { if (!units[i].active) continue;
    for (let j = i+1; j < MAX; j++) { if (!units[j].active) continue;
      const a=units[i], b=units[j]; if (a.level!==b.level) continue;
      if (a.bonds>=a.valence || b.bonds>=b.valence) continue; if (bonded(i,j)) continue;
      const d=Math.hypot(b.x-a.x,b.y-a.y); if (d>FORM) continue;
      if (a.comp===b.comp) continue;
      if (a.compSize + b.compSize > MAXCLUSTER) continue;
      bonds.push({ a:i, b:j, rest:REST }); a.bonds++; b.bonds++;
    }
  }
  // lock + recompress: a component that is whole and has gone still
  const comps2 = components();
  for (const mem of comps2) {
    if (mem.length < 2) continue;
    const slow = mem.every(i => Math.hypot(units[i].vx, units[i].vy) < V_LOCK);
    const minT = mem.reduce((m,i)=>Math.min(m,units[i].stableT), 1e9);
    if (slow) { for (const i of mem) units[i].stableT += dt; } else { for (const i of mem) units[i].stableT = 0; }
    if (slow && minT > LOCK_TIME) recompress(mem);
  }
  // write field + sound
  for (let i = 0; i < MAX; i++) { const u = units[i];
    seedU[i].value.set(u.x, u.y, u.active ? u.amp : 0, u.r2);
    if (u.active) hueU[i].value.set(u.hue.r, u.hue.g, u.hue.b);
    if (actx) voices[i].g.gain.setTargetAtTime(u.active ? clampJS(u.amp*0.12, 0, 0.26) : 0, actx.currentTime, 0.09);
  }
}
const _neigh = new Float32Array(MAX);
function neighOf(i){ let s=0; const a=units[i]; for(let j=0;j<MAX;j++){ if(j===i||!units[j].active)continue; const b=units[j]; const d2=(b.x-a.x)**2+(b.y-a.y)**2; s+=Math.exp(-d2/0.05);} return s; }
const clampJS=(v,a,b)=>v<a?a:v>b?b:v;

// ---- sound: a voice per slot; pitch drops with level (deeper composites) ----
const PENT=[0,2,4,7,9,12,14,16,19,21], semis=n=>220*Math.pow(2,n/12);
function retune(i){ const u=units[i]; const deg=PENT[i%PENT.length]-u.level*7 + (u.x-0.5)*4; voices[i].osc.frequency.setTargetAtTime(semis(deg), actx.currentTime, 0.15); }
function startAudio(){ if(actx)return; actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=0; master.connect(actx.destination); master.gain.setTargetAtTime(0.2, actx.currentTime, 0.7);
  for(let i=0;i<MAX;i++){ const osc=actx.createOscillator(); osc.type=i%3?'sine':'triangle'; osc.frequency.value=semis(PENT[i%PENT.length]);
    const g=actx.createGain(); g.gain.value=0; osc.connect(g); g.connect(master); osc.start(); voices.push({osc,g}); if(units[i].active) retune(i); }
}
addEventListener('pointerdown', e=>{ const x=e.clientX/innerWidth, y=1-e.clientY/innerHeight; for(let k=0;k<3;k++) spawnAtom(x+(Math.random()-0.5)*0.08, y+(Math.random()-0.5)*0.08); });
document.getElementById('start').addEventListener('click', ()=>{ startAudio(); document.getElementById('start').style.display='none'; }, {once:true});
addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); aspect.value=innerWidth/innerHeight; });

const lvEl=document.getElementById('lv'); let hudT=0;
let last=performance.now(), T=0;
renderer.setAnimationLoop(()=>{
  const now=performance.now(), dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  step(dt, T);
  hudT-=dt; if(hudT<=0){ hudT=0.4; const cnt={}; for(let i=0;i<MAX;i++) if(units[i].active) cnt[units[i].level]=(cnt[units[i].level]||0)+1;
    lvEl.textContent = Object.keys(cnt).sort().map(l=>`L${l}: ${cnt[l]}`).join('   ') + (Object.keys(cnt).length?'':'—'); }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
