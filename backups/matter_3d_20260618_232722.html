<!DOCTYPE html>
<html lang="en">
<head>

<title>Matter 3D — destructible rock (port slice 1)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 5; pointer-events: none;
    font: 12px ui-monospace, Menlo, monospace; color: #cfe0ff; background: rgba(8,12,20,0.6);
    padding: 6px 10px; border-radius: 6px; line-height: 1.5; }
  #hud b { color: #9fd0ff; } .k { color: #ffd27f; }
</style>
</head>
<body>
<div id="hud">
  <b>Matter 3D</b> — rock that fractures and won't reform<br>
  move mouse = drive the <b>vibranium smasher</b> through the rock · <span class="k">right-drag</span> orbit · <span class="k">wheel</span> zoom · <span class="k">R</span> rebuild<br>
  <span id="stat"></span>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
scene.fog = new THREE.FogExp2(0x0a0e14, 0.012);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(14, 12, 34);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7, 0); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x33312c, 0.7));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6); sun.position.set(12, 22, 8); scene.add(sun);
scene.add(new THREE.AmbientLight(0x405066, 0.4));
const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// ===========================================================================
// ROCK = particles held by persistent bonds (rest-length constraints, PBD).
// ===========================================================================
const NX = 6, NY = 15, NZ = 6, S = 1.0, PR = 0.52, N = NX * NY * NZ;
// MATERIAL "seed": these numbers ARE the substance. Presets set them; tune live in the panel.
const M = { iterations: 12, fracture: 0.06, cohesion: 0.0, damping: 0.99, gravity: 22, groundFric: 0.55, pinned: true };
const R = { isolation: 80, ballStr: 0.62, ballSub: 18 };
const pos = new Float32Array(N * 3), prev = new Float32Array(N * 3), vel = new Float32Array(N * 3), inv = new Float32Array(N);
const TAU = Math.PI * 2;
// RESONANCE: a phase per particle (the vibration), coupled through bonds, driven by a shaker.
const pph = new Float32Array(N), pom = new Float32Array(N), pcoh = new Float32Array(N), pdrv = new Uint8Array(N);
const _ss = new Float32Array(N), _cc = new Float32Array(N), _cs = new Float32Array(N), _cn = new Float32Array(N);
const RZ = { on: false, freq: 0.05, sync: 0.14, vib: 3.5, rebondCos: 0.55, rebondRate: 24 };
let driveTheta = 0;
// bonds as a fixed-capacity POOL so new bonds can nucleate (re-bonding)
const BCAP = 16000;
const bA = new Int32Array(BCAP), bB = new Int32Array(BCAP), bRest = new Float32Array(BCAP), bAlive = new Uint8Array(BCAP), bStr = new Float32Array(BCAP);
let nB = 0;   // high-water mark of used bond slots
const rotQ = []; const scl = new Float32Array(N);
function buildRock() {
  let k = 0;
  for (let j = 0; j < NY; j++) for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX; ix++) {
    const x = (ix - (NX - 1) / 2) * S, y = PR + j * S, z = (iz - (NZ - 1) / 2) * S;
    const jit = 0.3; pos[k*3] = x + (Math.random()-.5)*jit; pos[k*3+1] = y + (Math.random()-.5)*jit; pos[k*3+2] = z + (Math.random()-.5)*jit;
    prev[k*3] = pos[k*3]; prev[k*3+1] = pos[k*3+1]; prev[k*3+2] = pos[k*3+2];
    vel[k*3] = vel[k*3+1] = vel[k*3+2] = 0;
    inv[k] = (M.pinned && j === 0) ? 0 : 1;                      // bottom layer pinned (rooted) only for rooted solids
    pdrv[k] = (j === 0) ? 1 : 0;                                 // base layer = the shaker (the phase source)
    pph[k] = Math.random() * TAU; pom[k] = (Math.random()-0.5) * 0.015; pcoh[k] = 0;
    rotQ[k] = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*6.28, Math.random()*6.28, Math.random()*6.28));
    scl[k] = 0.95 + Math.random() * 0.4;
    k++;
  }
  // initial bonds between neighbours (into the pool)
  bAlive.fill(0); bStr.fill(0); nB = 0; const BR = 1.6 * S;
  for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
    const dx = pos[a*3]-pos[b*3], dy = pos[a*3+1]-pos[b*3+1], dz = pos[a*3+2]-pos[b*3+2], d = Math.hypot(dx, dy, dz);
    if (d < BR) { bA[nB]=a; bB[nB]=b; bRest[nB]=d; bAlive[nB]=1; nB++; }
  }
}
buildRock();

// rendering: ONE marching-cubes surface skinned over the particles, so the intact
//   tower is a single solid rock and only opens a crater where particles are knocked away.
const FMIN = new THREE.Vector3(-12, 0, -12), FSIZE = new THREE.Vector3(24, 24, 24), RES = 36;
const rockMat = new THREE.MeshStandardMaterial({ color: 0x73777d, roughness: 1.0, metalness: 0.0, flatShading: true });
const mc = new MarchingCubes(RES, rockMat, false, false, 120000);
mc.position.set(FMIN.x + FSIZE.x / 2, FMIN.y + FSIZE.y / 2, FMIN.z + FSIZE.z / 2);
mc.scale.set(FSIZE.x / 2, FSIZE.y / 2, FSIZE.z / 2);
scene.add(mc);   // isolation + ball size are driven live from R in the loop
// phase-colored points: so we can SEE the standing phase wave on the body
const ptGeo = new THREE.BufferGeometry();
const ptPos = new Float32Array(N * 3), ptCol = new Float32Array(N * 3);
ptGeo.setAttribute('position', new THREE.BufferAttribute(ptPos, 3));
ptGeo.setAttribute('color', new THREE.BufferAttribute(ptCol, 3));
const points = new THREE.Points(ptGeo, new THREE.PointsMaterial({ size: 0.42, vertexColors: true }));
points.visible = false; scene.add(points);
const _tc = new THREE.Color();

// the vibranium smasher (indestructible ship): a glowing sphere you drive
const SMR = 2.3;
const smasher = new THREE.Mesh(new THREE.IcosahedronGeometry(SMR, 2), new THREE.MeshStandardMaterial({ color: 0x18324a, emissive: 0x35e0ff, emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.6 }));
scene.add(smasher);
let smX = 0, smY = 7, smZ = 16, smPX = smX, smPY = smY, smPZ = smZ, smVX = 0, smVY = 0, smVZ = 0;

// drive the smasher with the mouse on a screen-parallel plane through the rock
const ray = new THREE.Raycaster(), plane = new THREE.Plane(), planePt = new THREE.Vector3(), hit = new THREE.Vector3(), mouse = new THREE.Vector2(0, 0);
addEventListener('mousemove', e => { mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1; });
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') buildRock(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ===========================================================================
// PBD step: predict, satisfy bond / ground / smasher / collision constraints,
//   recover velocity. Bonds break PERMANENTLY past a strain threshold (fracture).
// ===========================================================================
const STIFF = 1.0, REST2 = (PR * 1.9) ** 2, COH2 = 1.5 * 1.5, GY = PR;
const cell = new Map(), CS = PR * 2.0;
function key(x, y, z) { return ((x / CS) | 0) + '_' + ((y / CS) | 0) + '_' + ((z / CS) | 0); }
function step(dt) {
  smVX = (smX - smPX) / dt; smVY = (smY - smPY) / dt; smVZ = (smZ - smPZ) / dt;
  smPX = smX; smPY = smY; smPZ = smZ;
  // predict
  for (let i = 0; i < N; i++) {
    if (inv[i] === 0) continue;
    const o = i * 3;
    vel[o + 1] -= M.gravity * dt;
    if (RZ.on && !pdrv[i]) vel[o] += RZ.vib * Math.sin(pph[i]) * dt;   // the phase physically shakes the body (transverse)
    prev[o] = pos[o]; prev[o + 1] = pos[o + 1]; prev[o + 2] = pos[o + 2];
    pos[o] += vel[o] * dt; pos[o + 1] += vel[o + 1] * dt; pos[o + 2] += vel[o + 2] * dt;
  }
  // the smasher breaks every bond it passes through (permanent fracture)
  const br2 = (SMR + PR) * (SMR + PR);
  for (let e = 0; e < nB; e++) {
    if (!bAlive[e]) continue;
    const a = bA[e] * 3, b = bB[e] * 3;
    const mxp = (pos[a] + pos[b]) * 0.5, myp = (pos[a + 1] + pos[b + 1]) * 0.5, mzp = (pos[a + 2] + pos[b + 2]) * 0.5;
    const ex = mxp - smX, ey = myp - smY, ez = mzp - smZ;
    if (ex * ex + ey * ey + ez * ez < br2) bAlive[e] = 0;
  }
  const MIND = Math.sqrt(REST2), rr = SMR + PR, ITERS = M.iterations | 0;
  for (let it = 0; it < ITERS; it++) {
    // bonds, with fracture on overstretch
    for (let e = 0; e < nB; e++) {
      if (!bAlive[e]) continue;
      const ia = bA[e], ib = bB[e], a = ia * 3, b = ib * 3;
      const wa = inv[ia], wb = inv[ib], ws = wa + wb;
      if (ws === 0) continue;
      const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2];
      const d = Math.hypot(dx, dy, dz) || 1e-5;
      if ((RZ.on ? bStr[e] : (d - bRest[e]) / bRest[e]) > M.fracture) { bAlive[e] = 0; continue; }   // resonance: fracture on SUSTAINED strain (antinode lines)
      const diff = (d - bRest[e]) / d * STIFF;
      const cx = dx * diff, cy = dy * diff, cz = dz * diff;
      pos[a] += cx * (wa / ws); pos[a + 1] += cy * (wa / ws); pos[a + 2] += cz * (wa / ws);
      pos[b] -= cx * (wb / ws); pos[b + 1] -= cy * (wb / ws); pos[b + 2] -= cz * (wb / ws);
    }
    // particle non-penetration
    cell.clear();
    for (let i = 0; i < N; i++) {
      const o = i * 3;
      const kk = key(pos[o], pos[o + 1], pos[o + 2]);
      let c = cell.get(kk);
      if (!c) { c = []; cell.set(kk, c); }
      c.push(i);
    }
    for (let i = 0; i < N; i++) {
      if (inv[i] === 0) continue;
      const o = i * 3;
      const bx = (pos[o] / CS) | 0, by = (pos[o + 1] / CS) | 0, bz = (pos[o + 2] / CS) | 0;
      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          for (let oz = -1; oz <= 1; oz++) {
            const c = cell.get((bx + ox) + '_' + (by + oy) + '_' + (bz + oz));
            if (!c) continue;
            for (let m = 0; m < c.length; m++) {
              const q = c[m];
              if (q <= i) continue;
              const p = q * 3;
              const dx = pos[p] - pos[o], dy = pos[p + 1] - pos[o + 1], dz = pos[p + 2] - pos[o + 2];
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < COH2 && d2 > 1e-6) {
                const d = Math.sqrt(d2);
                const str = d < MIND ? 0.5 : 0.5 * M.cohesion;   // repel within rest; attract (re-bond) out to range, scaled by cohesion
                if (str !== 0) {
                  const corr = (MIND - d) / d * str, wq = inv[q], ws2 = 1 + wq;
                  const cx = dx * corr, cy = dy * corr, cz = dz * corr;
                  pos[o] -= cx / ws2; pos[o + 1] -= cy / ws2; pos[o + 2] -= cz / ws2;
                  if (wq) { pos[p] += cx * (wq / ws2); pos[p + 1] += cy * (wq / ws2); pos[p + 2] += cz * (wq / ws2); }
                }
              }
            }
          }
        }
      }
    }
    // smasher push-out + ground
    for (let i = 0; i < N; i++) {
      if (inv[i] === 0) continue;
      const o = i * 3;
      const dx = pos[o] - smX, dy = pos[o + 1] - smY, dz = pos[o + 2] - smZ, d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < rr * rr && d2 > 1e-6) {
        const d = Math.sqrt(d2), push = (rr - d) / d;
        pos[o] += dx * push; pos[o + 1] += dy * push; pos[o + 2] += dz * push;
      }
      if (pos[o + 1] < GY) pos[o + 1] = GY;
    }
  }
  // recover velocity from the position change
  for (let i = 0; i < N; i++) {
    if (inv[i] === 0) continue;
    const o = i * 3;
    vel[o] = (pos[o] - prev[o]) / dt * M.damping;
    vel[o + 1] = (pos[o + 1] - prev[o + 1]) / dt * M.damping;
    vel[o + 2] = (pos[o + 2] - prev[o + 2]) / dt * M.damping;
    if (pos[o + 1] <= GY + 1e-3) { vel[o] *= M.groundFric; vel[o + 2] *= M.groundFric; }
  }
}

// ===========================================================================
// RESONANCE LOOP: drive phase from the shaker, couple it through the live bonds
//   (so the bond network sets the modes), track sustained strain, and nucleate new
//   bonds only between in-phase particles (resonance binds). The feedback morphs it.
// ===========================================================================
function resonanceStep() {
  if (!RZ.on) return;
  driveTheta = (driveTheta + TAU * RZ.freq) % TAU;
  _ss.fill(0); _cc.fill(0); _cs.fill(0); _cn.fill(0);
  for (let e = 0; e < nB; e++) { if (!bAlive[e]) continue; const i = bA[e], j = bB[e], di = pph[j] - pph[i];
    _ss[i] += Math.sin(di); _ss[j] -= Math.sin(di);
    _cc[i] += Math.cos(pph[j]); _cs[i] += Math.sin(pph[j]); _cn[i]++;
    _cc[j] += Math.cos(pph[i]); _cs[j] += Math.sin(pph[i]); _cn[j]++;
    const a = i*3, b = j*3, d = Math.hypot(pos[b]-pos[a], pos[b+1]-pos[a+1], pos[b+2]-pos[a+2]);
    bStr[e] = bStr[e]*0.92 + Math.abs((d - bRest[e]) / bRest[e]) * 0.08;   // sustained strain (antinode lines)
  }
  for (let i = 0; i < N; i++) {
    if (pdrv[i]) { pph[i] = driveTheta; pcoh[i] = 1; continue; }           // the shaker drives the phase
    const c = _cn[i] || 1;
    pph[i] = (pph[i] + pom[i] + RZ.sync * _ss[i] / c + TAU) % TAU;          // Kuramoto coupling through the bonds
    pcoh[i] = Math.hypot(_cc[i], _cs[i]) / c;
  }
  rebondPass();
}
const _rb = new Map();
function rebondPass() {
  if (RZ.rebondRate <= 0) return;
  const bset = new Set(); for (let e = 0; e < nB; e++) if (bAlive[e]) bset.add(bA[e] * N + bB[e]);
  _rb.clear(); const CSz = 1.6, hk = (x,y,z)=> ((x/CSz)|0)+'_'+((y/CSz)|0)+'_'+((z/CSz)|0);
  for (let i = 0; i < N; i++) { const o=i*3; const kk=hk(pos[o],pos[o+1],pos[o+2]); let c=_rb.get(kk); if(!c)_rb.set(kk,c=[]); c.push(i); }
  let made = 0, free = 0;
  for (let i = 0; i < N && made < RZ.rebondRate; i++) { const o=i*3, bx=(pos[o]/CSz)|0, by=(pos[o+1]/CSz)|0, bz=(pos[o+2]/CSz)|0;
    for (let ox=-1;ox<=1 && made<RZ.rebondRate;ox++) for (let oy=-1;oy<=1;oy++) for (let oz=-1;oz<=1;oz++) { const c=_rb.get((bx+ox)+'_'+(by+oy)+'_'+(bz+oz)); if(!c)continue;
      for (let m=0;m<c.length;m++){ const j=c[m]; if(j<=i)continue; if(bset.has(i*N+j))continue;
        const dx=pos[j*3]-pos[o],dy=pos[j*3+1]-pos[o+1],dz=pos[j*3+2]-pos[o+2],d=Math.hypot(dx,dy,dz);
        if(d>1.5*S)continue; if(Math.cos(pph[i]-pph[j])<RZ.rebondCos)continue;     // in-phase only: resonance binds
        let slot=-1; while(free<nB){ if(!bAlive[free]){slot=free;break;} free++; } if(slot<0){ if(nB<BCAP)slot=nB++; else { made=RZ.rebondRate; break; } }
        bA[slot]=i;bB[slot]=j;bRest[slot]=d;bAlive[slot]=1;bStr[slot]=0;bset.add(i*N+j);made++;
      } } }
}
const statEl = document.getElementById('stat');
// ---- substance presets ("seeds") + live tuning panel ----
const PRESETS = {
  Rock:  { iterations: 12, fracture: 0.06, cohesion: 0.0,  damping: 0.99, gravity: 22, groundFric: 0.55, pinned: true,  color: 0x73777d, isolation: 80, ballStr: 0.62, ballSub: 18 },
  Metal: { iterations: 14, fracture: 0.5,  cohesion: 0.05, damping: 0.95, gravity: 26, groundFric: 0.6,  pinned: true,  color: 0x9aa3ad, isolation: 80, ballStr: 0.62, ballSub: 18 },
  Jello: { iterations: 4,  fracture: 2.0,  cohesion: 0.0,  damping: 0.9,  gravity: 18, groundFric: 0.7,  pinned: true,  color: 0x53c06a, isolation: 78, ballStr: 0.70, ballSub: 16 },
  Putty: { iterations: 5,  fracture: 0.4,  cohesion: 0.4,  damping: 0.85, gravity: 20, groundFric: 0.8,  pinned: false, color: 0xc77da0, isolation: 78, ballStr: 0.70, ballSub: 16 },
  Sand:  { iterations: 2,  fracture: 0.02, cohesion: 0.12, damping: 0.78, gravity: 24, groundFric: 0.45, pinned: false, color: 0xc2a878, isolation: 92, ballStr: 0.55, ballSub: 20 },
  Water: { iterations: 2,  fracture: 0.01, cohesion: 0.9,  damping: 0.97, gravity: 22, groundFric: 0.9,  pinned: false, color: 0x2f7fd0, isolation: 68, ballStr: 0.82, ballSub: 14 },
};
const ui = { preset: 'Rock' };
function applyPreset(name) {
  const p = PRESETS[name]; if (!p) return;
  M.iterations = p.iterations; M.fracture = p.fracture; M.cohesion = p.cohesion; M.damping = p.damping; M.gravity = p.gravity; M.groundFric = p.groundFric; M.pinned = p.pinned;
  R.isolation = p.isolation; R.ballStr = p.ballStr; R.ballSub = p.ballSub;
  rockMat.color.setHex(p.color); buildRock();
  gui.controllersRecursive().forEach(c => c.updateDisplay());
}
const gui = new GUI({ title: 'Substance (the seed)' });
gui.add(ui, 'preset', Object.keys(PRESETS)).name('preset').onChange(applyPreset);
gui.add(M, 'iterations', 1, 16, 1).name('stiffness');
gui.add(M, 'fracture', 0.005, 2, 0.005).name('fracture strain');
gui.add(M, 'cohesion', 0, 1.5, 0.01).name('cohesion / re-bond');
gui.add(M, 'damping', 0.7, 1, 0.005).name('liveliness');
gui.add(M, 'gravity', 0, 40, 1);
gui.add(M, 'groundFric', 0, 1, 0.02).name('ground friction');
gui.add(M, 'pinned').name('rooted base').onChange(buildRock);
const fr = gui.addFolder('Look');
fr.add(R, 'isolation', 20, 140, 1).name('surface tightness');
fr.add(R, 'ballStr', 0.2, 2, 0.02).name('blob size');
const frz = gui.addFolder('Resonance (drive it)');
frz.add(RZ, 'on').name('resonance ON').onChange(v => { points.visible = v; });
frz.add(RZ, 'freq', 0.005, 0.2, 0.001).name('drive frequency');
frz.add(RZ, 'sync', 0, 0.4, 0.005).name('phase coupling');
frz.add(RZ, 'vib', 0, 20, 0.5).name('vibration');
frz.add(RZ, 'rebondCos', -1, 1, 0.02).name('re-bond in-phase ≥');
frz.add(RZ, 'rebondRate', 0, 80, 1).name('re-bond rate');
gui.add({ rebuild: () => buildRock() }, 'rebuild').name('rebuild (or press R)');
let acc = 0, last = performance.now(), frame = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.033, (now - last) / 1000); last = now;
  // smasher follows mouse on a plane through the rock, facing the camera
  camera.getWorldDirection(plane.normal); planePt.set(0, 7, 0); plane.setFromNormalAndCoplanarPoint(plane.normal, planePt);
  ray.setFromCamera(mouse, camera);
  if (ray.ray.intersectPlane(plane, hit)) { smX += (hit.x - smX) * 0.35; smY += (hit.y - smY) * 0.35; smZ += (hit.z - smZ) * 0.35; }
  smasher.position.set(smX, smY, smZ);

  acc += dt; let s = 0; while (acc >= 1/120 && s < 4) { step(1/120); acc -= 1/120; s++; }
  resonanceStep();
  if (RZ.on) { for (let i = 0; i < N; i++) { ptPos[i*3]=pos[i*3]; ptPos[i*3+1]=pos[i*3+1]; ptPos[i*3+2]=pos[i*3+2];
    _tc.setHSL(pph[i]/TAU, 0.85, 0.28 + 0.42*pcoh[i]); ptCol[i*3]=_tc.r; ptCol[i*3+1]=_tc.g; ptCol[i*3+2]=_tc.b; }
    ptGeo.attributes.position.needsUpdate = true; ptGeo.attributes.color.needsUpdate = true; }

  mc.isolation = R.isolation; mc.reset();
  for (let i = 0; i < N; i++) {
    const o = i * 3;
    const nx = (pos[o] - FMIN.x) / FSIZE.x, ny = (pos[o + 1] - FMIN.y) / FSIZE.y, nz = (pos[o + 2] - FMIN.z) / FSIZE.z;
    if (nx <= 0.01 || nx >= 0.99 || ny <= 0.01 || ny >= 0.99 || nz <= 0.01 || nz >= 0.99) continue;
    mc.addBall(nx, ny, nz, R.ballStr, R.ballSub);
  }
  mc.update();
  controls.update();
  renderer.render(scene, camera);
  if ((frame++ & 15) === 0) { let alive = 0; for (let e = 0; e < nB; e++) alive += bAlive[e]; statEl.textContent = `particles: ${N}   bonds intact: ${alive} / ${nB}`; }
});
</script>
</body>
</html>
