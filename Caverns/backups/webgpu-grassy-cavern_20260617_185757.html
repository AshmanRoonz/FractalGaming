<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Endless Cavern</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; cursor: crosshair; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9bb3cc; background: rgba(8,14,24,0.45); border-radius: 8px;
    padding: 6px 12px; backdrop-filter: blur(6px); pointer-events: none;
    transition: opacity 1.2s ease; opacity: 1;
  }
</style>
</head>
<body>
<div id="hint">gamepad: left stick fly · right stick look · triggers up/down — or WASD + mouse (click to capture)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { time, positionLocal, sin, cos, float, vec2, vec3, vec4, hash, instanceIndex,
         Fn, instancedArray, mod, uv, color, smoothstep, uniform, pass, screenUV,
         mix, clamp, max, pow, exp, dot, normalize, reflect, reflector, cameraPosition, positionWorld, normalWorld, attribute, texture, mx_noise_float } from 'three/tsl';

// ============================================================================
// LSS "sandwich" terrain math  (ported from LSS/terrain_preview.html)
//   groundY(x,z): grassy mountain floor (warped ridged noise, rises to YMID)
//   ceilY(x,z):   rock cavern ceiling   (warped ridged noise, dips from YCEIL)
//   you orbit INSIDE the void between them — that's the cavern.
//   scaled down from LSS's flight scale to a single room-sized patch.
// ============================================================================
const SIZE = 2200, HALF = SIZE / 2, SEG = 128;
const SPACING   = 260;
const BASE_FREQ = 1 / SPACING;
const WARP_FREQ = 1 / (SPACING * 2.2);
const WARP      = 70;
const EXPONENT  = 1.7;
const YMID = 0, GAP = 300, GAP_CEIL = 560;
const YFLOOR = YMID - GAP;          // ground base
const YCEIL  = YMID + GAP_CEIL;     // taller ceiling => real headroom to fly through
const GROUND_AMP = 300, CEIL_AMP = 280;
const WL = -225;                    // water level (used by terrain moss, water, scatter)

function hash2(x, z) { const n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return n - Math.floor(n); }
function noise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return (ab + (cd - ab) * v) * 2 - 1;
}
// ridged multifractal — the sharp mountain/stalactite ridgelines (LSS-exact)
function ridged(x, z, seed) {
  let sum = 0, amp = 1, freq = BASE_FREQ, prev = 1, norm = 0;
  for (let o = 0; o < 5; o++) {
    const n = noise2(x * freq + seed * 19.3, z * freq + seed * 7.1);
    let r = 1 - Math.abs(n); r *= r;
    sum += r * amp * prev; prev = r; norm += amp; freq *= 2; amp *= 0.5;
  }
  return Math.pow(sum / norm, EXPONENT);
}
function groundY(x, z) {
  const wx = x + WARP * noise2(x * WARP_FREQ, z * WARP_FREQ);
  const wz = z + WARP * noise2(x * WARP_FREQ + 31.7, z * WARP_FREQ + 17.3);
  const detail = noise2(x * 0.09, z * 0.09) * 5.5 + noise2(x * 0.19, z * 0.19) * 2.5; // craggy texture
  return YFLOOR + GROUND_AMP * ridged(wx, wz, 1.7) + detail;
}
function ceilY(x, z) {
  const ax = x + 4000, az = z - 4000;
  const wx = ax + WARP * noise2(ax * WARP_FREQ, az * WARP_FREQ);
  const wz = az + WARP * noise2(ax * WARP_FREQ + 31.7, az * WARP_FREQ + 17.3);
  return YCEIL - CEIL_AMP * ridged(wx, wz, 5.9);
}
// patch field drives moss / lushness variation (LSS-exact)
function patch(x, z) {
  const n = noise2(x * 0.0016 + 5.1, z * 0.0016 - 2.3) * 0.62 +
            noise2(x * 0.0041 + 11.0, z * 0.0041 + 7.0) * 0.38;
  return Math.max(0, Math.min(1, (n + 1) * 0.5));
}
// Height of the RENDERED (triangulated) ground surface, not the smooth field.
// Grass must anchor to this or blades float above faceted convex peaks.
// Matches PlaneGeometry's two-triangle split: (a,c,b) for u+v<=1 else (b,c,d).
function meshGroundY(x, z) {
  const step = SIZE / SEG;
  let i = Math.floor((x + HALF) / step), j = Math.floor((z + HALF) / step);
  i = Math.max(0, Math.min(SEG - 1, i)); j = Math.max(0, Math.min(SEG - 1, j));
  const x0 = -HALF + i * step, z0 = -HALF + j * step;
  const u = (x - x0) / step, v = (z - z0) / step;
  const a = groundY(x0, z0), b = groundY(x0 + step, z0);
  const c = groundY(x0, z0 + step), d = groundY(x0 + step, z0 + step);
  return (u + v <= 1) ? a + (b - a) * u + (c - a) * v
                      : d + (b - d) * (1 - v) + (c - d) * (1 - u);
}

// LSS grassy biome palette
const COL = {
  moss: new THREE.Color(0x3f5e26), gMid: new THREE.Color(0x5fae4e), gHi: new THREE.Color(0x84c85f),
  rock: new THREE.Color(0x6b6f74), snow: new THREE.Color(0xeef2f5),
  cLo:  new THREE.Color(0x2a2e35), cHi: new THREE.Color(0x565f69),
  sky: 0xa8cd9e
};

// ============================================================================
// FLOATING ORIGIN — the world is INFINITE. The camera always flies near (0,0,0);
//   when it drifts past STEP we snap it back and accumulate the true world center
//   in (CX,CZ). Everything resamples the seeded fields at (local + CX, local + CZ),
//   so the patch around the player is endlessly regenerated. Pop-free: the field
//   is deterministic, so resampling for a shifted center is seamless.
// ============================================================================
let CX = 0, CZ = 0;
// CORRIDOR clamshell: open along -Z (forward), walls on +Z (back) and ±X (sides).
//   At a wall the floor RISES and the ceiling DROPS to meet in the middle (clamshell seal).
const CORRIDOR_HALF = 850, WALLW = 320, BACKZ = 220;
const _clampw = (v, a, b) => Math.max(a, Math.min(b, v));
const _smoothw = w => w * w * (3 - 2 * w);
function wallAmt(wx, wz) {
  const side = (Math.abs(wx) - CORRIDOR_HALF) / WALLW;
  const back = (wz - BACKZ) / WALLW;
  return _clampw(Math.max(side, back), 0, 1);
}
function gY(x, z) {
  const wx = x + CX, wz = z + CZ, w = _smoothw(wallAmt(wx, wz)), g = groundY(wx, wz);
  if (w <= 0) return g;
  return g + ((g + ceilY(wx, wz)) * 0.5 - g) * w;     // floor rises to the seal
}
function cY(x, z) {
  const wx = x + CX, wz = z + CZ, w = _smoothw(wallAmt(wx, wz)), c = ceilY(wx, wz);
  if (w <= 0) return c;
  return c + ((groundY(wx, wz) + c) * 0.5 - c) * w;   // ceiling drops to the seal
}
const pAt = (x, z) => patch(x + CX, z + CZ);
// triangulated ground height in LOCAL coords, offset to the world center
function mGY(x, z) {
  const step = SIZE / SEG;
  let i = Math.floor((x + HALF) / step), j = Math.floor((z + HALF) / step);
  i = Math.max(0, Math.min(SEG - 1, i)); j = Math.max(0, Math.min(SEG - 1, j));
  const x0 = -HALF + i * step, z0 = -HALF + j * step;
  const u = (x - x0) / step, v = (z - z0) / step;
  const a = gY(x0, z0), b = gY(x0 + step, z0);
  const c = gY(x0, z0 + step), d = gY(x0 + step, z0 + step);
  return (u + v <= 1) ? a + (b - a) * u + (c - a) * v
                      : d + (b - d) * (1 - v) + (c - d) * (1 - u);
}
// world-space xz of a local point, fed to the surface-noise shaders so the rock
//   texture stays locked to the WORLD as the geometry scrolls (no swimming).
const worldOrigin = uniform(vec2(0, 0));
// camera-centred radial fade: the square tile dissolves into the fog as a CIRCLE
//   around the player, so the straight tile edge is never visible.
const FADE0 = 320, FADE1 = 560;
const FOGC = 0x9fb4c6;

// ============================================================================
// Renderer / scene / camera
// ============================================================================
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = false;                   // first-person flight: drop the 7 shadow passes for FPS
document.body.appendChild(renderer.domElement);
await renderer.init();

const isWebGPU = !!(renderer.backend && (renderer.backend.isWebGPUBackend ||
  /WebGPU/i.test(renderer.backend.constructor?.name || '')));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c6);       // misty daylight cavern — not a black box
scene.fog = new THREE.FogExp2(0x9fb4c6, 0.0012);   // distance fades to mist; hides the patch edge

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 1, 8000);
camera.rotation.order = 'YXZ';
camera.position.set(0, Math.min(YCEIL - 130, groundY(0, 0) + 95), 0);   // hover above the local ground, below the ceiling

// ----- First-person flycam — LSS controls: left stick flies (fwd/strafe relative
//       to facing), right stick looks (yaw on Y, pitch on X). Keyboard + mouse too.
const look = { yaw: 0, pitch: 0 };
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup',   e => { keys[e.code] = false; });
const cv = renderer.domElement;
cv.addEventListener('click', () => { if (!document.pointerLockElement) cv.requestPointerLock(); });
addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv) { look.yaw -= e.movementX * 0.0022; look.pitch -= e.movementY * 0.0022; }
});
const _hintEl = document.getElementById('hint');
let _hintTimer = 6;
const DEAD = 0.12;
const dz = v => Math.abs(v) < DEAD ? 0 : (v - Math.sign(v) * DEAD) / (1 - DEAD);
const STEP = 480;                    // bigger snap distance => far fewer reloads
const _fwd = new THREE.Vector3(), _rt = new THREE.Vector3(), _mv = new THREE.Vector3();
function updateControls(dt) {
  let mx = 0, my = 0, lx = 0, ly = 0, up = 0, boost = 0;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const g of pads) { if (g && g.connected) { gp = g; break; } }
  if (gp) {
    mx = dz(gp.axes[0] || 0); my = dz(gp.axes[1] || 0);
    lx = dz(gp.axes[2] || 0); ly = dz(gp.axes[3] || 0);
    up = ((gp.buttons[7] && gp.buttons[7].value) || 0) - ((gp.buttons[6] && gp.buttons[6].value) || 0);
    boost = (gp.buttons[0] && gp.buttons[0].pressed) ? 1 : 0;
  }
  if (keys['KeyW']) my = -1; if (keys['KeyS']) my = 1;
  if (keys['KeyA']) mx = -1; if (keys['KeyD']) mx = 1;
  if (keys['ArrowLeft']) lx = -1; if (keys['ArrowRight']) lx = 1;
  if (keys['ArrowUp']) ly = -1; if (keys['ArrowDown']) ly = 1;
  if (keys['Space']) up = 1; if (keys['ShiftLeft'] || keys['ControlLeft']) up = -1;
  if (keys['ShiftRight']) boost = 1;

  const LOOK = 2.4;
  look.yaw -= lx * LOOK * dt;
  look.pitch -= ly * LOOK * dt;
  look.pitch = Math.max(-1.45, Math.min(1.45, look.pitch));
  camera.rotation.set(look.pitch, look.yaw, 0);

  const SPEED = 300 * (1 + boost * 1.8);
  _fwd.set(0, 0, -1).applyEuler(camera.rotation);
  _rt.set(1, 0, 0).applyEuler(camera.rotation);
  _mv.set(0, 0, 0).addScaledVector(_fwd, -my).addScaledVector(_rt, mx);
  _mv.y += up;
  camera.position.addScaledVector(_mv, SPEED * dt);

  // floating origin: keep the camera near (0,0,0), bank the drift into (CX,CZ)
  let moved = false;
  while (camera.position.x >  STEP) { camera.position.x -= STEP; CX += STEP; moved = true; }
  while (camera.position.x < -STEP) { camera.position.x += STEP; CX -= STEP; moved = true; }
  while (camera.position.z >  STEP) { camera.position.z -= STEP; CZ += STEP; moved = true; }
  while (camera.position.z < -STEP) { camera.position.z += STEP; CZ -= STEP; moved = true; }
  if (moved) recenter();

  if (_hintTimer > 0) { _hintTimer -= dt; if (_hintTimer <= 0 && _hintEl) _hintEl.style.opacity = 0; }
}

// ============================================================================
// Lighting — bright grotto: hemi valley ambient + sun + cool fill (LSS values)
// ============================================================================
scene.add(new THREE.AmbientLight(0x9fb4c6, 0.45));   // open daylight fill so you can see while flying
const hemi = new THREE.HemisphereLight(0xcfe0ee, 0x3c4a30, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);   // sun ON now — lights the grassy mountains
sun.position.set(600, 1400, 400);
sun.castShadow = false;
sun.shadow.mapSize.set(1536, 1536);   // smaller shadow map = cheaper shadow pass
sun.shadow.camera.near = 200; sun.shadow.camera.far = 3000;
sun.shadow.camera.left = -720; sun.shadow.camera.right = 720;
sun.shadow.camera.top = 720; sun.shadow.camera.bottom = -720;
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd9ff, 0.0);
fill.position.set(-1, 0.4, -1);
scene.add(fill);

// ============================================================================
// SHELLS — ground (grassy) + ceiling (rock), built as displaced grids.
//   colour is baked per-vertex following LSS's colGround/colCeil + a slope
//   term (steep faces -> rock) so flats are grass, cliffs are rock, peaks snow.
// ============================================================================
const _c = new THREE.Color();
function colGround(x, z, y, slopeFlat) {
  const t = Math.max(0, Math.min(1, (y - YFLOOR) / GROUND_AMP)); // 0 valley -> 1 peak
  const pc = pAt(x, z);
  if (pc < 0.40) _c.copy(COL.rock).lerp(COL.moss, pc / 0.40);
  else if (pc < 0.68) _c.copy(COL.moss).lerp(COL.gMid, (pc - 0.40) / 0.28);
  else _c.copy(COL.gMid).lerp(COL.gHi, (pc - 0.68) / 0.32);
  _c.lerp(COL.rock, 1 - slopeFlat);            // steep -> rock
  if (t > 0.74) _c.lerp(COL.snow, Math.min(1, (t - 0.74) / 0.26) * Math.max(slopeFlat, 0.4));
  return _c;
}
function colCeil(y) {
  const t = Math.max(0, Math.min(1, (y - (YMID)) / (YCEIL - YMID)));
  return _c.copy(COL.cHi).lerp(COL.cLo, t);    // low tips lighter, high base darker
}

// (re)sample a shell's heights + baked vertex colour/AO for the current center
function fillShell(geo, isCeil) {
  const pos = geo.attributes.position;
  let colAttr = geo.attributes.color;
  if (!colAttr) { colAttr = new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3); geo.setAttribute('color', colAttr); }
  const colors = colAttr.array;
  const e = 4;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = isCeil ? cY(x, z) : gY(x, z);
    pos.setY(i, y);
    let col;
    if (isCeil) { col = colCeil(y); }
    else {
      const yx = gY(x + e, z) - gY(x - e, z);
      const yz = gY(x, z + e) - gY(x, z - e);
      const ny = (2 * e) / Math.hypot(yx, yz, 2 * e);   // surface normal.y: 1 flat, 0 cliff
      const flat = Math.max(0, Math.min(1, (ny - 0.64) / 0.24));   // steeper => exposed bedrock
      col = colGround(x, z, y, flat);
    }
    // baked cavity AO: concave pockets (valleys, crevices) are occluded => darker
    const fn = isCeil ? cY : gY, e2 = 8;
    const lap = fn(x + e2, z) + fn(x - e2, z) + fn(x, z + e2) + fn(x, z - e2) - 4 * y;
    const ao = isCeil ? 1 : Math.max(0.5, 1 - Math.max(0, lap) * 0.035);
    colors[i * 3] = col.r * ao; colors[i * 3 + 1] = col.g * ao; colors[i * 3 + 2] = col.b * ao;
  }
  pos.needsUpdate = true; colAttr.needsUpdate = true;
  geo.computeVertexNormals();
}
function buildShell(isCeil) {
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(isCeil ? Math.PI / 2 : -Math.PI / 2);
  fillShell(geo, isCeil);
  const mat = new THREE.MeshStandardNodeMaterial({
    vertexColors: true, roughness: 1.0, metalness: 0.0,
    flatShading: isCeil, side: THREE.DoubleSide
  });
  const _rad = positionWorld.xz.sub(cameraPosition.xz).length();
  const _edgeFade = smoothstep(float(FADE0), float(FADE1), _rad);
  const _fogCol = color(FOGC);
  if (!isCeil) {
    // per-pixel surface TEXTURE: multi-scale mottling + faint rock strata banding.
    // offset by worldOrigin so the rock grain stays locked to the WORLD as we scroll.
    const wp = vec3(positionWorld.x.add(worldOrigin.x), positionWorld.y, positionWorld.z.add(worldOrigin.y));
    const mottle = mx_noise_float(wp.mul(0.012)).mul(0.22)
      .add(mx_noise_float(wp.mul(0.05)).mul(0.16))
      .add(mx_noise_float(wp.mul(0.19)).mul(0.10)).add(0.96);   // ~0.7..1.25
    const strata = sin(positionWorld.y.mul(0.07).add(mx_noise_float(wp.mul(0.04)).mul(2.0))).mul(0.05).add(1.0);
    const terr = attribute('color').mul(mottle).mul(strata);
    // MOSS coating: a FLAT mossy layer painted on the surface, with fuzzy grain.
    // Darker + richer than the grass so it actually reads as moss, full strength.
    const dampLow = float(1).sub(smoothstep(float(WL + 60), float(WL + 330), positionWorld.y));
    const patches = smoothstep(float(0.28), float(0.54), mx_noise_float(wp.mul(0.018)));
    // fuzzy texture = layered noise; higher floors so it speckles without going dark
    const fuzz = mx_noise_float(wp.mul(0.5)).mul(0.20).add(0.88)
      .mul(mx_noise_float(wp.mul(2.4)).mul(0.24).add(0.87))
      .mul(mx_noise_float(wp.mul(7.5)).mul(0.30).add(0.85));
    const mossCol = mix(color(0x356a26), color(0x68ad3c), mx_noise_float(wp.mul(0.1)).mul(0.5).add(0.5)).mul(fuzz);
    const mossAmt = dampLow.mul(patches);                       // full strength in the patches
    mat.colorNode = mix(mix(terr, mossCol, mossAmt), _fogCol, _edgeFade);
  } else {
    mat.colorNode = mix(attribute('color'), _fogCol, _edgeFade);
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;             // mountains AND ceiling/stalactites cast into the shafts
  mesh.receiveShadow = true;          // and receive them (incl. from rocks)
  return mesh;
}
const groundMesh = buildShell(false); scene.add(groundMesh);
const ceilMesh = buildShell(true); scene.add(ceilMesh);

// NO perimeter skirt: the four sealed walls made every patch read as a cubical
//   room. Without them the floor + ceiling just fade into the fog => open cavern.

// ============================================================================
// ANIMATED WATER — TSL ocean filling only the deep valleys, with a baked
//   FRACTAL COASTLINE: per-vertex water depth (WL - groundY) drives a foam
//   shore band, calms the waves near the shore, and fades the surface to zero
//   exactly on the terrain contour — so the coast follows the mountains
//   instead of cutting a flat ring through them.
// ============================================================================
// (WL water level declared up top)

// ---- SHARED AIR+WATER FLOW FIELD (#3): one curl-noise field is the single
//      source of motion. Grass leans with it; water ripples scroll along it.
//      Curl of a noise streamfunction => divergence-free swirling currents.
//      Returns a ~unit-scale vec2 velocity for world point p=(x,z).
function flowAt(p, t) {
  const s = 0.0016, e = 3.0;
  const psi = (x, z) => mx_noise_float(vec3(x.mul(s), z.mul(s), t.mul(0.06)));
  const dPsiZ = psi(p.x, p.y.add(e)).sub(psi(p.x, p.y.sub(e)));
  const dPsiX = psi(p.x.add(e), p.y).sub(psi(p.x.sub(e), p.y));
  return vec2(dPsiZ, dPsiX.mul(-1)).mul(100);
}

// ============================================================================
// WATER BODIES + WAVE SIM (the mereology + cymatics step)
//   A CPU wave-grid sim. A water MASK from the terrain confines waves to water;
//   land cells are reflecting walls, so each connected body is its own basin —
//   ripples bounce off their own shoreline and interfere (cymatics). Stepped at a
//   FIXED rate => deterministic => identical on every peer from the same events.
// ============================================================================
const WG = 140;                  // lighter CPU sim (water is calm without the ship anyway)
const wgScale = SIZE / WG;
const waterMask = new Uint8Array(WG * WG);
let wcur = new Float32Array(WG * WG), wprev = new Float32Array(WG * WG);
const wgX = (i) => -HALF + (i + 0.5) * wgScale, wgZ = (j) => -HALF + (j + 0.5) * wgScale;
function computeWaterMask() {
  for (let j = 0; j < WG; j++) for (let i = 0; i < WG; i++)
    waterMask[j * WG + i] = (WL - gY(wgX(i), wgZ(j))) > 2 ? 1 : 0;
}
computeWaterMask();
function wgIndex(x, z) {
  const i = Math.floor((x + HALF) / wgScale), j = Math.floor((z + HALF) / wgScale);
  return (i < 0 || i >= WG || j < 0 || j >= WG) ? -1 : j * WG + i;
}
// any object injects a disturbance here (impacts, ship downwash, ...)
function spawnRipple(x, z, amp) { const k = wgIndex(x, z); if (k >= 0 && waterMask[k]) wcur[k] += amp; }
const C2 = 0.18, WDAMP = 0.997;
function stepWave() {
  for (let j = 0; j < WG; j++) for (let i = 0; i < WG; i++) {
    const k = j * WG + i;
    if (!waterMask[k]) { wprev[k] = 0; continue; }
    const c = wcur[k];
    const Ln = (i > 0 && waterMask[k - 1]) ? wcur[k - 1] : c;       // land neighbor reflects (Neumann)

      s.life -= dt;
      s.intensity *= (0.80 + Math.random() * 0.14);
      if (Math.random() < 0.30) s.intensity = Math.min(1.7, s.intensity + 0.5);   // re-strike flicker
    } else s.intensity *= 0.55;
    flashU[i].pos.value.copy(s.pos);
    flashU[i].int.value = s.intensity;
    flashLights[i].position.copy(s.pos);
    flashLights[i].color.setHSL(s.hue || 0.66, 0.85, 0.62);   // blue<->purple per strike
    flashLights[i].intensity = s.intensity * 7000;     // big so a flash reaches the ground far below
  }
  // the brightest active flash also casts shadows (aimed straight down)
  let bi = 0; for (let i = 1; i < NFL; i++) if (flash[i].intensity > flash[bi].intensity) bi = i;
  const bs = flash[bi];
  flashShadow.position.copy(bs.pos);
  flashShadow.target.position.set(bs.pos.x, -300, bs.pos.z);
  flashShadow.color.setHSL(bs.hue || 0.66, 0.7, 0.7);
  flashShadow.intensity = bs.intensity * 5200;          // shadow flash (a bit under the fill lights)
}

const shipU = uniform(vec3(0, -9999, 0));   // ship world pos — the ONE AIR carries its wake
let cloudWakeUpdate = null;

// ============================================================================
// CLOUD — fluffy mist around the mountain tops. The translucent "fog" look from
//   the water, but as stacked horizontal layers near the peaks with billowy FBM
//   density (gaps make it puffy, not a flat sheet), drifting slowly.
// ============================================================================
function makeClouds() {
  if (!isWebGPU) return;                        // billboard puffs use the compute/sprite path
  const N = 1000, PER = 80;                     // ~13 clusters (fewer transparent sprites = less fill cost)
  const positions = instancedArray(N, 'vec3');
  const scales = instancedArray(N, 'float');
  const seeds = instancedArray(N, 'float');
  // init: scatter soft puffs into clusters, high up in the cavern
  const init = Fn(() => {
    const i = instanceIndex;
    const cl = i.div(PER);                       // cluster id
    const ccx = hash(cl.add(1)).sub(0.5).mul(HALF * 1.6);
    const ccz = hash(cl.add(7)).sub(0.5).mul(HALF * 1.6);
    const ccy = hash(cl.add(3)).mul(90).add(120);
    const a = hash(i.add(11)).mul(6.283);
    const rad = hash(i.add(13)).mul(95);
    positions.element(i).assign(vec3(
      ccx.add(cos(a).mul(rad).mul(1.8)),
      ccy.add(hash(i.add(17)).sub(0.5).mul(55)),
      ccz.add(sin(a).mul(rad).mul(1.8))
    ));
    scales.element(i).assign(hash(i.add(23)).mul(75).add(55));
    seeds.element(i).assign(hash(i.add(29)));
  })().compute(N);
  renderer.compute(init);

  const mat = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false });
  const seed = seeds.toAttribute();
  const ph = seed.mul(6.283);
  const sway = vec3(sin(time.mul(0.12).add(ph)).mul(16), sin(time.mul(0.08).add(ph)).mul(6), cos(time.mul(0.10).add(ph)).mul(16));
  // ONE AIR wake: the ship shoves the single connected air; puffs are pushed aside
  //   and drift back (carving a wake). The air is bounded, so puffs stay in the void
  //   (above the peaks, below the ceiling) — the mountains constrain it.
  const cloudOff = instancedArray(N, 'vec3');
  cloudWakeUpdate = Fn(() => {
    const i = instanceIndex;
    const base = positions.element(i);
    const off = cloudOff.element(i);
    const toShip = base.add(off).sub(shipU);
    const d = toShip.length().add(0.001);
    const push = toShip.div(d).mul(max(float(170).sub(d), float(0)).div(170).mul(12.0));
    const no = off.add(push).mul(0.93);
    const py = clamp(base.y.add(no.y), float(60), float(235));      // bounded by terrain + ceiling
    cloudOff.element(i).assign(vec3(no.x, py.sub(base.y), no.z));
  })().compute(N);
  mat.positionNode = positions.toAttribute().add(cloudOff.toAttribute()).add(sway);
  mat.scaleNode = scales.toAttribute();
  // LSS look: soft radial falloff * seeded warped FBM => a unique wispy patch
  const c = uv().sub(0.5);
  const r = c.length().mul(2);
  const radial = float(1).sub(smoothstep(float(0.0), float(1.0), r));
  const wp = c.mul(2.4).add(vec2(seed.mul(47.3), seed.mul(19.7))).add(vec2(time.mul(0.03), time.mul(0.02)));
  const wisp = mx_noise_float(vec3(wp.x.mul(2.4), wp.y.mul(2.4), seed.mul(8.0))).mul(0.5).add(0.5);
  // clouds have NO self-light: lit ONLY by lightning flashes + the crack god-rays
  const sprPos = positions.toAttribute();
  let flashLit = float(0.0);                                 // lightning (blue-violet, only when it flashes)
  for (let i = 0; i < NFL; i++) {
    const d = sprPos.sub(flashU[i].pos).length();
    flashLit = flashLit.add(flashU[i].int.mul(smoothstep(float(680), float(0), d)));
  }
  let crackLit = float(0.0);                                 // crack god-rays (white, steady)
  for (let i = 0; i < crackU.length; i++) {
    const d = sprPos.sub(crackU[i].pos).length();
    crackLit = crackLit.add(smoothstep(float(440), float(0), d).mul(0.55));
  }
  // crack light = white; lightning = blue-violet — kept separate so they don't blend
  mat.colorNode = color(0xeef4ff).mul(crackLit).add(color(0xb0a4ff).mul(flashLit)).mul(2.4);
  mat.opacityNode = radial.mul(radial).mul(wisp).mul(0.9);
  const cloud = new THREE.Sprite(mat);
  cloud.count = N;
  cloud.frustumCulled = false;
  cloud.renderOrder = 3;
  scene.add(cloud);
}

// ============================================================================
// CRACK LIGHT — a glowing crack slit in the ceiling AND a light SHEET below it
//   of the EXACT same shape: both use one profile(uvX, seed) (an irregular
//   opening with tapered ends + gaps), so the beam is the crack extruded down-sun.
// ============================================================================
function makeCrackLights() {
  const H = CRACK_H;
  const sunUp = _sunUp;
  const planeGeo = new THREE.PlaneGeometry(1, 1);
  const dust = mx_noise_float(positionWorld.mul(0.02).add(vec3(float(0), time.mul(0.22), float(0)))).mul(0.4).add(0.6);
  // one irregular crack-opening profile along its length (uvX in 0..1), unique per seed
  const profile = (uvX, seed) => {
    const taper = smoothstep(float(0.0), float(0.10), uvX).mul(smoothstep(float(1.0), float(0.90), uvX));
    const gaps = mx_noise_float(vec3(uvX.mul(6.0).add(float(seed)), float(seed * 1.7), float(0))).mul(0.5).add(0.5);
    return taper.mul(smoothstep(float(0.26), float(0.62), gaps));   // tapered ends + broken gaps
  };

  for (const st of crackSites) {
    const { x, z, cy, seed, theta, wide } = st;
    const t = new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta));   // crack long axis (horizontal)

    // --- glowing slit on the ceiling: profile along its length, thin across ---
    const nrm = new THREE.Vector3(-(ceilY(x + 3, z) - ceilY(x - 3, z)) / 6, -1, -(ceilY(x, z + 3) - ceilY(x, z - 3)) / 6).normalize();
    const cX = t.clone().sub(nrm.clone().multiplyScalar(t.dot(nrm))).normalize();
    const cZ = nrm.clone();
    const cY = new THREE.Vector3().crossVectors(cZ, cX).normalize();
    const cMat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false });
    const cuv = uv();
    cMat.colorNode = color(0xeaf6ff);
    cMat.opacityNode = profile(cuv.x, seed).mul(smoothstep(float(0.5), float(0.16), cuv.y.sub(0.5).abs()));
    const cm = new THREE.Mesh(planeGeo, cMat);
    cm.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(cX, cY, cZ));
    cm.position.set(x, cy - 1, z);
    cm.scale.set(wide, 8 + Math.random() * 4, 1);
    cm.renderOrder = 4; scene.add(cm); st.slit = cm;

    // --- light SHEET: SAME profile across the width, extruded down along the sun ---
    const bX = t.clone().sub(sunUp.clone().multiplyScalar(t.dot(sunUp))).normalize();   // crack dir perp to sun
    const bY = sunUp.clone();                                  // +Y toward the crack (top edge)
    const bZ = new THREE.Vector3().crossVectors(bX, bY).normalize();
    const bMat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false });
    const buv = uv();
    bMat.colorNode = color(0xeaf3ff);
    bMat.opacityNode = profile(buv.x, seed).mul(buv.y.pow(1.5)).mul(dust).mul(0.2);   // crack shape across, fade down
    const bm = new THREE.Mesh(planeGeo, bMat);
    bm.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(bX, bY, bZ));
    bm.position.set(x - sunUp.x * H / 2, cy - sunUp.y * H / 2, z - sunUp.z * H / 2);   // top edge sits on the crack
    bm.scale.set(wide, H, 1);
    bm.renderOrder = 4; scene.add(bm); st.shaft = bm;

    // a real SpotLight at the crack, aimed down-sun, so the beam lights the ground
    const spot = new THREE.SpotLight(0xeaf2ff, 3000, 2200, 0.42, 0.6, 1.0);  // strong; reaches the ground far below
    spot.position.set(x, cy, z);
    spot.target.position.set(x - sunUp.x * 600, cy - sunUp.y * 600, z - sunUp.z * 600);
    spot.castShadow = true;                                  // the shaft is shaped by stalactites + terrain
    spot.shadow.mapSize.set(1024, 1024);
    spot.shadow.camera.near = 30; spot.shadow.camera.far = 1500;
    spot.shadow.bias = -0.0009;
    scene.add(spot); scene.add(spot.target); st.spot = spot;
  }
}
makeCrackLights();
