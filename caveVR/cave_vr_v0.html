<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cave VR (WebGPU + WebXR) v0</title>
<meta name="theme-color" content="#0a0520">
<meta name="application-name" content="CaveVR">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050308; color: #d8d2ff; font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; }
  canvas { display: block; }
  #status {
    position: fixed; top: 10px; left: 10px; padding: 8px 12px;
    background: rgba(10,5,32,0.6); border: 1px solid #3a2a6a; border-radius: 6px;
    font-size: 13px; letter-spacing: 0.04em; z-index: 5; pointer-events: none;
    max-width: 420px;
  }
  #status b { color: #b69bff; font-weight: 700; }
  #vrbtn {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; font-size: 15px; font-weight: 700; letter-spacing: 0.1em;
    background: linear-gradient(180deg,#3a1f8a,#1a0d44); color: #fff;
    border: 1px solid #6a4ed0; border-radius: 999px; cursor: pointer;
    z-index: 10; box-shadow: 0 0 20px rgba(106,78,208,0.5);
  }
  #vrbtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #flat-crosshair {
    position: fixed; left: 50%; top: 50%; width: 36px; height: 36px;
    margin: -18px 0 0 -18px; pointer-events: none; z-index: 4;
    border: 1.5px solid rgba(182,155,255,0.7); border-radius: 50%;
    box-shadow: 0 0 8px rgba(182,155,255,0.4) inset, 0 0 6px rgba(182,155,255,0.3);
  }
  #flat-crosshair::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: #b69bff; border-radius: 50%; box-shadow: 0 0 6px #b69bff;
  }
  body.vr-active #status, body.vr-active #vrbtn, body.vr-active #flat-crosshair { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three":           "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/webgpu":    "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
    "three/tsl":       "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.tsl.js",
    "three/addons/":   "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="status">
  <b>Cave VR (WebGPU + WebXR)</b> v0<br>
  Renderer: <span id="rname">initialising</span><br>
  Mouse: look (click to lock). WASD: move. Q/E: snap turn. Space: head laser. LMB / RMB: hand rockets.<br>
  Press <b>ENTER VR</b> for the headset version (both triggers = head laser).
</div>
<button id="vrbtn" disabled>ENTER VR</button>
<div id="flat-crosshair"></div>

<script type="module">
/* ============================================================================
   Cave VR (WebGPU + WebXR) v0
   ----------------------------------------------------------------------------
   Single-file proof of concept:
     - WebGPURenderer with auto fallback to WebGLRenderer (kept on the same
       Three.js API surface so the scene code is renderer-agnostic).
     - Procedural winding cave tunnel (Catmull-Rom spline + noise-displaced
       ring cross-sections, stitched into one inside-facing mesh).
     - VR controllers as visible hands with three crosshairs (L hand, R hand,
       head circumpunct).
     - LSS-style head-aim nudge: when the head is rotated past a small dead
       zone, the dolly's yaw eases toward where the head is pointing.
     - LSS-style movement: left stick = planar forward/strafe along head
       heading; right stick X = snap-turn (nudge), right stick Y = no-op
       (real headset pitch handles look up/down).
     - Weapons:
         left trigger alone  -> rocket from left hand along its ray
         right trigger alone -> rocket from right hand along its ray
         both triggers within 100 ms -> head laser from camera forward
       Independent cooldowns, brief lockout while detecting "both pressed".
   Status: v0. Many knobs are still hard-coded; the goal is the smallest
   playable loop we can iterate on.
   ========================================================================== */

let THREE = null;
let usingWebGPU = false;
const statusEl = document.getElementById('status');
const rnameEl  = document.getElementById('rname');
const vrBtn    = document.getElementById('vrbtn');

/* ----------------------------------------------------------------------------
   1. Renderer bootstrap (WebGPU first, WebGL fallback).
   - We dynamically import three/webgpu and try to construct WebGPURenderer.
   - On any failure (init throws, async backend rejects, XR not compatible),
     we discard and fall back to WebGLRenderer from the classic three build.
   - The rest of the code uses Three.js classes off `THREE`, which works
     for both backends since WebGPURenderer re-exports the full namespace.
   ------------------------------------------------------------------------- */
async function initRenderer() {
  // Try WebGPU first.
  if (navigator.gpu) {
    try {
      const mod = await import('three/webgpu');
      THREE = mod;
      const r = new mod.WebGPURenderer({ antialias: true, alpha: false });
      r.setPixelRatio(window.devicePixelRatio);
      r.setSize(window.innerWidth, window.innerHeight);
      await r.init(); // WebGPU is async; throws if backend unavailable.
      r.xr.enabled = true;
      usingWebGPU = true;
      rnameEl.textContent = 'WebGPU';
      return r;
    } catch (err) {
      console.warn('[cave] WebGPU init failed, falling back to WebGL:', err);
    }
  }
  // WebGL fallback.
  const mod = await import('three');
  THREE = mod;
  const r = new mod.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  r.setPixelRatio(window.devicePixelRatio);
  r.setSize(window.innerWidth, window.innerHeight);
  r.xr.enabled = true;
  r.outputColorSpace = mod.SRGBColorSpace;
  usingWebGPU = false;
  rnameEl.textContent = 'WebGL (WebGPU unavailable)';
  return r;
}

const renderer = await initRenderer();
document.body.appendChild(renderer.domElement);

// VR button setup; gated on the session being supported AND the renderer
// honouring xr.enabled. We lazily kick the session on click.
async function setupVRButton() {
  if (!('xr' in navigator)) { vrBtn.textContent = 'WebXR not available'; return; }
  const supported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  if (!supported) { vrBtn.textContent = 'No immersive-vr device'; return; }
  vrBtn.disabled = false;
  vrBtn.addEventListener('click', async () => {
    if (renderer.xr.getSession()) {
      await renderer.xr.getSession().end();
      return;
    }
    try {
      const session = await navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      });
      await renderer.xr.setSession(session);
    } catch (err) {
      console.error('[cave] failed to enter VR:', err);
      vrBtn.textContent = 'VR failed: ' + err.message;
    }
  });
}
setupVRButton();

renderer.xr.addEventListener('sessionstart', () => {
  document.body.classList.add('vr-active');
  vrBtn.textContent = 'EXIT VR';
});
renderer.xr.addEventListener('sessionend', () => {
  document.body.classList.remove('vr-active');
  vrBtn.textContent = 'ENTER VR';
});

/* ----------------------------------------------------------------------------
   2. Scene, camera, dolly.
   - The "dolly" is a Group that owns the camera and the controller spaces.
     We translate / rotate the dolly to move the player. The headset pose
     composes on top of dolly transform as a child.
   ------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06030c);
scene.fog = new THREE.FogExp2(0x06030c, 0.018);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 400);
camera.position.set(0, 1.6, 0); // ~eye height when standing.

const dolly = new THREE.Group();
dolly.name = 'dolly';
dolly.add(camera);
scene.add(dolly);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ----------------------------------------------------------------------------
   3. Procedural cave generation.
   - Spline path: random walk of control points biased forward, then smoothed
     into a Catmull-Rom curve.
   - At each step along the curve, build a ring of vertices in the curve's
     TBN frame, displaced inward/outward by 3D fractal noise so the wall
     looks rocky rather than tube-y.
   - Stitch rings into a single BufferGeometry with winding flipped so
     normals face inward (the player is inside).
   - Material is a dim purple-grey with vertex-coloured AO baked from
     local curvature (deeper crevices get darker).
   ------------------------------------------------------------------------- */

// Cheap deterministic noise: 3D hash + value noise (smoothstep interpolation).
function hash3(x, y, z) {
  let h = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return h - Math.floor(h);
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function valueNoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smoothstep(xf), v = smoothstep(yf), w = smoothstep(zf);
  const c000 = hash3(xi,   yi,   zi  );
  const c100 = hash3(xi+1, yi,   zi  );
  const c010 = hash3(xi,   yi+1, zi  );
  const c110 = hash3(xi+1, yi+1, zi  );
  const c001 = hash3(xi,   yi,   zi+1);
  const c101 = hash3(xi+1, yi,   zi+1);
  const c011 = hash3(xi,   yi+1, zi+1);
  const c111 = hash3(xi+1, yi+1, zi+1);
  const x00 = c000*(1-u) + c100*u;
  const x10 = c010*(1-u) + c110*u;
  const x01 = c001*(1-u) + c101*u;
  const x11 = c011*(1-u) + c111*u;
  const y0 = x00*(1-v) + x10*v;
  const y1 = x01*(1-v) + x11*v;
  return y0*(1-w) + y1*w;
}
function fbm3(x, y, z, octaves = 4) {
  let s = 0, a = 1, n = 0, freq = 1;
  for (let i = 0; i < octaves; i++) {
    s += valueNoise3(x*freq, y*freq, z*freq) * a;
    n += a;
    a *= 0.5;
    freq *= 2.07;
  }
  return s / n;
}

function buildCave({
  segments = 380,      // path samples
  ringSides = 28,      // vertices around each ring
  baseRadius = 5.5,    // average tunnel radius
  amplitude = 2.2,     // noise displacement
  length = 600         // total length along world Z
} = {}) {
  // Build curve control points: random walk biased forward, with gentle
  // sideways drift so the player can't see straight through the cave.
  const ctrl = [];
  let pos = new THREE.Vector3(0, 1.6, 0);
  ctrl.push(pos.clone());
  const numCtrl = 24;
  for (let i = 1; i < numCtrl; i++) {
    pos = pos.clone().add(new THREE.Vector3(
      (Math.random() - 0.5) * 18,
      (Math.random() - 0.5) * 6,
      -length / numCtrl * (0.85 + Math.random() * 0.3)
    ));
    ctrl.push(pos);
  }
  const curve = new THREE.CatmullRomCurve3(ctrl, false, 'catmullrom', 0.6);

  // Sample curve into points + frames (Frenet-like, but use a stable up
  // reference to avoid the curve flipping at inflection points).
  const points = curve.getPoints(segments);
  const tangents = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i - 1)];
    const b = points[Math.min(points.length - 1, i + 1)];
    tangents[i] = new THREE.Vector3().subVectors(b, a).normalize();
  }
  const up = new THREE.Vector3(0, 1, 0);
  const normals = new Array(points.length);
  const binormals = new Array(points.length);
  for (let i = 0; i < points.length; i++) {
    const t = tangents[i];
    const n = new THREE.Vector3().crossVectors(up, t).normalize();
    if (n.lengthSq() < 0.01) n.set(1, 0, 0);
    const b = new THREE.Vector3().crossVectors(t, n).normalize();
    normals[i] = n;
    binormals[i] = b;
  }

  // Build ring vertices.
  const positions = [];
  const colours = [];
  const indices = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const n = normals[i], b = binormals[i];
    for (let j = 0; j < ringSides; j++) {
      const theta = (j / ringSides) * Math.PI * 2;
      const cs = Math.cos(theta), sn = Math.sin(theta);
      // Sample noise in world space so the displacement is coherent.
      const sample = fbm3(
        p.x * 0.18 + cs * 0.6,
        p.y * 0.18 + sn * 0.6,
        p.z * 0.18 + i * 0.03,
        4
      );
      const r = baseRadius + (sample - 0.5) * 2 * amplitude;
      const vx = p.x + (n.x * cs + b.x * sn) * r;
      const vy = p.y + (n.y * cs + b.y * sn) * r;
      const vz = p.z + (n.z * cs + b.z * sn) * r;
      positions.push(vx, vy, vz);
      // Crevice darkening: where the sample is low, the wall is recessed
      // and gets darker. Tint also drifts subtly along the cave length.
      const dark = 0.35 + sample * 0.55;
      const huedrift = i / points.length;
      const cR = (0.22 + huedrift * 0.05) * dark;
      const cG = (0.18 + 0.04 * Math.sin(i * 0.07)) * dark;
      const cB = (0.30 + huedrift * 0.10) * dark;
      colours.push(cR, cG, cB);
    }
  }
  // Stitch rings into quads (two triangles per quad). Winding is flipped
  // so the player sees the inside surface.
  for (let i = 0; i < points.length - 1; i++) {
    for (let j = 0; j < ringSides; j++) {
      const j2 = (j + 1) % ringSides;
      const a = i * ringSides + j;
      const bIdx = i * ringSides + j2;
      const c = (i + 1) * ringSides + j;
      const d = (i + 1) * ringSides + j2;
      // Inside-facing (CCW when viewed from inside).
      indices.push(a, c, bIdx);
      indices.push(bIdx, c, d);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('color',    new THREE.Float32BufferAttribute(colours, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  // Flip normals so lighting matches inside-facing winding.
  const nAttr = geom.getAttribute('normal');
  for (let i = 0; i < nAttr.count; i++) {
    nAttr.setXYZ(i, -nAttr.getX(i), -nAttr.getY(i), -nAttr.getZ(i));
  }
  nAttr.needsUpdate = true;

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.95,
    metalness: 0.05,
    flatShading: false,
    side: THREE.FrontSide
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.name = 'cave';
  mesh.frustumCulled = false;
  return { mesh, curve, points };
}

const cave = buildCave();
scene.add(cave.mesh);

// Lights: dim ambient + a chain of pointlights along the cave path so the
// player can actually see something more than 4 metres away. We sample
// every Nth path point.
scene.add(new THREE.AmbientLight(0x303060, 0.25));
const torches = [];
{
  const step = 18;
  for (let i = 0; i < cave.points.length; i += step) {
    const p = cave.points[i];
    const hue = 0.7 + (i / cave.points.length) * 0.1;
    const colour = new THREE.Color().setHSL(hue, 0.7, 0.55);
    const light = new THREE.PointLight(colour, 6.0, 28, 1.7);
    light.position.copy(p).add(new THREE.Vector3(0, 1.2, 0));
    scene.add(light);
    // Visible glow ball so the torches read.
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 12, 12),
      new THREE.MeshBasicMaterial({ color: colour })
    );
    ball.position.copy(light.position);
    scene.add(ball);
    torches.push({ light, base: light.intensity });
  }
}

/* ----------------------------------------------------------------------------
   4. Player rig: dolly children for controllers / hands / crosshairs.
   - Two controllers via renderer.xr.getController(i) (raySpace) and
     getControllerGrip(i) (gripSpace, where the controller model lives).
   - We build stylised geometry for the hand rather than importing models.
   - The hand crosshair lives at the tip of the ray, projected onto the
     cave wall via raycast (or fixed distance if no hit).
   ------------------------------------------------------------------------- */

function makeHandMesh(handedness) {
  const group = new THREE.Group();
  const colour = handedness === 'left' ? 0x4ad7ff : 0xff7ac3;
  // Palm box.
  const palm = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.05, 0.13),
    new THREE.MeshStandardMaterial({ color: colour, emissive: colour, emissiveIntensity: 0.15, roughness: 0.4 })
  );
  palm.position.z = -0.02;
  group.add(palm);
  // Barrel cone (rocket muzzle).
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.028, 0.18, 14),
    new THREE.MeshStandardMaterial({ color: 0x222233, emissive: 0x110011, metalness: 0.7, roughness: 0.35 })
  );
  barrel.rotation.x = Math.PI / 2;
  barrel.position.z = -0.12;
  group.add(barrel);
  // Knuckle ring (visual flair).
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.04, 0.008, 8, 18),
    new THREE.MeshStandardMaterial({ color: colour, emissive: colour, emissiveIntensity: 0.5, roughness: 0.3 })
  );
  ring.position.set(0, 0.025, 0);
  group.add(ring);
  return group;
}

function makeCrosshair(colour, size = 0.04) {
  const group = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(size * 0.7, size, 28),
    new THREE.MeshBasicMaterial({ color: colour, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthTest: false })
  );
  group.add(ring);
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(size * 0.18, 12),
    new THREE.MeshBasicMaterial({ color: colour, transparent: true, opacity: 0.95, depthTest: false })
  );
  group.add(dot);
  group.renderOrder = 999;
  return group;
}

// Build the two controllers under the dolly. The ray-space controllers
// receive selectstart/selectend events for the triggers.
const controllers = [null, null];
const grips = [null, null];
const handMeshes = [null, null];
const handCrosshairs = [null, null];

function setupController(idx) {
  const ctrl = renderer.xr.getController(idx);
  dolly.add(ctrl);
  controllers[idx] = ctrl;
  ctrl.addEventListener('connected', (ev) => {
    // Use the inputSource handedness to colour and place the hand mesh.
    const handed = ev.data && ev.data.handedness ? ev.data.handedness : (idx === 0 ? 'left' : 'right');
    ctrl.userData.handed = handed;
    const hand = makeHandMesh(handed);
    handMeshes[idx] = hand;
    ctrl.add(hand);
    // Crosshair: child of ray-space controller, but we reposition it each
    // frame to the raycast hit point along the controller's forward ray.
    const colour = handed === 'left' ? 0x4ad7ff : 0xff7ac3;
    const cross = makeCrosshair(colour, 0.08);
    handCrosshairs[idx] = cross;
    scene.add(cross); // sits in world space; we'll move it manually.
  });
  ctrl.addEventListener('disconnected', () => {
    if (handMeshes[idx])     { ctrl.remove(handMeshes[idx]); handMeshes[idx] = null; }
    if (handCrosshairs[idx]) { scene.remove(handCrosshairs[idx]); handCrosshairs[idx] = null; }
  });
  ctrl.addEventListener('selectstart', () => onTriggerDown(idx));
  ctrl.addEventListener('selectend',   () => onTriggerUp(idx));
  // Grip space for completeness; we don't currently attach anything since
  // the ray-space mesh already reads as a hand. Reserved for later models.
  const grip = renderer.xr.getControllerGrip(idx);
  dolly.add(grip);
  grips[idx] = grip;
}
setupController(0);
setupController(1);

// Head circumpunct crosshair: child of the camera, fixed small distance
// ahead. Always renders on top (depthTest off, renderOrder high). Slightly
// translucent so it doesn't obscure aim.
const headCrosshair = makeCrosshair(0xb69bff, 0.012);
headCrosshair.position.set(0, 0, -0.5);
camera.add(headCrosshair);

/* ----------------------------------------------------------------------------
   5. Movement + nudge-look.
   - In VR we read XR input sources' gamepad axes; in flat mode we read
     WASD + arrow keys.
   - Movement directions are taken from the camera's world yaw (so "forward"
     means the way the headset is facing, ignoring pitch).
   - Snap-turn: when right-stick X crosses 0.7 magnitude, rotate the dolly
     by 30 degrees in that direction. Re-arm only after the stick returns
     under 0.3.
   - Head-aim nudge: each frame we measure the head's yaw offset from the
     dolly's local +Z axis. If |offset| exceeds deadDeg, we ease the dolly
     yaw by (offset - deadDeg) * sensitivity * dt, so a sustained head
     turn slowly carries the body along.
   ------------------------------------------------------------------------- */
const move = {
  moveSpeed: 4.0,                  // m/s
  snapTurnDeg: 30,                 // degrees per snap
  snapTurnArmed: [true, true],     // armed per controller (idx 1 = right)
  headAim: { enabled: true, deadDeg: 14, sensitivity: 1.3 }, // LSS-style nudge
};
const keys = new Set();
window.addEventListener('keydown', (e) => keys.add(e.code));
window.addEventListener('keyup',   (e) => keys.delete(e.code));

// Flat-screen mouse-look (so the POC is testable without a headset).
let flatYaw = 0, flatPitch = 0;
document.addEventListener('click', () => {
  if (!renderer.xr.getSession()) renderer.domElement.requestPointerLock?.();
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  flatYaw   -= e.movementX * 0.0022;
  flatPitch -= e.movementY * 0.0022;
  flatPitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, flatPitch));
});
// Flat-screen mouse-button rockets and Space key for head laser.
document.addEventListener('mousedown', (e) => {
  if (renderer.xr.getSession()) return;
  if (e.button === 0) onTriggerDown(0);
  if (e.button === 2) onTriggerDown(1);
});
document.addEventListener('mouseup', (e) => {
  if (renderer.xr.getSession()) return;
  if (e.button === 0) onTriggerUp(0);
  if (e.button === 2) onTriggerUp(1);
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (renderer.xr.getSession()) return;
  if (e.code === 'Space') fireHeadLaser();
});

// Snap-turn helper: rotate the dolly by `deg` around world Y, but pivot
// around the head's current world XZ so the camera doesn't sweep around
// like a satellite.
const _tmpHeadWorld = new THREE.Vector3();
function snapTurnDolly(deg) {
  const r = THREE.MathUtils.degToRad(deg);
  // Pivot point in world space: the head's current world XZ.
  camera.getWorldPosition(_tmpHeadWorld);
  const dx = dolly.position.x - _tmpHeadWorld.x;
  const dz = dolly.position.z - _tmpHeadWorld.z;
  const cs = Math.cos(r), sn = Math.sin(r);
  dolly.position.x = _tmpHeadWorld.x + (dx * cs - dz * sn);
  dolly.position.z = _tmpHeadWorld.z + (dx * sn + dz * cs);
  dolly.rotation.y += r;
}

// Read XR gamepad axes if a session is active.
function readXRAxes(handed) {
  const session = renderer.xr.getSession();
  if (!session) return null;
  for (const src of session.inputSources) {
    if (src.handedness === handed && src.gamepad) return src.gamepad.axes;
  }
  return null;
}

const _moveScratch = new THREE.Vector3();
const _camForward  = new THREE.Vector3();
const _camRight    = new THREE.Vector3();
const _euler       = new THREE.Euler(0, 0, 0, 'YXZ');
function applyMovement(dt) {
  // Forward direction: camera world quaternion projected onto XZ.
  camera.getWorldDirection(_camForward);
  _camForward.y = 0; _camForward.normalize();
  // Right = forward x up. For forward=(0,0,-1) that's (1,0,0). Setting the
  // components directly avoids allocating a Vector3 every frame.
  _camRight.set(-_camForward.z, 0, _camForward.x);

  let mx = 0, mz = 0;
  if (renderer.xr.getSession()) {
    const left = readXRAxes('left');
    if (left && left.length >= 4) {
      // Most controllers expose [touchpadX, touchpadY, stickX, stickY].
      const sx = left[2] || 0, sy = left[3] || 0;
      const dz = Math.abs(sx) < 0.12 ? 0 : sx;
      const dy = Math.abs(sy) < 0.12 ? 0 : sy;
      mx += dz;
      mz -= dy; // forward stick = negative Y on most VR runtimes.
    }
    const right = readXRAxes('right');
    if (right && right.length >= 4) {
      const rx = right[2] || 0;
      if (Math.abs(rx) > 0.7 && move.snapTurnArmed[1]) {
        snapTurnDolly(-Math.sign(rx) * move.snapTurnDeg);
        move.snapTurnArmed[1] = false;
      } else if (Math.abs(rx) < 0.3) {
        move.snapTurnArmed[1] = true;
      }
    }
  } else {
    if (keys.has('KeyW')) mz -= 1;
    if (keys.has('KeyS')) mz += 1;
    if (keys.has('KeyA')) mx -= 1;
    if (keys.has('KeyD')) mx += 1;
    if (keys.has('KeyQ') && move.snapTurnArmed[1]) { snapTurnDolly( move.snapTurnDeg); move.snapTurnArmed[1] = false; }
    else if (!keys.has('KeyQ')) move.snapTurnArmed[1] = true;
    if (keys.has('KeyE') && move.snapTurnArmed[0]) { snapTurnDolly(-move.snapTurnDeg); move.snapTurnArmed[0] = false; }
    else if (!keys.has('KeyE')) move.snapTurnArmed[0] = true;
    // Flat-screen yaw/pitch is layered onto the dolly so the camera reads
    // the same way it does in VR.
    dolly.rotation.y = flatYaw;
    camera.rotation.x = flatPitch;
    camera.rotation.y = 0;
    camera.rotation.z = 0;
  }

  _moveScratch.set(0, 0, 0)
    .addScaledVector(_camForward, -mz)
    .addScaledVector(_camRight,    mx);
  if (_moveScratch.lengthSq() > 1e-6) {
    _moveScratch.normalize().multiplyScalar(move.moveSpeed * dt);
    dolly.position.add(_moveScratch);
  }
}

// Head-aim nudge: yaw the dolly toward where the head is facing when the
// head has been turned past the dead zone. Only meaningful in VR (in flat
// mode camera yaw = dolly yaw by construction, so offset is always 0).
const _headQuat = new THREE.Quaternion();
const _dollyQuatInv = new THREE.Quaternion();
function applyHeadAimNudge(dt) {
  if (!move.headAim.enabled) return;
  if (!renderer.xr.getSession()) return;
  // Head orientation in dolly-local space = invert(dollyWorld) * headWorld.
  camera.getWorldQuaternion(_headQuat);
  dolly.getWorldQuaternion(_dollyQuatInv).invert();
  _headQuat.premultiply(_dollyQuatInv);
  _euler.setFromQuaternion(_headQuat, 'YXZ');
  const yawDeg = THREE.MathUtils.radToDeg(_euler.y);
  const dead = move.headAim.deadDeg;
  if (Math.abs(yawDeg) > dead) {
    const excess = (Math.abs(yawDeg) - dead) * Math.sign(yawDeg);
    const rotRad = THREE.MathUtils.degToRad(excess) * move.headAim.sensitivity * dt;
    dolly.rotation.y += rotRad;
  }
}

/* ----------------------------------------------------------------------------
   6. Weapons.
   - Rocket: emissive sphere with a stretched trail; travels forward along
     a stored direction; on cave-mesh hit it spawns a brief flash and is
     pooled out.
   - Head laser: instant beam from camera forward to the first cave hit
     (or 200 m). Visible for ~280 ms, fades out.
   - Trigger logic: when a trigger goes down, we schedule a rocket fire
     after BOTH_WINDOW ms. If the other trigger is already down OR goes
     down within that window, we cancel both pending rockets and fire the
     head laser instead. This means rockets are always slightly delayed
     in VR (the user sees a ~100 ms gating window) but it's the simplest
     way to implement the "press both" gesture without modal toggles.
   ------------------------------------------------------------------------- */
const BOTH_WINDOW = 100; // ms
const triggerState = [false, false];
const pendingRocket = [null, null]; // setTimeout ids
const rockets = [];
const lasers = [];

function onTriggerDown(idx) {
  triggerState[idx] = true;
  const other = idx ^ 1;
  if (triggerState[other]) {
    // Both held. Cancel pending and fire head laser.
    if (pendingRocket[other]) { clearTimeout(pendingRocket[other]); pendingRocket[other] = null; }
    if (pendingRocket[idx])   { clearTimeout(pendingRocket[idx]);   pendingRocket[idx]   = null; }
    fireHeadLaser();
    return;
  }
  // Schedule rocket; if the other trigger arrives during the window, this
  // will be cancelled in the branch above.
  pendingRocket[idx] = setTimeout(() => {
    pendingRocket[idx] = null;
    if (triggerState[idx]) fireRocket(idx);
  }, BOTH_WINDOW);
}
function onTriggerUp(idx) {
  triggerState[idx] = false;
  if (pendingRocket[idx]) { clearTimeout(pendingRocket[idx]); pendingRocket[idx] = null; }
}

function fireRocket(idx) {
  const ctrl = controllers[idx];
  if (!ctrl) return;
  // Rocket origin and direction = the controller's ray-space forward.
  // In flat mode there's no ray-space controller transform, so we fall
  // back to camera forward offset to the side that mouse button it was.
  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();
  if (renderer.xr.getSession()) {
    ctrl.getWorldPosition(origin);
    ctrl.getWorldDirection(dir);
    dir.multiplyScalar(-1); // controller forward is -Z in ray space.
  } else {
    camera.getWorldPosition(origin);
    camera.getWorldDirection(dir);
    // Offset slightly to the side so left/right click feel different.
    const _r = new THREE.Vector3(dir.z, 0, -dir.x).normalize().multiplyScalar(idx === 0 ? -0.25 : 0.25);
    origin.add(_r).add(new THREE.Vector3(0, -0.15, 0));
  }
  const colour = idx === 0 ? 0x4ad7ff : 0xff7ac3;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 12, 10),
    new THREE.MeshBasicMaterial({ color: colour })
  );
  mesh.position.copy(origin);
  const glow = new THREE.PointLight(colour, 5, 6, 1.8);
  mesh.add(glow);
  scene.add(mesh);
  rockets.push({ mesh, dir: dir.clone(), speed: 28, life: 4.0, colour });
}

function fireHeadLaser() {
  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();
  camera.getWorldPosition(origin);
  camera.getWorldDirection(dir);
  // Raycast against cave to find termination.
  const ray = new THREE.Raycaster(origin, dir, 0.2, 200);
  const hits = ray.intersectObject(cave.mesh, false);
  const dist = hits.length ? hits[0].distance : 200;
  // Build a thin cylinder oriented along dir.
  const geom = new THREE.CylinderGeometry(0.012, 0.012, dist, 12, 1, true);
  geom.translate(0, dist / 2, 0);
  geom.rotateX(Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xfff2c8, transparent: true, opacity: 1.0 });
  const beam = new THREE.Mesh(geom, mat);
  beam.position.copy(origin);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
  scene.add(beam);
  // Flash at the hit point.
  if (hits.length) {
    const flash = new THREE.PointLight(0xfff2c8, 30, 14, 2);
    flash.position.copy(hits[0].point);
    scene.add(flash);
    setTimeout(() => scene.remove(flash), 200);
  }
  lasers.push({ mesh: beam, life: 0.28, maxLife: 0.28 });
}

// Update rockets each frame; on impact, despawn and add a flash.
const _rocketRay = new THREE.Raycaster();
function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    const step = r.speed * dt;
    _rocketRay.set(r.mesh.position, r.dir);
    _rocketRay.far = step + 0.1;
    const hits = _rocketRay.intersectObject(cave.mesh, false);
    if (hits.length) {
      const p = hits[0].point;
      const flash = new THREE.PointLight(r.colour, 28, 16, 2);
      flash.position.copy(p);
      scene.add(flash);
      setTimeout(() => scene.remove(flash), 220);
      scene.remove(r.mesh);
      rockets.splice(i, 1);
      continue;
    }
    r.mesh.position.addScaledVector(r.dir, step);
    r.life -= dt;
    if (r.life <= 0) { scene.remove(r.mesh); rockets.splice(i, 1); }
  }
}
function updateLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.life -= dt;
    if (l.life <= 0) { scene.remove(l.mesh); l.mesh.geometry.dispose(); l.mesh.material.dispose(); lasers.splice(i, 1); continue; }
    l.mesh.material.opacity = l.life / l.maxLife;
  }
}

/* ----------------------------------------------------------------------------
   7. Hand crosshairs: each frame, raycast from each controller's ray space
      against the cave; place the crosshair at the hit point, or at a
      fixed 8 m distance if no hit. Also keep the crosshair facing the
      camera so the ring reads as a ring instead of an edge.
   ------------------------------------------------------------------------- */
const _ctrlPos = new THREE.Vector3();
const _ctrlDir = new THREE.Vector3();
function updateHandCrosshairs() {
  for (let i = 0; i < 2; i++) {
    const ctrl = controllers[i];
    const cross = handCrosshairs[i];
    if (!ctrl || !cross) continue;
    ctrl.getWorldPosition(_ctrlPos);
    ctrl.getWorldDirection(_ctrlDir).multiplyScalar(-1);
    _rocketRay.set(_ctrlPos, _ctrlDir);
    _rocketRay.far = 60;
    const hits = _rocketRay.intersectObject(cave.mesh, false);
    if (hits.length) {
      cross.position.copy(hits[0].point).addScaledVector(_ctrlDir, -0.04);
    } else {
      cross.position.copy(_ctrlPos).addScaledVector(_ctrlDir, 8);
    }
    cross.lookAt(camera.getWorldPosition(new THREE.Vector3()));
  }
}

/* ----------------------------------------------------------------------------
   8. Main loop. setAnimationLoop handles both flat (rAF) and XR (display
      cadence). Time is in seconds; we cap dt to avoid teleporting after
      a tab switch.
   ------------------------------------------------------------------------- */
let lastT = performance.now() / 1000;
renderer.setAnimationLoop(() => {
  const now = performance.now() / 1000;
  let dt = Math.min(0.05, now - lastT);
  lastT = now;

  applyMovement(dt);
  applyHeadAimNudge(dt);
  updateRockets(dt);
  updateLasers(dt);
  updateHandCrosshairs();

  // Subtle torch flicker for atmosphere.
  for (const t of torches) {
    t.light.intensity = t.base * (0.85 + 0.3 * Math.sin(now * 6 + t.light.position.x));
  }

  renderer.render(scene, camera);
});

console.log('[cave] init complete. WebGPU =', usingWebGPU);
</script>
</body>
