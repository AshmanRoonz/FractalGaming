# Deploys the LSS TTS Worker to Cloudflare whenever you push changes to
# LSS/tts-backend/**. The Worker source lives on GitHub; the actual service
# runs on Cloudflare's edge once this Action completes.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - https://dash.cloudflare.com/profile/api-tokens
#                            Use the "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  - shown on the right side of any Cloudflare page
#                            (https://dash.cloudflare.com/<account-id>/)
#
# Optional:
#   ELEVENLABS_API_KEY     - sets the secret on the deployed worker
#                            (only needed if you want ElevenLabs voices)

name: Deploy TTS backend

on:
  push:
    branches: [main, master]
    paths:
      - "LSS/tts-backend/**"
      - ".github/workflows/deploy-tts-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: LSS/tts-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: LSS/tts-backend
          command: deploy

      # OPTIONAL: push the ElevenLabs API key as a Worker secret after deploy.
      # Runs only when both the deploy succeeded AND the repo secret is set.
      # If you do not use ElevenLabs, leave the secret unset; this step is
      # silently skipped by the GitHub-native `if:` guard.
      - name: Push ElevenLabs secret (optional)
        if: ${{ success() && env.ELEVENLABS_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
        run: echo "$ELEVENLABS_API_KEY" | npx wrangler secret put ELEVENLABS_API_KEY
