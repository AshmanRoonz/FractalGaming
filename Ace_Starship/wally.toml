[package]
name = "ashroney/ace-starship"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# Networking: typed, ergonomic RemoteEvent/RemoteFunction wrapper.
ByteNet = "ffrostfall/bytenet@0.4.4"
# Lightweight signal class (events without RemoteEvents, for in-game code).
Signal = "sleitnick/signal@2.0.1"
# Promise for async flows (DataStore loads, asset streaming).
Promise = "evaera/promise@4.0.0"
# Profile-based DataStore wrapper for safe banked progress / session locking.
ProfileStore = "loleris/profilestore@1.0.4"

[server-dependencies]

[dev-dependencies]
# Testing framework.
Jest = "jsdotlua/jest@3.10.0"
