# Rokit toolchain manifest for Ace Starship.
# Install Rokit (https://github.com/rojo-rbx/rokit), then run `rokit install`
# in this folder to get every tool below pinned to the same version for everyone.

[tools]
rojo = "rojo-rbx/rojo@7.5.1"
wally = "UpliftGames/wally@0.3.2"
stylua = "JohnnyMorganz/StyLua@2.0.2"
selene = "Kampfkarren/selene@0.28.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.32.1"
