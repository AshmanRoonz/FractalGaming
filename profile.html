<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Ship Sailing ; Player Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050510;
    --bg-elev: #0d0d1c;
    --bg-card: #0e0e1d;
    --bg-card-hover: #15152a;
    --text: #d8d8e0;
    --text-dim: #888899;
    --text-faint: #555566;
    --accent: #ffaa00;
    --accent-dim: rgba(255,170,0,0.35);
    --accent-bg: rgba(255,170,0,0.10);
    --discord: #5865F2;
    --rule: rgba(80,80,120,0.3);
    --good: #66cc66;
    --bad:  #ff6644;
    --you: #ffaa00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  header.page {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--rule);
    background: linear-gradient(to bottom, rgba(255,170,0,0.04), transparent);
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  header.page .logo-link {
    display: flex; align-items: center; gap: 14px;
    color: inherit; text-decoration: none;
  }
  header.page .logo-link img {
    width: 56px; height: 56px;
    filter: drop-shadow(0 0 14px var(--accent-dim));
  }
  header.page h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 18px var(--accent-dim);
  }
  header.page .tagline {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  header.page .nav {
    margin-left: auto;
    display: flex; gap: 18px; align-items: center;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  }
  header.page .nav a {
    color: var(--text-dim); text-decoration: none;
    border-bottom: 1px dotted transparent;
    transition: color 120ms;
  }
  header.page .nav a:hover { color: var(--accent); border-bottom-color: var(--accent-dim); }
  header.page .nav a.cta {
    background: var(--accent); color: #050510;
    padding: 8px 18px; font-weight: 700; border-radius: 2px;
    border: none;
  }
  header.page .nav a.cta:hover { background: #ffc640; color: #050510; border-bottom: 0; }

  main {
    padding: 0 32px 64px;
    max-width: 1280px;
    margin: 0 auto;
  }

  .status-line {
    padding: 80px 0;
    color: var(--text-dim); font-size: 13px; letter-spacing: 1px;
    text-align: center;
  }
  .status-line.error { color: var(--bad); }
  .status-line button {
    background: var(--accent); color: #050510;
    border: none; padding: 8px 18px; margin-left: 12px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700; cursor: pointer;
    border-radius: 2px;
  }
  .status-line button:hover { background: #ffc640; }

  /* ---- Player header card ---- */
  .player-hero {
    margin: 28px 0;
    padding: 28px;
    background: var(--bg-elev);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  }
  .player-hero img.avatar {
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid var(--discord);
    background: #1a1a30;
    flex-shrink: 0;
  }
  .player-hero .id-block { flex: 1; min-width: 200px; }
  .player-hero .display-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 0;
    word-break: break-word;
  }
  .player-hero .joined {
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .player-hero .you-badge {
    display: inline-block;
    margin-left: 8px;
    background: var(--accent); color: #050510;
    padding: 3px 10px; font-size: 9px;
    letter-spacing: 2px; font-weight: 700;
    border-radius: 2px; vertical-align: middle;
  }

  /* ---- Mode toggle ---- */
  .toggle-group {
    display: flex; border: 1px solid var(--rule); border-radius: 2px;
    overflow: hidden;
  }
  .toggle-group button {
    background: transparent; color: var(--text-dim);
    border: none; padding: 9px 18px;
    font-family: inherit; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .toggle-group button:hover { color: var(--text); background: var(--bg-elev); }
  .toggle-group button.active {
    color: #050510; background: var(--accent); font-weight: 700;
  }

  /* ---- Stat grid ---- */
  .section-h {
    margin: 36px 0 14px;
    font-family: 'Orbitron', sans-serif;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 14px 16px;
  }
  .stat-card .lbl {
    font-size: 9px; color: var(--text-faint);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-card .val {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px; font-weight: 700;
    color: var(--text);
  }
  .stat-card .val.accent { color: var(--accent); }
  .stat-card .val.good   { color: var(--good); }
  .stat-card .val.bad    { color: var(--bad); }
  .stat-card .sub {
    font-size: 10px; color: var(--text-faint);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ---- Recent matches list ---- */
  .matches-list {
    display: flex; flex-direction: column; gap: 6px;
  }
  .match-row {
    background: var(--bg-card);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--rule);
    border-radius: 2px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: var(--text);
    transition: background 120ms, border-color 120ms;
  }
  .match-row:hover {
    background: var(--bg-card-hover);
    border-left-color: var(--accent);
  }
  .match-row.win  { border-left-color: var(--good); }
  .match-row.loss { border-left-color: var(--bad);  }
  .match-row .result {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    width: 64px; flex-shrink: 0;
  }
  .match-row.win  .result { color: var(--good); }
  .match-row.loss .result { color: var(--bad); }
  .match-row .map {
    color: var(--text); font-size: 12px;
    width: 140px;
  }
  .match-row .loadout {
    color: var(--accent); font-size: 11px;
    letter-spacing: 1px;
    width: 100px;
  }
  .match-row .stat-line {
    flex: 1; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .match-row .stat-line strong { color: var(--text); }
  .match-row .when {
    color: var(--text-faint); font-size: 10px;
    letter-spacing: 1px;
    text-align: right;
  }
  .match-row .mvp-pip {
    background: rgba(255,170,0,0.18);
    color: var(--accent);
    padding: 2px 6px; border-radius: 2px;
    font-size: 9px; letter-spacing: 1.5px;
    border: 1px solid rgba(255,170,0,0.4);
  }

  .empty-block {
    color: var(--text-faint); font-size: 11px;
    letter-spacing: 1px; padding: 18px;
    text-align: center; font-style: italic;
  }

  footer.page {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-faint); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
    border-top: 1px solid var(--rule);
    margin-top: 40px;
  }
  footer.page a { color: var(--text-dim); text-decoration: none; margin: 0 8px; }
  footer.page a:hover { color: var(--accent); }

  @media (max-width: 720px) {
    main { padding: 0 12px 40px; }
    header.page { padding: 18px 16px 14px; gap: 14px; }
    header.page h1 { font-size: 18px; letter-spacing: 3px; }
    .player-hero { padding: 18px; gap: 16px; }
    .player-hero img.avatar { width: 64px; height: 64px; }
    .match-row { flex-wrap: wrap; gap: 8px; }
    .match-row .map { width: auto; }
    .match-row .loadout { width: auto; }
  }
</style>
</head>
<body>

<header class="page">
  <a href="index.html" class="logo-link">
    <img src="LSS.png" alt="LSS">
    <div>
      <h1>Profile</h1>
      <div class="tagline">Last Ship Sailing</div>
    </div>
  </a>
  <div class="nav">
    <a href="index.html" class="cta">PLAY</a>
    <a href="leaderboard.html">leaderboard</a>
    <a href="rooms.html">rooms</a>
    <a href="terms.html">terms</a>
    <a href="privacy.html">privacy</a>
  </div>
</header>

<main>
  <div id="status" class="status-line">Loading profile...</div>
  <div id="content" style="display:none;">
    <!-- Player hero -->
    <section class="player-hero">
      <img id="avatar" class="avatar" src="" alt="">
      <div class="id-block">
        <h2 class="display-name" id="display-name">Player</h2>
        <div class="joined" id="joined-info"></div>
      </div>
    </section>

    <!-- Mode toggle + career stats -->
    <h3 class="section-h">
      <span>Career Stats</span>
      <div class="toggle-group" id="mode-toggle">
        <button data-mode="combined" class="active">Combined</button>
        <button data-mode="solo">Solo</button>
        <button data-mode="mp">Multiplayer</button>
      </div>
    </h3>
    <div class="stat-grid" id="stat-grid"></div>

    <!-- Loadout breakdown -->
    <h3 class="section-h">Loadout Breakdown</h3>
    <div id="loadout-list"></div>

    <!-- Recent matches -->
    <h3 class="section-h">Recent Matches</h3>
    <div class="matches-list" id="matches-list"></div>

    <!-- Achievements -->
    <h3 class="section-h">Achievements</h3>
    <div id="achievements-list"></div>
  </div>
</main>

<footer class="page">
  <a href="https://fractalreality.ca">fractalreality.ca</a>
  <a href="https://github.com/ashmanroonz">github</a>
  ; profiles backed by Cloudflare D1 ;
</footer>

<script>
  const API_BASE = 'https://lss-backend.ashroney.workers.dev';
  let data = null;
  let currentMode = 'combined';

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function meDiscordId() {
    try {
      const raw = localStorage.getItem('lss_discord_user');
      const u = raw ? JSON.parse(raw) : null;
      return u && u.id ? u.id : null;
    } catch (_) { return null; }
  }

  function getProfileId() {
    const url = new URL(window.location.href);
    return url.searchParams.get('id') || meDiscordId();
  }

  function setStatus(text, isError) {
    const el = document.getElementById('status');
    el.textContent = text || '';
    el.className = 'status-line' + (isError ? ' error' : '');
    el.style.display = text ? '' : 'none';
  }

  function setRetryButton() {
    const el = document.getElementById('status');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Retry';
    btn.addEventListener('click', () => loadProfile());
    el.appendChild(btn);
  }

  function fmtDate(ms) {
    if (!ms) return '-';
    const d = new Date(ms);
    return d.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function fmtRelativeTime(ms) {
    if (!ms) return '-';
    const sec = Math.floor((Date.now() - ms) / 1000);
    if (sec < 60)        return sec + 's ago';
    if (sec < 3600)      return Math.floor(sec / 60) + 'm ago';
    if (sec < 86400)     return Math.floor(sec / 3600) + 'h ago';
    if (sec < 86400 * 7) return Math.floor(sec / 86400) + 'd ago';
    return fmtDate(ms);
  }

  function fmtNum(n) {
    if (n == null) return '-';
    return Number(n).toLocaleString();
  }

  function fmtMaybeNull(n) {
    return n == null ? '-' : fmtNum(n);
  }

  // ---- Render: player hero ----
  function renderHero() {
    const me = meDiscordId();
    const isMe = data.player.discord_id === me;
    document.getElementById('avatar').src = data.player.avatar_url || '';
    document.getElementById('avatar').alt = data.player.display_name || '';
    const nameEl = document.getElementById('display-name');
    nameEl.textContent = data.player.display_name || data.player.username || 'Player';
    if (isMe) {
      const badge = document.createElement('span');
      badge.className = 'you-badge';
      badge.textContent = 'YOU';
      nameEl.appendChild(badge);
    }
    const joined = document.getElementById('joined-info');
    joined.textContent = 'Joined ' + fmtDate(data.player.created_at) +
                        ' ; last seen ' + fmtRelativeTime(data.player.last_seen);
  }

  // ---- Render: stat grid (per-mode) ----
  function renderStats() {
    const stats = data.stats[currentMode] || {};
    const grid  = document.getElementById('stat-grid');
    grid.innerHTML = '';
    const cards = [
      { lbl: 'Matches',     val: fmtNum(stats.matches),  klass: '' },
      { lbl: 'Wins',        val: fmtNum(stats.wins),     klass: 'good',   sub: 'Losses ' + fmtNum(stats.losses) },
      { lbl: 'Win Rate',    val: stats.win_rate != null ? Math.round(stats.win_rate * 100) + '%' : '-', klass: 'accent' },
      { lbl: 'Total Kills', val: fmtNum(stats.kills),    klass: '' },
      { lbl: 'K/D Ratio',   val: stats.kd != null ? Number(stats.kd).toFixed(2) : '-', klass: 'accent' },
      { lbl: 'Total Deaths',val: fmtNum(stats.deaths),   klass: 'bad' },
      { lbl: 'Total Damage',val: fmtNum(stats.damage),   klass: '' },
      { lbl: 'Avg Kills/Match',  val: stats.avg_kills  != null ? Number(stats.avg_kills).toFixed(1) : '-', klass: '' },
      { lbl: 'Avg Damage/Match', val: stats.avg_damage != null ? fmtNum(stats.avg_damage) : '-', klass: '' },
      { lbl: 'Best Single Match (Kills)',  val: fmtNum(stats.max_kills),  klass: 'accent', sub: 'Min ' + fmtMaybeNull(stats.min_kills) },
      { lbl: 'Best Single Match (Damage)', val: fmtNum(stats.max_damage), klass: 'accent', sub: 'Min ' + fmtMaybeNull(stats.min_damage) },
      { lbl: 'Worst Single Match (Deaths)',val: fmtNum(stats.max_deaths), klass: 'bad',    sub: 'Min ' + fmtMaybeNull(stats.min_deaths) },
    ];
    if (!stats.matches || stats.matches === 0) {
      const note = document.createElement('div');
      note.className = 'empty-block';
      note.textContent = currentMode === 'combined'
        ? 'No matches recorded yet.'
        : 'No ' + (currentMode === 'mp' ? 'multiplayer' : currentMode) + ' matches recorded yet.';
      grid.appendChild(note);
      return;
    }
    cards.forEach(c => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `
        <div class="lbl">${c.lbl}</div>
        <div class="val ${c.klass}">${c.val}</div>
        ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
      `;
      grid.appendChild(card);
    });
  }

  // ---- Render: loadout breakdown ----
  function renderLoadouts() {
    const ls = data.loadout_stats || [];
    const container = document.getElementById('loadout-list');
    container.innerHTML = '';
    if (ls.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-block';
      empty.textContent = 'No loadout data yet.';
      container.appendChild(empty);
      return;
    }
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;';
    ls.forEach(l => {
      const kd = l.deaths > 0 ? (l.kills / l.deaths).toFixed(2) : (l.kills || '0');
      const winRate = l.matches > 0 ? Math.round((l.wins / l.matches) * 100) + '%' : '-';
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `
        <div class="lbl" style="color:var(--accent);font-weight:700;">${escapeHtml(l.loadout_key)}</div>
        <div class="sub" style="margin-top:8px;">
          <strong>${fmtNum(l.matches)}</strong> matches ; <strong>${fmtNum(l.wins)}</strong>W (${winRate})<br>
          <strong>${fmtNum(l.kills)}</strong>K / <strong>${fmtNum(l.deaths)}</strong>D ; KD ${kd}<br>
          ${fmtNum(l.damage_dealt)} damage ; ${fmtNum(l.mvp_count || 0)} MVP
        </div>
      `;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  // ---- Render: recent matches ----
  function renderRecentMatches() {
    const ms = data.recent_matches || [];
    const list = document.getElementById('matches-list');
    list.innerHTML = '';
    if (ms.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-block';
      empty.textContent = 'No matches yet.';
      list.appendChild(empty);
      return;
    }
    ms.forEach(m => {
      const a = document.createElement('a');
      a.className = 'match-row ' + (m.is_winner ? 'win' : 'loss');
      a.href = 'match.html?id=' + encodeURIComponent(m.id);
      a.innerHTML = `
        <div class="result">${m.is_winner ? 'WIN' : 'LOSS'}</div>
        <div class="map">${escapeHtml(m.map_key || '-')}</div>
        <div class="loadout">${escapeHtml(m.loadout_key || '-')}</div>
        <div class="stat-line">
          <strong>${fmtNum(m.kills)}</strong> K
          ; <strong>${fmtNum(m.deaths)}</strong> D
          ${m.is_mvp ? ' <span class="mvp-pip">MVP</span>' : ''}
        </div>
        <div class="when">${fmtRelativeTime(m.started_at)}</div>
      `;
      list.appendChild(a);
    });
  }

  // ---- Render: achievements ----
  function renderAchievements() {
    const list = data.achievements || [];
    const container = document.getElementById('achievements-list');
    container.innerHTML = '';
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-block';
      empty.textContent = 'No achievements unlocked yet ; keep playing.';
      container.appendChild(empty);
      return;
    }
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;';
    list.forEach(a => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `
        <div class="lbl" style="color:var(--accent);">${escapeHtml(a.type)}</div>
        <div class="sub" style="margin-top:4px;">${fmtRelativeTime(a.achieved_at)}</div>
      `;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  // ---- Mode toggle ----
  document.getElementById('mode-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const mode = btn.dataset.mode;
    if (!mode || mode === currentMode) return;
    currentMode = mode;
    document.querySelectorAll('#mode-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    renderStats();
  });

  async function loadProfile() {
    const id = getProfileId();
    if (!id) {
      setStatus('No profile id provided. Sign in or visit a profile from the leaderboard.', true);
      return;
    }
    setStatus('Loading profile...');
    document.getElementById('content').style.display = 'none';
    try {
      const res = await fetch(API_BASE + '/player/' + encodeURIComponent(id));
      if (res.status === 404) {
        setStatus('Player not found. They may have deleted their data, or never played a match.', true);
        return;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
      setStatus('');
      document.getElementById('content').style.display = '';
      renderHero();
      renderStats();
      renderLoadouts();
      renderRecentMatches();
      renderAchievements();
    } catch (err) {
      console.error('[profile] fetch failed:', err);
      setStatus('Failed to load profile: ' + (err && err.message || err), true);
      setRetryButton();
    }
  }

  loadProfile();
</script>

</body>
</html>
